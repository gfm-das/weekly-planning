# Serves the chart builder harness like the manager serves /_manager/chart/ (chart-access.mjs builderFiles).
#   docker run --rm -d --name gfm-test-builder --memory 128m -p 127.0.0.1:18090:8080 \
#     -v <repo>/slidev/manager:/manager:ro -v <repo>/slidev/tests/builder-harness:/h:ro \
#     -v <repo>/slidev/tests/builder-harness/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
server {
  listen 8080;
  root /h;
  add_header Cache-Control no-store;
  location = / { try_files /index.html =404; }
  # studio.html as it is (its placeholders unfilled and no session): enough to check the top bar's layout.
  location = /studio.html { default_type text/html; alias /manager/studio.html; }
  location ~ ^/_manager/chart/(chart-builder\.mjs|safe-chart-option\.mjs)$ { default_type application/javascript; alias /manager/$1; }
  location ~ ^/_manager/chart/(chart-core|chart-engine|chart-schema|chart-spec|chart-builder-core)\.mjs$ { default_type application/javascript; alias /manager/gfm-addon/lib/$1.mjs; }
  location ~ ^/_manager/chart/(echarts|ecStat)\.min\.js$ { default_type application/javascript; alias /manager/vendor/$1.min.js; }
}
