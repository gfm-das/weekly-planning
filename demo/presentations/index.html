<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Presentations</title>
<script>
// The portal's theme before the first paint (gfm_portal_layout_v1), then every change the shell sends.
(function () {
  var set = function (t) { document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : 'mission'; };
  try { set((JSON.parse(localStorage.getItem('gfm_portal_layout_v1') || 'null') || {}).theme); } catch (e) { set('mission'); }
  addEventListener('message', function (e) { if (e.data && e.data.type === 'portal-theme') set(e.data.theme); });
  try { parent.postMessage({ type: 'portal-theme-request' }, '*'); } catch (e) {}
})();
</script>
<link rel="stylesheet" href="page.css">
</head>
<body>
<header class="top">
  <div><h1>Presentations</h1><div class="sub">Demo: the library of a fresh install.</div></div>
  <button class="primary" type="button" id="new">+ New Presentation</button>
</header>
<main class="lib">
  <div class="toolbar" id="count"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
// A fresh install has no decks; "+ New Presentation" makes a blank one in the full system.
document.getElementById('count').textContent = '0 presentations';
document.getElementById('grid').innerHTML = '<div class="empty">No presentations yet. Click + New Presentation to start one.</div>';
document.getElementById('new').addEventListener('click', () => {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = 'Making and editing presentations needs the full system.';
  document.body.append(t); setTimeout(() => t.remove(), 3500);
});
</script>
</body>
</html>
