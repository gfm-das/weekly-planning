<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Not in the demo</title>
<style>
:root{color-scheme:light}[data-theme="dark"]{color-scheme:dark}
body{font-family:Inter,system-ui,sans-serif;margin:0;padding:40px 24px;background:#eef4f5;color:#183240}
[data-theme="dark"] body{background:#101a21;color:#edf7f8}
.card{max-width:520px;margin:40px auto;background:#fff;border:1px solid #dce7ea;border-radius:16px;padding:24px}
[data-theme="dark"] .card{background:#18262f;border-color:#2d414b}
a{color:#087f8c}[data-theme="dark"] a{color:#5cc6cf}
</style>
<script>(function(){try{var t=(JSON.parse(localStorage.getItem("gfm_portal_layout_v1")||"null")||{}).theme||"mission";document.documentElement.dataset.theme=t}catch(e){}addEventListener("message",function(e){if(e.data&&e.data.type==="portal-theme")document.documentElement.dataset.theme=e.data.theme||"mission"})})()</script>
</head>
<body><div class="card"><h2>This part needs the full system</h2>
<p>The demo shows Overview, Call-ins, Calendar and Announcements with made-up data. Weekly Planning, Dashboards, Presentations and DA Management run on your own server.</p>
<p><a href="https://github.com/gfm-das/weekly-planning/releases/latest" target="_top">Download the system</a></p></div></body>
</html>
