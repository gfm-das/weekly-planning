# TEST ONLY (round 6, edge_i18n.ps1): the worktree's portal/ with the made-up APIs of the stub servers, so the shell,
# the Overview, Weekly Planning, Call-ins, the calendar and announcements open in one browser without a database:
#   /api/callins*            -> tests/callins_stub_api.py   (container gfm-test-i18n-callins, port 8091)
#   /api/planning, overview  -> tests/planning_stub_api.py  (container gfm-test-i18n-planning, port 8080)
#   /, /index.html, /api/    -> tests/portal_stub_api.py    (container gfm-test-i18n-shell, port 8080; the shell's index.html)
server {
  listen 80;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s;
  set $callins http://gfm-test-i18n-callins:8091;
  set $planning http://gfm-test-i18n-planning:8080;
  set $shell http://gfm-test-i18n-shell:8080;
  location = / { proxy_pass $shell/; }
  location = /index.html { proxy_pass $shell/; }
  location /api/callins { proxy_pass $callins$request_uri; }
  location /api/planning/ { proxy_pass $planning$request_uri; }
  location /api/overview { proxy_pass $planning$request_uri; }
  location /api/ { proxy_pass $shell$request_uri; }
  location /stub/ { proxy_pass $shell$request_uri; }
  location ^~ /i18n/ { add_header Access-Control-Allow-Origin "*" always; add_header Cache-Control "no-cache" always; }
  location / { add_header Cache-Control "no-cache" always; }
}
