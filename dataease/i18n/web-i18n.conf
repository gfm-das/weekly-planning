# DataEase in the mission portal's 14 languages: the nginx pieces for gfm-dataease-web (see README.md here).
#
# compose.yml mounts this folder read-only at /etc/nginx/gfm-i18n (not in conf.d, so nginx does not load it
# at the http level on its own), and web/default.conf includes this file inside its server block:
#     include /etc/nginx/gfm-i18n/web-i18n.conf;
#
# This file only serves the script and the language files. Adding the script to DataEase's app page takes ONE
# more line, inside default.conf's own app-page location (location ~ ^/(index\.html|mobile\.html)?$), right after
# its existing sub_filter (it is there):
#     sub_filter '</head>' '<script src="/gfm-i18n/gfm-i18n.js"></script></head>';
# It cannot live in this file: a location that has sub_filter directives of its own (the app-page location has
# the boot.js one on '<head>') does not inherit any from the server level, so the line must sit next to it.
# How the two combine in that location: nginx applies every sub_filter of the location to the same response;
# the location already has Accept-Encoding "" (so the body is not compressed and can be rewritten), the default
# sub_filter_types text/html, and sub_filter_once on, which means each pattern is replaced once. '<head>' (boot.js)
# and '</head>' (this script) are different strings, so both happen, in one pass. Never list the same pattern
# twice: if the boot.js line ever moves to '</head>' too, merge both scripts into one sub_filter.
# boot.js runs first (it must: DataEase reads its settings as its page starts); DataEase's own module script is
# deferred, so this plain script also runs before DataEase's first render and is watching when it happens.
# The sign-in, refusal and "starting" pages of web/gfm/ load the script themselves (no sign-in is needed here).

# The script and the 14 language files: exactly these names, nothing else from the folder.
location ~ ^/gfm-i18n/(gfm-i18n\.js|(?:en|de|es|fr|pt|uk|ru|it|tr|fa|ro|sv|da|ar)\.json)$ {
    alias /etc/nginx/gfm-i18n/$1;
    access_log off;
    charset utf-8;
    charset_types application/javascript application/json;
    # Checked again on every page (cheap 304s), so an updated file is used at once.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    gzip on;
    gzip_types application/javascript application/json;
    gzip_min_length 1024;
    gzip_vary on;
}

# Anything else under /gfm-i18n/ (README.md, tests, this file) is not served.
location /gfm-i18n/ {
    return 404;
}
