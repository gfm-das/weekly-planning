# nginx in front of DataEase (container gfm-dataease-web, the only published port, 8088 on the LAN).
#
# 1. Only through the portal. Every request (pages, scripts, DataEase's API) must carry the portal's Dashboards
#    sign-in, the cookie gfm_dataease that portal-api gives to the APs, the President and the Data Analysts.
#    nginx asks the gate (gfm-dataease-gate) about every request; the gate answers with DataEase's own sign-in,
#    which is added here as X-DE-TOKEN. Whatever sign-in the browser sends is replaced, and DataEase's own sign-in
#    never reaches the browser (no cookies either way). Without a valid cookie: "Please open Dashboards from the
#    mission portal" (status 401), never DataEase's sign-in page or any data.
# 2. DataEase's API only from its own pages: other sites on this computer (the portal's other ports) may not call it
#    with the viewer's sign-in (Sec-Fetch-Site same-site or cross-site is refused).
# 3. English: DataEase Community Edition remembers its language only in memory and starts in Chinese after every
#    restart, so its answer to "which language?" (/de2api/user/info) is always English here, and /gfm/boot.js sets
#    English in the browser before DataEase's page starts. DataEase CE offers only English and Chinese.
#    The mission's 14 languages: /gfm-i18n/gfm-i18n.js (dataease/i18n/, mounted read-only) is added to DataEase's
#    pages after boot.js and shows DataEase's English words, the dashboards bar and the dashboards' own titles and
#    filter labels in the viewer's portal language (?gfmLang=, which the portal puts on /gfm-start).
# 4. DataEase's own sign-in, "Log out" and password change do not apply here (see the locations below).
# This file is UTF-8 (one sub_filter below matches Chinese text).
# The public name: dashboards.<the mission's public domain>, a Cloudflare tunnel route to this port
# (docs/handoff/round10/public-dashboards.md). A host name that starts with "dashboards." counts as that name, and
# the rest is the domain (named capture gfm_site_domain). There portal-api sets the Dashboards cookie for the whole
# domain (Domain=<domain>; Secure), so /gfm-signout clears that one as well; on the office addresses the second
# Set-Cookie line is empty, and nginx leaves an empty header out.
map $host $gfm_public_host {
    ~*^dashboards\.(?<gfm_site_domain>[a-z0-9.-]+)$ 1;
    default "";
}
map $gfm_public_host $gfm_signout_domain_cookie {
    1 "gfm_dataease=; Domain=$gfm_site_domain; Path=/; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; Secure; SameSite=Strict";
    default "";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    server_tokens off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # DataEase and the gate are looked up again after a restart of either container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $dataease http://dataease:8100;
    set $gate_host gate;

    # Text is compressed on the way (from 1 kB on). DataEase compresses what it sends by itself, but the locations
    # below that change DataEase's answer (sub_filter) must ask it for plain text; without this they sent it on
    # uncompressed: the chart library (4.4 MB, about 1.5 MB compressed) and every answer of DataEase's API (one
    # dashboard is about 250 kB of JSON, about 25 kB compressed). An answer that is already compressed passes as it is.
    gzip on;
    gzip_types application/javascript text/javascript application/json text/css;
    gzip_min_length 1024;
    gzip_vary on;

    # Pages of this front itself (no sign-in needed): the start script and the sign-in, refusal and "starting"
    # pages. The JSON answers are what DataEase's own pages show as a message. Browsers check for a newer copy
    # every time (a short "not changed" answer when nothing changed), so a change reaches everyone at once.
    # Round 10: "no-store", not "no-cache". On the internet name Cloudflare turns "no-cache" into "keep 4 hours" for
    # addresses ending in .js or .css (its Browser Cache TTL), and the sign-in page is also the answer for such an
    # address (a DataEase script asked for without the Dashboards cookie). "no-store" is passed on unchanged, so no
    # browser keeps an old boot.js or a sign-in page in place of a script. The files are small.
    location /gfm/ {
        alias /usr/share/nginx/gfm/;
        add_header Cache-Control "no-store" always;
    }

    # DataEase in the mission's 14 languages (dataease/i18n/README.md): serves /gfm-i18n/gfm-i18n.js and the 14
    # language files (no sign-in needed: they hold words, no data; the sign-in pages above use them too).
    include /etc/nginx/gfm-i18n/web-i18n.conf;

    # The portal's sign-out ends Dashboards too: it clears the portal's Dashboards cookie. Cookies belong to the
    # host name, not the port, so this clears the one portal-api set on :8070 (on the public name: the domain-wide
    # one, see $gfm_signout_domain_cookie). Nothing else happens, so no sign-in is needed (the portal calls it after
    # its own sign-in has ended).
    location = /gfm-signout {
        add_header Set-Cookie "gfm_dataease=; Path=/; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Strict" always;
        add_header Set-Cookie $gfm_signout_domain_cookie always;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # health.ps1 and the container health check: this front is up (it says nothing about DataEase).
    location = /gfm-web-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # health.ps1: DataEase answers and the gate holds a working DataEase sign-in (no secrets in the answer).
    # Only on the office addresses: the public name does not tell the internet how DataEase is doing.
    location = /gfm-gate-health {
        access_log off;
        if ($gfm_public_host) { return 404; }
        proxy_pass http://$gate_host:8099/health;
    }

    # The address the portal opens: the gate sends the browser on to the dashboard "Key indicators", in the viewer's
    # language when there is a copy in it (?gfmLang=de... is passed on to the gate with $is_args$args).
    location = /gfm-start {
        auth_request /gfm-gate-check;
        error_page 401 /gfm/signin.html;
        error_page 403 /gfm/refused.html;
        error_page 500 502 503 504 /gfm/starting.html;
        proxy_pass http://$gate_host:8099/start$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        add_header Cache-Control "no-store" always;
    }

    # Asked by nginx for every request below.
    location = /gfm-gate-check {
        internal;
        proxy_pass http://$gate_host:8099/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    # ---- DataEase's API ----------------------------------------------------------------------------------------

    # DataEase's own sign-in: never from a browser. People come in through the portal; seed-dashboards.ps1 and the
    # gate talk to DataEase directly on the private network.
    location = /de2api/login/localLogin {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"code":403,"msg":"Dashboards open from the mission portal; there is no separate sign-in.","data":null}';
    }

    # "Log out" in DataEase's menu: nothing to end here (the portal's sign-out ends Dashboards too), and ending
    # DataEase's shared sign-in would sign every other person out. /gfm/boot.js then brings the page back.
    location = /de2api/logout {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"code":0,"msg":null,"data":null}';
    }

    # The one DataEase password belongs to the server (dataease/.env); nobody signs in with it.
    location = /de2api/user/modifyPwd {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 403 '{"code":403,"msg":"The Dashboards password is kept by the server. Nobody needs it: Dashboards open from the mission portal.","data":null}';
    }

    # Which language DataEase uses after sign-in: always English.
    location = /de2api/user/info {
        if ($http_sec_fetch_site ~* "^(same-site|cross-site)$") { return 403; }
        auth_request /gfm-gate-check;
        auth_request_set $gfm_de_token $upstream_http_x_de_token;
        error_page 401 /gfm/signin.json;
        error_page 403 /gfm/refused.json;
        error_page 500 502 503 504 /gfm/starting.json;
        proxy_pass $dataease;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DE-TOKEN $gfm_de_token;
        proxy_set_header X-DE-LINK-TOKEN "";
        proxy_set_header X-EMBEDDED-TOKEN "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"language":"zh-CN"' '"language":"en"';
        sub_filter '"language":"zh_CN"' '"language":"en"';
        sub_filter '"language":"tw"' '"language":"en"';
    }

    location /de2api/ {
        if ($http_sec_fetch_site ~* "^(same-site|cross-site)$") { return 403; }
        auth_request /gfm-gate-check;
        auth_request_set $gfm_de_token $upstream_http_x_de_token;
        error_page 401 /gfm/signin.json;
        error_page 403 /gfm/refused.json;
        error_page 500 502 503 504 /gfm/starting.json;
        proxy_pass $dataease;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DE-TOKEN $gfm_de_token;
        proxy_set_header X-DE-LINK-TOKEN "";
        proxy_set_header X-EMBEDDED-TOKEN "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # DataEase's one account is called "管理员" (administrator) where a dashboard shows who made it.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"管理员"' '"Mission"';
    }

    # ---- DataEase's pages --------------------------------------------------------------------------------------

    # The app pages: /gfm/boot.js first (English, and the marker DataEase's page looks for before it loads), then
    # /gfm-i18n/gfm-i18n.js at the end of <head> (the viewer's language). A location with sub_filter lines of its own
    # takes none from the server level, so both lines must stay here. They are two different patterns ('<head>' and
    # '</head>'), each replaced once, in one pass; never list the same pattern twice.
    location ~ ^/(index\.html|mobile\.html)?$ {
        auth_request /gfm-gate-check;
        error_page 401 /gfm/signin.html;
        error_page 403 /gfm/refused.html;
        error_page 500 502 503 504 /gfm/starting.html;
        proxy_pass $dataease;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DE-TOKEN "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        # Round 12 (step 5): preload.js asks for every script and style file of the Dashboards page at once.
        sub_filter '<head>' '<head><script src="/gfm/boot.js?v=2"></script><script src="/gfm/preload.js?v=1"></script>';
        sub_filter '</head>' '<script src="/gfm-i18n/gfm-i18n.js"></script></head>';
    }

    # DataEase's chart library (AntV G2Plot, bundled): the x axis of every chart always keeps its first and last
    # label. G2Plot's own default hides every other label when they do not fit and can hide the last one, the latest
    # complete week (the Dashboards deck's round-4 rule: the latest week always has a label). One exact string of
    # G2Plot's defaults is changed; if a DataEase update no longer has it, nothing is changed.
    location ~ ^/assets/chunk/antv-[0-9.]+-dataease\.js$ {
        auth_request /gfm-gate-check;
        error_page 401 /gfm/signin.html;
        error_page 403 /gfm/refused.html;
        error_page 500 502 503 504 /gfm/starting.html;
        proxy_pass $dataease;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DE-TOKEN "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/javascript text/javascript;
        sub_filter_once on;
        sub_filter 'xAxis:{nice:!0,label:{autoRotate:!1,autoHide:{type:"equidistance",cfg:{minGap:6}}}}' 'xAxis:{nice:!0,label:{autoRotate:!1,autoHide:{type:"equidistanceWithReverseBoth",cfg:{minGap:6}}}}';
        # Keep DataEase's date of the file (sub_filter drops it otherwise, and the browser downloaded all 4.4 MB on
        # every visit). The browser asks each time whether the file changed and usually gets a short "not changed".
        # If the sub_filter line above is ever changed: browsers keep their old copy until DataEase's file changes.
        # To hand the new one to everyone at once, add  proxy_set_header If-Modified-Since "";  here for a month.
        sub_filter_last_modified on;
        add_header Cache-Control "no-cache" always;
    }

    # DataEase's own scripts and styles: their names carry the version (-2.10.20-dataease.js), so a file never changes under
    # its name and a browser may keep it for a year. Before (round 12, step 5) DataEase sent "no-cache": the browser asked
    # again for all 225 files on every visit, each a round trip through the Cloudflare tunnel. "private": only the
    # viewer's own browser keeps them, never Cloudflare or another shared cache (the files are behind the sign-in).
    # The chart library above keeps its "no-cache" (this server rewrites it; see there).
    location ~ ^/(assets/(chunk|css)/|js/)[^?]*-[0-9]+\.[0-9]+\.[0-9]+-dataease\.(js|css)$ {
        auth_request /gfm-gate-check;
        error_page 401 /gfm/signin.html;
        error_page 403 /gfm/refused.html;
        error_page 500 502 503 504 /gfm/starting.html;
        proxy_pass $dataease;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DE-TOKEN "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
    }

    # Everything else DataEase serves (scripts, styles, pictures, fonts), and its live connection /websocket/ (round
    # 10: the two Upgrade lines; without them DataEase's websocket was refused with 400, behind the same sign-in).
    location / {
        auth_request /gfm-gate-check;
        error_page 401 /gfm/signin.html;
        error_page 403 /gfm/refused.html;
        error_page 500 502 503 504 /gfm/starting.html;
        proxy_pass $dataease;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-DE-TOKEN "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }
}
