<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Please open Dashboards from the mission portal</title>
<!-- No icon to ask for: /favicon.ico would only answer with this page again. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/gfm/page.css">
<!-- Interface translation: the portal's i18n.js (port 8070 of this host, like signin.js's link; on the public name
     dashboards.example.org the portal at https://example.org), in the language
     the portal chose (cookie gfm_lang or ?lang=); English stays if the portal cannot be reached. Keep it next to
     gfm-i18n.js: it gives the language when the address has no ?gfmLang=, and it translates the portal's own
     messages that signin.js shows ("Dashboards are not available right now." and the like). -->
<script>(function(){var s=document.createElement("script");s.src=(/^dashboards\.[^.]+\./i.test(location.hostname)?"https://"+location.hostname.replace(/^dashboards\./i,""):location.protocol+"//"+location.hostname+":8070")+"/i18n.js?v=5";document.head.appendChild(s)})()</script>
<!-- The viewer's portal language (dataease/i18n/README.md); English when it cannot load. -->
<script src="/gfm-i18n/gfm-i18n.js"></script>
</head>
<body>
<!-- Shown by gfm-dataease-web (status 401) when a page of Dashboards is asked for without the portal's Dashboards
     sign-in. Inside the portal it first asks the portal to renew that sign-in and tries once more. -->
<div class="box">
  <h1 id="title">Please open Dashboards from the mission portal</h1>
  <p id="text">Dashboards are for the APs, the President and the Data Analysts, and they open inside the mission portal. Sign in to the portal, then choose Dashboards in the menu.</p>
  <a class="button" id="portal" href="/" target="_top">Go to the mission portal</a>
</div>
<script src="/gfm/signin.js"></script>
</body>
</html>
