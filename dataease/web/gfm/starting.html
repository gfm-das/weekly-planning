<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboards are starting</title>
<!-- No icon to ask for: /favicon.ico would only answer with this page again. -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/gfm/page.css">
<!-- Interface translation: the portal's i18n.js (port 8070 of this host, like signin.js's link; on the public name
     dashboards.example.org the portal at https://example.org), in the language
     the portal chose (cookie gfm_lang or ?lang=); English stays if the portal cannot be reached. Keep it next to
     gfm-i18n.js: it gives the language when the address has no ?gfmLang=. -->
<script>(function(){var s=document.createElement("script");s.src=(/^dashboards\.[^.]+\./i.test(location.hostname)?"https://"+location.hostname.replace(/^dashboards\./i,""):location.protocol+"//"+location.hostname+":8070")+"/i18n.js?v=5";document.head.appendChild(s)})()</script>
<!-- The viewer's portal language (dataease/i18n/README.md); English when it cannot load. -->
<script src="/gfm-i18n/gfm-i18n.js"></script>
</head>
<body>
<!-- Shown by gfm-dataease-web when DataEase or the gate does not answer (for example while DataEase starts,
     which takes about a minute). -->
<div class="box">
  <h1>Dashboards are starting</h1>
  <p>Dashboards are starting or briefly unavailable. Please try again in a minute with Reload at the top of the portal. If this stays, please tell the Data Analysts.</p>
</div>
</body>
</html>
