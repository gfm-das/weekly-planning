# nginx.conf: the web server of the portal (the nginx container, port 8070 on this computer).
#
# It hands out the files of portal/ (deploy.ps1 copies them into the container; this file is mounted as it is, see
# local-override.yml) and passes /api/ to portal-api. It also decides how long browsers may keep a file and what other
# pages may do with the portal's pages. Check a change with: bash portal/tests/nginx-check.sh
#
# Parts, top to bottom: compression, the API, Supabase sign-in (for the public address), old Grafana addresses, the
# Whiteboard, the reminders worker, the vendored chart and drag libraries, the tab icon, every other page and script,
# the translation catalogs.

# The access log leaves out the query string: a sign-in token may travel in it (?portal_token=…).
log_format portal_no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# The domain the portal was opened on, without a leading "www." (example.org for www.example.org). The Whiteboard's frame rule
# below names presentations.<that domain>, so no mission's domain is written into this file.
map $host $gfm_site_domain {
  ~^(?:www\.)?(?<gfm_domain>[a-z0-9.-]+)$ $gfm_domain;
  default "";
}

server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 access_log /var/log/nginx/access.log portal_no_query;
 add_header Referrer-Policy "no-referrer" always;
 client_max_body_size 16m;
 resolver 127.0.0.11 valid=30s;

 # Every text answer travels compressed (pages, scripts, styles, the catalogs, the API's JSON): about a quarter of its
 # size, which phones on mobile data notice most. Level 5 packs about a sixth tighter than the default level 1 for
 # little extra work. Pictures, fonts and attachments are compressed already and are left alone. The API's answers
 # hold no secret a page could be tricked into repeating (sign-in cookies travel in headers, which stay as they are).
 gzip on;
 gzip_comp_level 5;
 gzip_min_length 1024;
 gzip_vary on;
 gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

 # portal-api answers every /api/ request (and checks each one). Answers are never kept by the browser.
 location /api/ {
   set $portal_backend http://portal-api:8091;
   proxy_pass $portal_backend$request_uri;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_read_timeout 40s;
   add_header Cache-Control "no-store" always;
 }

 # Supabase sign-in on the portal's own address (public-domain change, 30 Sep 2026). The public address
 # https://<the mission's domain> (and www.) reaches this computer through the Cloudflare tunnel, which carries
 # only this port (8070). Opened there, the shell (index.template.html, PORTAL_PUBLIC_SITE) sends its Supabase
 # requests here instead of to port 18000; on localhost and the LAN address it still uses port 18000 as before.
 # Only what the portal's pages ask for goes on to the Beta stack's Kong (gfm-beta-supabase-kong-1 in gfm-network):
 #   /auth/v1/token, /user, /logout   sign in, renew the sign-in, set an invitation's password, sign out
 #   /auth/v1/verify                  the link in invitation and password emails (when API_EXTERNAL_URL points here)
 #   /auth/v1/health                  for checks
 #   /rest/v1/current_user_context    who is signed in (read only, exactly "?select=*", as the shell asks)
 # Everything else under /auth/v1/ and /rest/v1/ (sign-up, magic links, admin, every other table and function) is
 # refused here; Studio, the database, storage, realtime and edge functions are never passed on. The backend gets the
 # checked path ($uri), never the raw address, so an encoded "../" cannot reach another route. Answers are never kept.
 # A new Supabase request in a portal page must be added here, or it works on the LAN address only.
 location ~ ^/auth/v1/(token|user|logout|verify|health)$ {
   set $supabase_backend http://gfm-beta-supabase-kong-1:8000;
   proxy_pass $supabase_backend$uri$is_args$args;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
   proxy_read_timeout 30s;
   add_header Cache-Control "no-store" always;
   add_header Referrer-Policy "no-referrer" always;
   add_header X-Content-Type-Options "nosniff" always;
 }
 location = /rest/v1/current_user_context {
   limit_except GET { deny all; }
   if ($args != "select=*") { return 403; }
   set $supabase_backend http://gfm-beta-supabase-kong-1:8000;
   proxy_pass $supabase_backend/rest/v1/current_user_context?select=*;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
   proxy_read_timeout 30s;
   add_header Cache-Control "no-store" always;
   add_header Referrer-Policy "no-referrer" always;
   add_header X-Content-Type-Options "nosniff" always;
 }
 location /auth/v1/ {
   default_type application/json;
   add_header Cache-Control "no-store" always;
   add_header Referrer-Policy "no-referrer" always;
   return 403 '{"message":"Not available on this address."}';
 }
 location /rest/v1/ {
   default_type application/json;
   add_header Cache-Control "no-store" always;
   add_header Referrer-Policy "no-referrer" always;
   return 403 '{"message":"Not available on this address."}';
 }

 # Grafana was removed in round 6 (docs/handoff/round6/portalx.md). Old bookmarks of /grafana/... go to the
 # portal's Dashboards page, which opens the Overview for anyone who does not have Dashboards. absolute_redirect off
 # keeps the address the browser used (localhost or the LAN address, port 8070).
 location = /grafana {
   absolute_redirect off;
   return 302 /#insights;
 }
 location ^~ /grafana/ {
   absolute_redirect off;
   add_header Cache-Control "no-store" always;
   add_header Referrer-Policy "no-referrer" always;
   return 302 /#insights;
 }

 # Whiteboard (round 6, docs/handoff/round6/whiteboard2.md): the page, its code and the vendored Excalidraw bundle
 # (portal/whiteboard/, about 9 MB, loaded in parts as needed). The page may be framed by the portal only, and may
 # frame only Presentations on this host's port 3030, or on the public address its name presentations. (round 10)
 # (its live charts and the chart builder; change them here if the shell's URLS.presentations ever moves).
 # (portal-api/tests/whiteboard_env.sh copies the lines from "location = /whiteboard {" up to the service-worker line.)
 location = /whiteboard {
   absolute_redirect off;
   return 302 /whiteboard/;
 }
 location /whiteboard/ {
   try_files $uri $uri/ =404;
   add_header Cache-Control "no-cache" always;
   add_header Referrer-Policy "no-referrer" always;
   add_header X-Content-Type-Options "nosniff" always;
   add_header Content-Security-Policy "frame-ancestors 'self'; frame-src 'self' http://*:3030 https://*:3030 https://presentations.$gfm_site_domain; object-src 'none'; base-uri 'self'" always;
 }
 # The bundle's parts and fonts carry a fingerprint of their content in their names (chunk-K2UTITRG-BPG8bgO8.js): a
 # new build brings new names, so browsers may keep these for a year. The two entry files (gfm-excalidraw.js and .css)
 # keep their names and are checked on every visit, like the rest of the Whiteboard.
 location ~ ^/whiteboard/vendor/(chunks|assets)/ {
   try_files $uri =404;
   add_header Cache-Control "public, max-age=31536000, immutable" always;
   add_header Referrer-Policy "no-referrer" always;
   add_header X-Content-Type-Options "nosniff" always;
 }
 location = /service-worker.js { add_header Cache-Control "no-cache"; }
 # The vendored libraries: Apache ECharts 6.0.0 (the mission glimpse's charts, about 1 MB) and SortableJS 1.15.6
 # (dragging the Overview cards). They change only with a new library version, and the pages ask for them with that
 # version in the address (echarts.min.js?v=6.0.0, Sortable.min.js?v=1.15.6), so browsers keep them for a year instead
 # of asking again on every visit. A new library version needs a new ?v= in glimpse.js or home.html.
 location ~ ^/(echarts|Sortable)\.min\.js$ {
   add_header Cache-Control "public, max-age=31536000, immutable" always;
   add_header Referrer-Policy "no-referrer" always;
   add_header X-Content-Type-Options "nosniff" always;
 }
 # The browser tab's icon. favicon.png is not in portal/ (deploy.ps1 copies no pictures): without this rule a missing
 # icon would be answered with the whole portal page (index.html, 20 KB) on every visit. Now it is the file or a
 # short "not found".
 location = /favicon.png {
   try_files $uri =404;
 }
 # Weekly Planning wiki (static HTML from wiki/build.py). portal/local-override.yml mounts the repository's wiki/
 # folder at /usr/share/nginx/wiki-src; only its out/ folder is served (pages/ and out-private/ are NOT aliased).
 # Same origin as the portal so Edit / private article fetch can call /api/wiki with the portal session.
 location = /wiki {
   absolute_redirect off;
   return 302 /wiki/;
 }
 location /wiki/ {
   alias /usr/share/nginx/wiki-src/out/;
   try_files $uri $uri/ =404;
   add_header Cache-Control "no-cache" always;
   add_header Referrer-Policy "no-referrer" always;
   add_header X-Content-Type-Options "nosniff" always;
   add_header Content-Security-Policy "frame-ancestors 'self'" always;
 }

 # Pages, scripts and styles: browsers must check for a newer copy each time (a cheap 304 when
 # nothing changed), so a deploy reaches everyone at once instead of after a guessed cache time.
 # add_header here replaces the server-level one, so Referrer-Policy is repeated.
 # frame-ancestors 'self' (round 8, docs/handoff/round8/deckorigin.md): only the portal itself may show its pages in a
 # frame, never another page of this computer such as a presentation on port 8089 (no clicks under a deck).
 location / {
   try_files $uri $uri/ /index.html;
   add_header Cache-Control "no-cache" always;
   add_header Referrer-Policy "no-referrer" always;
   add_header Content-Security-Policy "frame-ancestors 'self'" always;
 }
 # Interface translations: DA Management (:8090) and Presentations (:3030) load i18n.js and these catalogs
 # from the portal too (portal/i18n/README.md). They are public texts, so any origin may read them.
 location ^~ /i18n/ {
   add_header Access-Control-Allow-Origin "*" always;
   add_header Cache-Control "no-cache" always;
   add_header Referrer-Policy "no-referrer" always;
 }
}
