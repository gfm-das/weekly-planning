          if (!text) text = s.dl_call_in_complete ? `Complete${s.dl_completed_at ? " · " + when(s.dl_completed_at) : ""}` : "Call-in not complete yet";
        }
        $("barButtons").innerHTML = buttons.join("");
        $("barState").textContent = text;
        $("actionBar").hidden = !buttons.length;
      }
      $("actionBar").addEventListener("click", async (event) => {
        const button = event.target.closest("[data-bar]");
        if (!button) return;
        if (button.dataset.bar === "save") {
          button.disabled = true;
          await saveAll(`#panel-${state.tab}`);
          renderBar();
        } else completeOrReopen(button.dataset.bar);
      });

      // =============================================================================================================
      // 11. GEMIKO (ward coordination): loaded when an area's GEMIKO is first opened
      // =============================================================================================================
      async function openGemiko(areaId) {
        const d = state.data;
        // One request brings GEMIKO for every area of the district (or for the one area on its own page).
        const level = d.scope.level === "area" ? "area" : "district";
        const id = level === "area" ? d.scope.id : d.scope.district_id;
        const cacheKey = keyOf(level, id, d.week.sunday);
        const box = () => $("gemiko-" + areaId);
        try {
          let result = cache.gemiko.get(cacheKey);
          if (!result) {
            result = await portalAPI("callins/gemiko?" + queryString({ level, id, week: d.week.sunday }));
            cache.gemiko.set(cacheKey, result);
          }
          const units = result.units.filter((u) => Number(u.area_id) === Number(areaId));
          if (box()) box().innerHTML = units.length ? units.map(gemikoUnit).join("") : '<p class="empty-line">No GEMIKO information for this week.</p>';
        } catch (error) {
          if (box()) box().innerHTML = `<p class="field-error">${esc(error.message)}</p>`;
        }
      }
      // One ward or branch: was ward coordination held, and who came.
      function gemikoUnit(u) {
        const rows = u.held === false ? "" : gemikoAttendance(u.attendance);
        return `<div class="unit"><h4>${esc(u.unit_name || "Unit")}</h4><div class="rows"><div class="row"><span>Ward coordination held</span><span>${esc(yesNo(u.held))}</span></div>${rows}</div></div>`;
      }
      function gemikoAttendance(attendance) {
        if (Array.isArray(attendance)) {
          // Older Weekly Planning answers list who came instead of a Yes / No per role.
          return attendance.length ? `<div class="row"><span>Who came</span><span>${esc(attendance.join(", "))}</span></div>` : "";
        }
        const values = attendance && typeof attendance === "object" ? attendance : {};
        return GEMIKO_ROLES.map(([role, label]) => `<div class="row"><span>${esc(label)}</span><span>${esc(gemikoValue(values[role]))}</span></div>`).join("");
      }

      // =============================================================================================================
      // 12. THE PEOPLE TAB: friends with a baptismal date, New Members and high-potential friends
      // =============================================================================================================
      // Loaded when the tab is first opened for this call-in and week.
      async function showPeople() {
        const d = state.data;
        const cacheKey = keyOf(d.scope.level, d.scope.id, d.week.sunday);
        let people = cache.people.get(cacheKey);
        if (!people) {
          $("panel-people").innerHTML = '<div class="skeleton"></div>';
          try {
            people = await portalAPI("callins/people?" + queryString({ level: d.scope.level, id: d.scope.id, week: d.week.sunday }));
          } catch (error) {
            if (state.data === d) $("panel-people").innerHTML = `<div class="status error">${esc(error.message)}</div>`;
            return;
          }
          cache.people.set(cacheKey, people);
        }
        if (state.data !== d) return; // the viewer moved on meanwhile
        state.people = people;
        renderPeople();
      }
      // Three lists; on a phone one at a time (chosen with the buttons above them), on a wide screen side by side.
      function renderPeople() {
        const people = state.people;
        const tabs = PEOPLE_GROUPS.map(([group, label]) => {
          const counts = people.counts[group] || { total: 0 };
          return `<button type="button" role="tab" aria-selected="${state.peopleTab === group}" data-people-tab="${group}">${esc(label)} <span class="count">${counts.total}</span></button>`;
        }).join("");
        const panels = PEOPLE_GROUPS.map(([group, label]) => peoplePanel(people, group, label)).join("");
        $("panel-people").innerHTML =
          `<div class="subtabs" role="tablist" aria-label="People">${tabs}</div><div class="people-panels">${panels}</div>` +
          '<p class="legend" style="margin-top:12px">At church recently: at least 2 of the last 4 Sundays. New members baptized in the last 3 weeks and high-potential friends: this Sunday.</p>';
      }
      // One list, with a title line per zone (mission) or district (zone) between the people.
      function peoplePanel(people, group, label) {
        const level = state.data.scope.level;
        const groupBy = level === "mission" ? "zone_name" : level === "zone" ? "district_name" : null;
        const counts = people.counts[group] || { total: 0, active: 0 };
        let rows = "";
        let title;
        (people[group] || []).forEach((p, index) => {
          if (groupBy && p[groupBy] !== title) {
            title = p[groupBy];
            rows += `<p class="group-title">${esc(title || "")}</p>`;
          }
          const where = [p.area_name, p.unit_name].filter(Boolean).join(" · ");
          rows += `<button type="button" class="person-row" data-person="${group}" data-index="${index}"><span><span>${esc(p.name || "Name not recorded")}</span><small>${esc(where)}</small></span>${activeFlag(p)}</button>`;
        });
        const body = rows || `<p class="empty-line">No ${esc(label.toLowerCase())} this week.</p>`;
        return `<section class="card people-panel" role="tabpanel" data-people-panel="${group}" ${state.peopleTab === group ? "" : "hidden"}><h2>${esc(label)}</h2><p class="legend">${counts.total} total · ${counts.active} active</p>${body}</section>`;
      }
      // A green or grey dot: was this person at church recently?
      function activeFlag(p) {
        return `<span class="active-flag"><span class="dot ${p.active ? "on" : ""}" aria-hidden="true"></span>${p.active ? "At church recently" : "Not at church recently"}</span>`;
      }
      $("panel-people").addEventListener("click", (event) => {
        const tab = event.target.closest("[data-people-tab]");
        if (tab) {
          state.peopleTab = tab.dataset.peopleTab;
          renderPeople();
          const again = $("panel-people").querySelector(`[data-people-tab="${state.peopleTab}"]`);
          if (again) again.focus();
          return;
        }
        const row = event.target.closest("[data-person]");
        if (row) openPerson(row.dataset.person, Number(row.dataset.index));
      });

      // --- One person, in a pop-up ------------------------------------------------------------------------------------
      function openPerson(group, index) {
        const p = ((state.people || {})[group] || [])[index];
        if (!p) return;
        $("personName").textContent = p.name || "Name not recorded";
        $("personWhere").textContent = [p.area_name, p.unit_name, p.missionaries].filter(Boolean).join(" · ");
        const details = group === "baptismal_dates" ? baptismalDateDetails(p) : group === "new_members" ? newMemberDetails(p) : friendDetails(p);
        $("personBody").innerHTML = `<p>${activeFlag(p)}</p>` + details;
        $("personDialog").showModal();
      }
      // Label and answer, one row each.
      function detailRows(pairs) {
        return `<div class="rows">${pairs.map(([label, value]) => `<div class="row"><span>${esc(label)}</span><span>${esc(value)}</span></div>`).join("")}</div>`;
      }
      // How far away the baptismal date is.
      function timing(p) {
        if (p.days_until == null) return DASH;
        if (p.days_until < 0) return "Date has passed. Talk about a new date?";
        if (p.days_until === 0) return "Today";
        if (p.days_until <= 7) return "This week";
        return plural(Math.round(p.days_until / 7), "week away", "weeks away");
      }
      function baptismalDateDetails(p) {
        return (
          detailRows([
            ["Finding source", p.finding_source || DASH],
            ["Date set", day(p.date_set)],
            ["Baptismal date", day(p.baptismal_date)],
            ["Timing", timing(p)],
          ]) +
          "<h3>Progress this week</h3>" +
          detailRows([
            ["Reading", yesNo(p.reading)],
            ["Praying", yesNo(p.praying)],
            ["At church", yesNo(p.at_church)],
            ["Keeping commandments", yesNo(p.keeping_commandments)],
            ["Member involvement", yesNo(p.member_involvement)],
          ])
        );
      }
      function newMemberDetails(p) {
        const code = p.next_ordinance;
        const ordinance = code ? (ORDINANCES[code] ? `${ORDINANCES[code]} (${code})` : code) : DASH;
        return (
          detailRows([
            ["Baptism", day(p.baptism_date)],
            ["Confirmation", day(p.confirmation_date)],
            ["Finding source", p.finding_source || DASH],
            ["Lessons (taught / goal)", `${num(p.lessons_actual)} / ${num(p.lessons_goal)}`],
            ["Preach My Gospel lessons", p.pmg_lessons_percentage == null ? DASH : `${num(p.pmg_lessons_percentage)}%`],
            ["At church", yesNo(p.at_church)],
            ["Next ordinance", ordinance],
          ]) +
          `<h3>How are they doing?</h3>${p.how_are_they_doing ? `<p class="text">${esc(p.how_are_they_doing)}</p>` : '<p class="empty-line">Nothing written this week.</p>'}` +
          "<h3>Covenant path</h3>" +
          detailRows([
            ["Reading", yesNo(p.reading)],
            ["Praying", yesNo(p.praying)],
            ["Member involvement", yesNo(p.member_involvement)],
            ["Has a calling", threeWay(p.has_calling)],
            ["Aaronic Priesthood", threeWay(p.has_aaronic_priesthood)],
            ["Melchizedek Priesthood", threeWay(p.has_melchizedek_priesthood)],
            ["Ministers to someone", threeWay(p.ministers_to_someone)],
            ["Has ministering brothers or sisters", yesNo(p.ministered_to_by_someone)],
            ["Temple recommend", threeWay(p.has_active_temple_recommend)],
            ["Temple baptisms", threeWay(p.visited_temple_for_baptisms)],
          ]) +
          "<h3>GEMIKO</h3>" +
          detailRows([["Discussed in GEMIKO", yesNo(p.discussed_in_gemiko)]]) +
          (p.gemiko_support_plan ? `<p class="text" style="margin-top:10px">${esc(p.gemiko_support_plan)}</p>` : '<p class="empty-line" style="margin-top:10px">No GEMIKO plan written.</p>')
        );
      }
      // A high-potential friend.
      function friendDetails(p) {
        return detailRows([["At church this Sunday", yesNo(p.at_church)]]) + `<h3>Notes</h3>${p.notes ? `<p class="text">${esc(p.notes)}</p>` : '<p class="empty-line">No notes.</p>'}`;
      }
      $("personClose").addEventListener("click", () => $("personDialog").close());
      // A click on the dark background around the pop-up closes it too.
      $("personDialog").addEventListener("click", (event) => {
        if (event.target === $("personDialog")) $("personDialog").close();
      });

      // =============================================================================================================
      // 13. CLICKS AND TYPING ANYWHERE ON THE PAGE, AND THE START
      // =============================================================================================================
      // One listener for the buttons that are drawn again and again (they carry what they do in a data- attribute).
      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-go-level],[data-save],[data-sort],[data-notes-for],[data-copy],[data-discard]");
        if (!target) return;
        if (target.dataset.goLevel) go(target.dataset.goLevel, Number(target.dataset.goId));
        else if (target.dataset.save) saveOne(target.dataset.save);
        else if (target.dataset.copy) copyKept(target.dataset.copy);
        else if (target.dataset.discard) discardKept(target.dataset.discard);
        else if (target.dataset.sort) sortBy(target.dataset.sort);
        else if (target.dataset.notesFor) showNotesOf(target.dataset.notesFor);
      });
      // A click on a column title sorts by it; a second click turns the order around.
      function sortBy(column) {
        const same = state.sort && state.sort.level === state.data.scope.level && state.sort.column === column;
        const dir = same ? (state.sort.dir === "descending" ? "ascending" : "descending") : column === "name" ? "ascending" : "descending";
        state.sort = { level: state.data.scope.level, column, dir };
        // Only the table is drawn again, so notes typed in the cards below stay.
        $("scopeTable").innerHTML = scopeTable(state.data);
        const again = document.querySelector(`[data-sort="${column}"]`);
        if (again) again.focus();
      }
      // "DL and ZL notes ›" on a district card opens the Notes tab at that district.
      function showNotesOf(districtId) {
        selectTab("notes");
        const card = $("notes-" + districtId);
        if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      // "toggle" does not bubble, so listen while it travels down (capture).
      document.addEventListener(
        "toggle",
        (event) => {
          const details = event.target;
          if (details.dataset && details.dataset.gemiko && details.open && !details.dataset.loaded) {
            details.dataset.loaded = "1";
            openGemiko(Number(details.dataset.gemiko));
          }
        },
        true,
      );
      // Typing in a note or area update: keep the text as a draft until it is saved.
      document.addEventListener("input", (event) => {
        const field = event.target.closest("[data-field]");
        if (!field) return;
        const week = state.data.week.sunday;
        drafts.set(draftKey(field.dataset.field, week), { id: field.dataset.field, week, text: field.value, kept: false });
        showFieldError(field.dataset.field, "");
        markNotSaved(field.dataset.field);
        renderBar();
      });
      $("week").addEventListener("change", () => {
        const chosen = $("week").value;
        if (!confirmLeave()) {
          $("week").value = state.data.week.sunday;
          return;
        }
        go(state.level, state.id, chosen, state.tab);
      });
      // ‹ goes one week back, › one week forward (d.weeks starts with the newest week).
      function stepWeek(offset) {
        const weeks = state.data.weeks;
        const index = weeks.findIndex((w) => w.sunday === state.data.week.sunday);
        const next = weeks[index + offset];
        if (index >= 0 && next) go(state.level, state.id, next.sunday, state.tab);
      }
      $("olderWeek").addEventListener("click", () => stepWeek(1));
      $("newerWeek").addEventListener("click", () => stepWeek(-1));

      const start = paramsFromSearch(window.CALLINS_START);
      history.replaceState(start.level ? start : null, "", urlFor(start));
      load(start);
    </script>
  </body>
</html>
