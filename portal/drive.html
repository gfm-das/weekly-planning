<!doctype html>
<!--
  MISSION DRIVE (drive.html)

  What it is:  one page that links to the mission's shared Google Drive and can show its files inside the portal.
  Setting:     the drive's ID is NOT in this file. It is the setting GFM_DRIVE_ID (portal/.env, or the installer's "driveId"
               answer). portal/deploy.sh writes it to site-config.js as window.GFM_SITE.driveId, the way the public web name
               and the time zone get to the pages. Empty: the page says the drive is not set up yet.
  What it does: "Open the mission drive" opens Google Drive in a new tab. "Show the files here" puts Google's own folder view
               in a frame on this page. "Copy link" copies the drive's address, to paste into an announcement or an event.
  What it does NOT do: no Google API, no service account, no sign-in to Google on behalf of anybody, nothing is uploaded or
               stored. Who may see what is decided by Google (the drive is shared with everyone in the mission), not by the portal.
  Menu:        INFORMATION > "Mission drive" (portal-enhancements.js, shown to every signed-in role) opens this page.
  Words:       i18n.js swaps every text for the reader's language (portal/i18n/*.json, keys drive.*).
-->
<html lang="en" data-theme="mission">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Mission drive</title>
    <link rel="stylesheet" href="workspace.css" />
    <script src="site-config.js"></script><script src="i18n.js?v=6"></script>
    <style>
      .drive-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 14px; }
      .drive-actions .button, .drive-actions button { min-height: 44px; display: inline-flex; align-items: center; }
      .drive-frame { width: 100%; height: min(70vh, 640px); border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-top: 8px; }
      .drive-frame[hidden] { display: none; }
      .drive-badge { display: inline-block; border-radius: 99px; background: #e7f3f1; color: #13736e; padding: 4px 10px; font-size: 12px; font-weight: 700; }
      [data-theme="dark"] .drive-badge { background: #173d33; color: #9be3c8; }
      [data-theme="dark"] button.secondary, [data-theme="dark"] .button.secondary { background: #21343d; color: #edf7f8; }
    </style>
  </head>
  <body>
    <main>
      <div class="page-head">
        <div>
          <h1>Mission drive</h1>
          <p class="muted">The mission's shared Google Drive: the files everyone in the mission can use.</p>
        </div>
        <span class="drive-badge" id="badge" hidden>Google Drive</span>
      </div>
      <section class="panel">
        <div id="notset" class="notice" hidden>The mission drive is not set up yet. Please ask a Data Analyst.</div>
        <div id="ready" hidden>
          <div class="drive-actions">
            <a class="button" id="open" href="#" target="_blank" rel="noopener noreferrer">Open the mission drive</a>
            <button type="button" class="secondary" id="browse" aria-expanded="false" aria-controls="frame">Show the files here</button>
            <button type="button" class="secondary" id="copy">Copy link</button>
          </div>
          <p class="muted" id="hint">Everyone in the mission can see this drive. Google may ask you to sign in with your Google account.</p>
          <div id="status" class="status" role="status" aria-live="polite"></div>
          <iframe id="frame" class="drive-frame" hidden title="Files in the mission drive" referrerpolicy="no-referrer" loading="lazy"></iframe>
        </div>
      </section>
    </main>
    <script>
      // The drive's ID is a setting (site-config.js, GFM_DRIVE_ID); it is checked here again before it is put in an address.
      const $ = (id) => document.getElementById(id);
      const T = (key, values) => (window.MissionI18n ? window.MissionI18n.t(key, values) : key);
      const driveId = String((window.GFM_SITE && window.GFM_SITE.driveId) || "").trim();
      const valid = /^[A-Za-z0-9_-]{10,64}$/.test(driveId);
      const folderUrl = valid ? "https://drive.google.com/drive/folders/" + encodeURIComponent(driveId) : "";
      const embedUrl = valid ? "https://drive.google.com/embeddedfolderview?id=" + encodeURIComponent(driveId) + "#list" : "";

      if (!valid) {
        $("notset").hidden = false;
      } else {
        $("ready").hidden = false;
        $("badge").hidden = false;
        $("open").href = folderUrl;
        $("browse").addEventListener("click", () => {
          const frame = $("frame");
          const open = frame.hidden;
          if (open && !frame.getAttribute("src")) frame.setAttribute("src", embedUrl);
          frame.hidden = !open;
          $("browse").setAttribute("aria-expanded", String(open));
          $("browse").textContent = T(open ? "drive.hide" : "drive.browse");
        });
        $("copy").addEventListener("click", async () => {
          let done = false;
          try {
            await navigator.clipboard.writeText(folderUrl);
            done = true;
          } catch (error) {
            done = false;
          }
          $("status").textContent = done ? T("drive.copied") : folderUrl;
        });
        document.addEventListener("mission-i18n-change", () => {
          $("browse").textContent = T($("frame").hidden ? "drive.browse" : "drive.hide");
        });
      }
    </script>
  </body>
</html>
