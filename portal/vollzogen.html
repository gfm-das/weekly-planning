<!doctype html>
<!--
  VOLLZOGEN (vollzogen.html)

  What it is:  a read-only list of the people who were baptized and confirmed (the office's "Vollzogen" list): name, when the
               baptismal date was set, the baptism date, how they were found, the missionaries, unit, stake, zone, confirmed,
               country, gender and preferred language. Newest baptism first. Filters: week, zone and a text search.
               Round 19: "Group by" year, quarter or month (by baptism date) puts a heading with the period's total over
               each group; the order choice turns newest-first into oldest-first. Both work on the loaded list only.
               Round 21: "Period" picks one month or one year (by baptism date; default this month in the mission's time
               zone, or All time). portal-api filters by it (?period=), so the count and the group totals follow it, and the
               week list only holds weeks of that period. People baptized in this reporting week (Sunday to Saturday, the
               portal's week) get a tinted row and a "This week" badge.
               It has no edit buttons and no forms: one search box and lists to choose from.
  Who uses it: the Office and the managers (AP, President, Data Analyst). Not district leaders, zone leaders, STLs or missionaries,
               because the list holds names. The menu entry (INSIGHTS > Vollzogen) is shown only to those roles; portal-api
               decides again on every request.
  How it fits: the portal shows this page in its frame like the other pages. It asks portal-api for GET /api/vollzogen
               (portal-api/vollzogen.py) through portalAPI() from portal-client.js. portal-api checks the role
               (roles.py, can_view_vollzogen) and only ever reads public.vollzogen_records. The list is filled in DA Management
               (Data uploads > Vollzogen). A person without the right gets a plain message.
  Words:       i18n.js swaps every text for the reader's language (portal/i18n/*.json, keys vollzogen.*).
-->
<html lang="en" data-theme="mission">
  <head>
    <meta charset="utf-8" />
<script>/* Theme before paint — round 14 (no white flash). Same key as portal-enhancements.js. */
(function(){try{var t=(JSON.parse(localStorage.getItem("gfm_portal_layout_v1")||"null")||{}).theme||"mission";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t==="dark"?"dark":"light";document.documentElement.style.background=t==="dark"?"#101a21":"";}catch(e){}})();</script>
<meta name="color-scheme" content="light dark">

    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Vollzogen</title>
    <link rel="stylesheet" href="workspace.css" />
    <script src="site-config.js"></script><script src="i18n.js?v=6"></script>
    <style>
      .table-scroll { overflow-x: auto; }
      .done-table { width: 100%; border-collapse: collapse; }
      .done-table th, .done-table td { text-align: start; padding: 10px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
      .done-table th { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
      .done-table td.name { font-weight: 700; }
      .done-table td.date { white-space: nowrap; }
      .filters { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; margin-bottom: 18px; }
      .filters .field { min-width: 180px; }
      .filters .field.wide { flex: 1 1 260px; }
      .filters select, .filters input { min-height: 44px; }
      .count { margin: 0 0 10px; }
      .done-table tr.period th { background: var(--soft); color: var(--text); font-size: 14px; padding: 9px 10px; }
      .done-table tr.period .total { color: var(--muted); font-weight: 600; margin-inline-start: 8px; }
      .done-table tr.this-week td { background: #e6f4f1; }
      .done-table tr.this-week td:first-child { box-shadow: inset 4px 0 0 #087f8c; }
      [data-theme="dark"] .done-table tr.this-week td { background: #173a3d; }
      [data-theme="dark"] .done-table tr.this-week td:first-child { box-shadow: inset 4px 0 0 #5cc8c0; }
      .this-week-badge { display: inline-block; margin-inline-start: 6px; padding: 1px 7px; border: 1px solid #087f8c; border-radius: 99px; color: #05656f; background: #fff; font-size: 11px; font-weight: 700; white-space: nowrap; }
      [data-theme="dark"] .this-week-badge { border-color: #5cc8c0; color: #b6efe9; background: #102a2d; }
      .readonly-note { display: inline-block; border-radius: 99px; background: #e7f3f1; color: #13736e; padding: 4px 10px; font-size: 12px; font-weight: 700; }
      [data-theme="dark"] .readonly-note { background: #173d33; color: #9be3c8; }
      @media (max-width: 760px) {
        .done-table thead { display: none; }
        .done-table, .done-table tbody, .done-table tr, .done-table td { display: block; width: 100%; }
        .done-table tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
        .done-table td { border: 0; padding: 3px 4px; }
        .done-table td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: 12px; font-weight: 700; }
        .done-table td.name::before { content: none; }
        .done-table tr.period th { display: block; }
        .filters .field, .filters .field.wide { min-width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="page-head">
        <div>
          <h1>Vollzogen</h1>
          <p class="muted">The people who were baptized and confirmed. This list is read-only.</p>
        </div>
        <span class="readonly-note">Read only</span>
      </div>
      <section class="panel">
        <div class="filters">
          <div class="field">
            <label for="period">Period</label>
            <select id="period">
              <option value="month">This month</option>
              <option value="all">All time</option>
            </select>
          </div>
          <div class="field">
            <label for="week">Week</label>
            <select id="week"><option value="">All weeks</option></select>
          </div>
          <div class="field">
            <label for="zone">Zone</label>
            <select id="zone"><option value="">All zones</option></select>
          </div>
          <div class="field">
            <label for="group">Group by</label>
            <select id="group">
              <option value="">No grouping</option>
              <option value="year">Year</option>
              <option value="quarter">Quarter</option>
              <option value="month">Month</option>
            </select>
          </div>
          <div class="field">
            <label for="order">Order</label>
            <select id="order">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
            </select>
          </div>
          <div class="field wide">
            <label for="q">Search</label>
            <input id="q" type="search" maxlength="100" autocomplete="off" />
          </div>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <p id="count" class="muted count" hidden></p>
        <div id="list"></div>
      </section>
    </main>
    <script src="portal-client.js"></script>
    <script>
      // No writes here: the page only ever calls GET /api/vollzogen.
      const $ = (id) => document.getElementById(id);
      const esc = window.escapeHTML;
      // Round 14: until the catalogs are in, a key is shown as nothing (never "vollzogen.loading"); the page draws
      // again on mission-i18n-change.
      const T = (key, values) => {
        const text = window.MissionI18n && window.MissionI18n.t ? window.MissionI18n.t(key, values) : key;
        return text === key ? "" : text;
      };
      const state = { filled: false, timer: null, ticket: 0, data: null, oldestFirst: false };
      function monthName(ym) {
        return new Intl.DateTimeFormat(document.documentElement.lang || "en", { month: "long", year: "numeric", timeZone: "UTC" })
          .format(new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1, 1)));
      }

      function setStatus(text, error) {
        $("status").textContent = text || "";
        $("status").className = "status" + (error ? " error" : "");
      }

      function fillSelect(select, firstLabelKey, items, current) {
        const first = `<option value="">${esc(T(firstLabelKey))}</option>`;
        select.innerHTML = first + items.map((i) => `<option value="${esc(String(i.value))}">${esc(i.label)}</option>`).join("");
        select.value = current == null ? "" : String(current);
      }

      const day = (iso) => (iso ? String(iso).slice(0, 10) : "");
      const text = (value) => (value == null || value === "" ? "" : String(value));

      // Columns in the order of the office's sheet. `get` gives the plain text; it is escaped when the row is drawn.
      const COLUMNS = [
        ["name", "vollzogen.colName", (i) => text(i.full_name)],
        ["date", "vollzogen.colBaptism", (i) => day(i.baptism_date)],
        ["date", "vollzogen.colSet", (i) => day(i.baptismal_date_set_on)],
        ["", "vollzogen.colFound", (i) => text(i.found_how)],
        ["", "vollzogen.colWorkers", (i) => text(i.workers)],
        ["", "vollzogen.colUnit", (i) => text(i.unit)],
        ["", "vollzogen.colStake", (i) => text(i.stake)],
        ["", "vollzogen.colZone", (i) => text(i.zone)],
        ["", "vollzogen.colConfirmed", (i) => T(i.confirmed ? "vollzogen.yes" : "vollzogen.no")],
        ["", "vollzogen.colCountry", (i) => text(i.country)],
        ["", "vollzogen.colGender", (i) => text(i.gender)],
        ["", "vollzogen.colLanguage", (i) => text(i.preferred_language)],
      ];

      // Group by: the period of a baptism date ("2026-08-09"): its sort key and heading. No date: last, under "No date".
      function period(iso, by) {
        if (!iso) return { key: "", label: T("vollzogen.noDate") };
        const [y, m] = iso.split("-").map(Number);
        if (by === "year") return { key: String(y), label: String(y) };
        if (by === "quarter") return { key: `${y}-${Math.ceil(m / 3)}`, label: T("vollzogen.quarterLabel", { q: Math.ceil(m / 3), year: y }) };
        return { key: iso.slice(0, 7), label: monthName(iso) };
      }

      // The rows in date order (newest first unless reversed; no date last), with a heading and total per period.
      // Period: this month (default), the other months and the years that have baptisms, or all time.
      function fillPeriods(data) {
        const select = $("period"), current = select.value || "month";
        const group = (key, items) => items.length ? `<optgroup label="${esc(T(key))}">${items.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("")}</optgroup>` : "";
        select.innerHTML = `<option value="month">${esc(T("vollzogen.thisMonth"))} (${esc(monthName(data.this_month))})</option>`
          + group("vollzogen.months", data.months.filter((m) => m !== data.this_month).map((m) => [m, monthName(m)]))
          + group("vollzogen.years", data.years.map((y) => [y, y]))
          + `<option value="all">${esc(T("vollzogen.allTime"))}</option>`;
        select.value = [...select.options].some((o) => o.value === current) ? current : "month";
      }

      // This reporting week (Sunday to Saturday): its people get a tinted row and a badge, so it is not colour only.
      function inThisWeek(item) {
        const w = state.data && state.data.this_week, d = day(item.baptism_date);
        return Boolean(w && d && d >= day(w.sunday) && d <= day(w.saturday));
      }

      function bodyRows(items, by) {
        const sign = state.oldestFirst ? 1 : -1;
        const sorted = items.slice().sort((a, b) => {
          const x = day(a.baptism_date), y = day(b.baptism_date);
          return (!x - !y) || sign * x.localeCompare(y) || text(a.full_name).localeCompare(text(b.full_name));
        });
        const badge = `<span class="this-week-badge">${esc(T("vollzogen.thisWeek"))}</span>`;
        const row = (item) => {
          const mark = inThisWeek(item);
          return `<tr${mark ? ' class="this-week"' : ""}>` + COLUMNS.map(([cls, key, get], n) =>
            `<td class="${cls}" data-label="${esc(T(key))}">${esc(get(item))}${mark && !n ? badge : ""}</td>`).join("") + "</tr>";
        };
        if (!by) return sorted.map(row).join("");
        const groups = [];
        for (const item of sorted) {
          const p = period(day(item.baptism_date), by);
          if (!groups.length || groups[groups.length - 1].key !== p.key) groups.push({ ...p, items: [] });
          groups[groups.length - 1].items.push(item);
        }
        return groups.map((g) => `<tr class="period"><th colspan="${COLUMNS.length}" scope="rowgroup">${esc(g.label)}<span class="total">${esc(T("vollzogen.periodTotal", { n: g.items.length }))}</span></th></tr>` + g.items.map(row).join("")).join("");
      }

      function draw(data) {
        state.data = data;
        // The week list follows the period, so it is drawn every time; the zones once.
        fillSelect($("week"), "vollzogen.allWeeks", data.weeks.map((w) => ({ value: w, label: w })), data.filter.week);
        if (!state.filled) {
          state.filled = true;
          fillPeriods(data);
          fillSelect($("zone"), "vollzogen.allZones", data.zones.map((z) => ({ value: z, label: z })), data.filter.zone);
        }
        if (!data.items.length) {
          $("count").hidden = true;
          $("list").innerHTML = `<div class="empty">${esc(T(data.period === "all" ? "vollzogen.empty" : "vollzogen.emptyPeriod"))}</div>`;
          return;
        }
        const marked = data.items.filter(inThisWeek).length;
        $("count").hidden = false;
        $("count").textContent = T("vollzogen.count", { n: data.items.length })
          + (marked ? " · " + T("vollzogen.thisWeekCount", { n: marked, from: day(data.this_week.sunday), to: day(data.this_week.saturday) }) : "");
        const head = COLUMNS.map(([, key]) => `<th>${esc(T(key))}</th>`).join("");
        const rows = bodyRows(data.items, $("group").value);
        const more = data.truncated ? `<p class="muted">${esc(T("vollzogen.truncated"))}</p>` : "";
        $("list").innerHTML = `<div class="table-scroll"><table class="done-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>${more}`;
      }

      async function load() {
        const query = ["period=" + encodeURIComponent($("period").value || "month")];
        if ($("week").value) query.push("week=" + encodeURIComponent($("week").value));
        if ($("zone").value) query.push("zone=" + encodeURIComponent($("zone").value));
        if ($("q").value.trim()) query.push("q=" + encodeURIComponent($("q").value.trim()));
        const ticket = ++state.ticket;
        setStatus(T("vollzogen.loading"));
        try {
          const data = await portalAPI("vollzogen" + (query.length ? "?" + query.join("&") : ""));
          if (ticket !== state.ticket) return; // a newer search is already on its way
          setStatus("");
          draw(data);
        } catch (error) {
          if (ticket !== state.ticket) return;
          $("list").innerHTML = "";
          $("count").hidden = true;
          setStatus(error.message, true);
        }
      }

      $("period").addEventListener("change", () => {
        $("week").value = ""; // the weeks of another period
        load();
      });
      $("week").addEventListener("change", load);
      $("zone").addEventListener("change", load);
      $("group").addEventListener("change", () => state.data && draw(state.data));
      $("order").addEventListener("change", () => {
        state.oldestFirst = $("order").value === "oldest";
        if (state.data) draw(state.data);
      });
      $("q").addEventListener("input", () => {
        clearTimeout(state.timer);
        state.timer = setTimeout(load, 300);
      });
      document.addEventListener("mission-i18n-change", () => {
        state.filled = false;
        load();
      });
      load();
    </script>
  </body>
</html>
