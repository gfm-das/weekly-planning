<!doctype html>
<!--
  VOLLZOGEN (vollzogen.html)

  What it is:  a read-only list of the people who were baptized and confirmed (the office's "Vollzogen" list): name, when the
               baptismal date was set, the baptism date, how they were found, the missionaries, unit, stake, zone, confirmed,
               country, gender and preferred language. Newest baptism first. Filters: week, zone and a text search.
               It has no edit buttons and no forms: one search box and two lists to choose from.
  Who uses it: the Office and the managers (AP, President, Data Analyst). Not district leaders, zone leaders, STLs or missionaries,
               because the list holds names. The menu entry (INSIGHTS > Vollzogen) is shown only to those roles; portal-api
               decides again on every request.
  How it fits: the portal shows this page in its frame like the other pages. It asks portal-api for GET /api/vollzogen
               (portal-api/vollzogen.py) through portalAPI() from portal-client.js. portal-api checks the role
               (roles.py, can_view_vollzogen) and only ever reads public.vollzogen_records. The list is filled in DA Management
               (Data uploads > Vollzogen). A person without the right gets a plain message.
  Words:       i18n.js swaps every text for the reader's language (portal/i18n/*.json, keys vollzogen.*).
-->
<html lang="en" data-theme="mission">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Vollzogen</title>
    <link rel="stylesheet" href="workspace.css" />
    <script src="site-config.js"></script><script src="i18n.js?v=6"></script>
    <style>
      .table-scroll { overflow-x: auto; }
      .done-table { width: 100%; border-collapse: collapse; }
      .done-table th, .done-table td { text-align: start; padding: 10px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
      .done-table th { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
      .done-table td.name { font-weight: 700; }
      .done-table td.date { white-space: nowrap; }
      .filters { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; margin-bottom: 18px; }
      .filters .field { min-width: 180px; }
      .filters .field.wide { flex: 1 1 260px; }
      .filters select, .filters input { min-height: 44px; }
      .count { margin: 0 0 10px; }
      .readonly-note { display: inline-block; border-radius: 99px; background: #e7f3f1; color: #13736e; padding: 4px 10px; font-size: 12px; font-weight: 700; }
      [data-theme="dark"] .readonly-note { background: #173d33; color: #9be3c8; }
      @media (max-width: 760px) {
        .done-table thead { display: none; }
        .done-table, .done-table tbody, .done-table tr, .done-table td { display: block; width: 100%; }
        .done-table tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
        .done-table td { border: 0; padding: 3px 4px; }
        .done-table td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); font-size: 12px; font-weight: 700; }
        .done-table td.name::before { content: none; }
        .filters .field, .filters .field.wide { min-width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="page-head">
        <div>
          <h1>Vollzogen</h1>
          <p class="muted">The people who were baptized and confirmed. This list is read-only.</p>
        </div>
        <span class="readonly-note">Read only</span>
      </div>
      <section class="panel">
        <div class="filters">
          <div class="field">
            <label for="week">Week</label>
            <select id="week"><option value="">All weeks</option></select>
          </div>
          <div class="field">
            <label for="zone">Zone</label>
            <select id="zone"><option value="">All zones</option></select>
          </div>
          <div class="field wide">
            <label for="q">Search</label>
            <input id="q" type="search" maxlength="100" autocomplete="off" />
          </div>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <p id="count" class="muted count" hidden></p>
        <div id="list"></div>
      </section>
    </main>
    <script src="portal-client.js"></script>
    <script>
      // No writes here: the page only ever calls GET /api/vollzogen.
      const $ = (id) => document.getElementById(id);
      const esc = window.escapeHTML;
      const T = (key, values) => (window.MissionI18n ? window.MissionI18n.t(key, values) : key);
      const state = { filled: false, timer: null, ticket: 0 };

      function setStatus(text, error) {
        $("status").textContent = text || "";
        $("status").className = "status" + (error ? " error" : "");
      }

      function fillSelect(select, firstLabelKey, items, current) {
        const first = `<option value="">${esc(T(firstLabelKey))}</option>`;
        select.innerHTML = first + items.map((i) => `<option value="${esc(String(i.value))}">${esc(i.label)}</option>`).join("");
        select.value = current == null ? "" : String(current);
      }

      const day = (iso) => (iso ? String(iso).slice(0, 10) : "");
      const text = (value) => (value == null || value === "" ? "" : String(value));

      // Columns in the order of the office's sheet. `get` gives the plain text; it is escaped when the row is drawn.
      const COLUMNS = [
        ["name", "vollzogen.colName", (i) => text(i.full_name)],
        ["date", "vollzogen.colBaptism", (i) => day(i.baptism_date)],
        ["date", "vollzogen.colSet", (i) => day(i.baptismal_date_set_on)],
        ["", "vollzogen.colFound", (i) => text(i.found_how)],
        ["", "vollzogen.colWorkers", (i) => text(i.workers)],
        ["", "vollzogen.colUnit", (i) => text(i.unit)],
        ["", "vollzogen.colStake", (i) => text(i.stake)],
        ["", "vollzogen.colZone", (i) => text(i.zone)],
        ["", "vollzogen.colConfirmed", (i) => T(i.confirmed ? "vollzogen.yes" : "vollzogen.no")],
        ["", "vollzogen.colCountry", (i) => text(i.country)],
        ["", "vollzogen.colGender", (i) => text(i.gender)],
        ["", "vollzogen.colLanguage", (i) => text(i.preferred_language)],
      ];

      function draw(data) {
        if (!state.filled) {
          state.filled = true;
          fillSelect($("week"), "vollzogen.allWeeks", data.weeks.map((w) => ({ value: w, label: w })), data.filter.week);
          fillSelect($("zone"), "vollzogen.allZones", data.zones.map((z) => ({ value: z, label: z })), data.filter.zone);
        }
        if (!data.items.length) {
          $("count").hidden = true;
          $("list").innerHTML = `<div class="empty">${esc(T("vollzogen.empty"))}</div>`;
          return;
        }
        $("count").hidden = false;
        $("count").textContent = T("vollzogen.count", { n: data.items.length });
        const head = COLUMNS.map(([, key]) => `<th>${esc(T(key))}</th>`).join("");
        const rows = data.items
          .map((item) => "<tr>" + COLUMNS.map(([cls, key, get]) => `<td class="${cls}" data-label="${esc(T(key))}">${esc(get(item))}</td>`).join("") + "</tr>")
          .join("");
        const more = data.truncated ? `<p class="muted">${esc(T("vollzogen.truncated"))}</p>` : "";
        $("list").innerHTML = `<div class="table-scroll"><table class="done-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>${more}`;
      }

      async function load() {
        const query = [];
        if ($("week").value) query.push("week=" + encodeURIComponent($("week").value));
        if ($("zone").value) query.push("zone=" + encodeURIComponent($("zone").value));
        if ($("q").value.trim()) query.push("q=" + encodeURIComponent($("q").value.trim()));
        const ticket = ++state.ticket;
        setStatus(T("vollzogen.loading"));
        try {
          const data = await portalAPI("vollzogen" + (query.length ? "?" + query.join("&") : ""));
          if (ticket !== state.ticket) return; // a newer search is already on its way
          setStatus("");
          draw(data);
        } catch (error) {
          if (ticket !== state.ticket) return;
          $("list").innerHTML = "";
          $("count").hidden = true;
          setStatus(error.message, true);
        }
      }

      $("week").addEventListener("change", load);
      $("zone").addEventListener("change", load);
      $("q").addEventListener("input", () => {
        clearTimeout(state.timer);
        state.timer = setTimeout(load, 300);
      });
      document.addEventListener("mission-i18n-change", () => {
        state.filled = false;
        load();
      });
      load();
    </script>
  </body>
</html>
