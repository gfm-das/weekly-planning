      // "Remove from this week": takes a high-potential friend off the plan (saved like any other change).
      function removeFriend(card) {
        const name = card.querySelector('[data-field="name"]')?.value.trim();
        if (!confirm(`Remove ${name || "this friend"} from this week's plan?`)) return;
        changed.people.delete("high_potential:" + card.dataset.id);
        changed.removals.add(Number(card.dataset.id));
        dropCard(card); // also shows "No high-potential friends" once the last one is gone
        scheduleSave();
      }
      // Takes a person's card (and tab) off the page. The next tab is selected if this one was.
      function dropCard(card) {
        const panel = card.closest('[role="tabpanel"]');
        if (panel) {
          const section = panel.closest("[data-people-kind]"),
            tab = tabOf(panel),
            selected = tab?.getAttribute("aria-selected") === "true";
          tab?.remove();
          panel.remove();
          const next = section.querySelector('[role="tab"]');
          if (selected && next) selectPersonTab(section, next, false, true);
        } else card.remove();
        needsRender = true; // tidies up empty sections once the page is idle
      }

      // =============================================================================================================
      // 8. THE SECTION BAR: the shortcut buttons at the top of the page
      // =============================================================================================================
      // Every section gets a colour (data-accent, see the CSS) and a button in that colour. The button of the
      // section being read or edited is filled with its colour and has aria-current, so screen readers say
      // "current location". Which section that is (pickActiveSection):
      //   1. while a jump from the bar scrolls the page: the section we jump to;
      //   2. while a box, choice or button in a section has the focus (and is on screen): that section;
      //   3. when the end of the plan is on screen: the last section (it may be too short to reach 4);
      //   4. otherwise: the section on the "reading line", a line a quarter of the way down the part of the
      //      screen under the bar (between two sections the last one found stays).
      // IntersectionObservers tell us when a section crosses the reading line, so no work runs on every scroll.
      const ACCENT_COUNT = 8; // the colours --accent-0 … --accent-7 in the CSS
      let activeSectionId = "", // the section whose button is filled
        jumpTargetId = "", // set while a jump from the bar scrolls the page
        jumpTimer = null,
        navHeight = 0, // the bar's height in pixels (measureBars)
        readingLine = 0, // pixels from the top of the window (watchSections)
        pageEndVisible = false,
        readingLineWatcher = null;
      const sectionsOnReadingLine = new Set(); // ids of the sections crossing the reading line now
      const planSections = () => [...form.querySelectorAll("[data-section]")];
      // People who ask their device for less motion get jumps without the smooth slide.
      const scrollMotion = () => (matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");
      // Called by render(): colours the sections and makes one button per section, in page order.
      function buildSectionNav() {
        const sections = planSections();
        sections.forEach((section, index) => {
          section.dataset.accent = index % ACCENT_COUNT;
          section.querySelector("h2").tabIndex = -1; // so a jump can move the keyboard there
        });
        $("sectionNav").innerHTML = sections
          .map((s) => `<button type="button" data-target="${s.id}" data-accent="${s.dataset.accent}">${esc(s.querySelector("h2").textContent)}</button>`)
          .join("");
        // The same section stays highlighted when the page is rebuilt (for example after a save).
        const keep = sections.some((s) => s.id === activeSectionId) ? activeSectionId : sections[0]?.id;
        activeSectionId = "";
        if (keep) highlightSection(keep);
        watchSections();
      }
      function highlightSection(id) {
        if (id === activeSectionId) return;
        activeSectionId = id;
        for (const button of $("sectionNav").querySelectorAll("[data-target]")) {
          if (button.dataset.target !== id) button.removeAttribute("aria-current");
          else {
            button.setAttribute("aria-current", "location");
            keepButtonInView(button);
          }
        }
      }
      // On a phone the bar is one row that scrolls sideways: slide the filled button to the middle when
      // it is not fully visible. (On a computer every button is visible, so nothing moves.)
      function keepButtonInView(button) {
        const bar = $("sectionNav").getBoundingClientRect(),
          box = button.getBoundingClientRect();
        if (box.left >= bar.left && box.right <= bar.right) return;
        $("sectionNav").scrollBy({ left: box.left - bar.left - (bar.width - box.width) / 2, behavior: scrollMotion() });
      }
      // A click on a button (or Enter or Space on it) scrolls to its section and moves the keyboard to the
      // section's heading, so the next Tab goes to its first question.
      function jumpToSection(id) {
        const section = $(id);
        if (!section) return;
        jumpTargetId = id;
        highlightSection(id);
        section.scrollIntoView({ behavior: scrollMotion(), block: "start" });
        section.querySelector("h2").focus({ preventScroll: true });
        waitForScrollToStop(400); // in case the page does not need to move at all
      }
      // The jump is over when the page has not scrolled for a moment. The section jumped to stays
      // highlighted until the reader scrolls on (near the end of the page it cannot reach the top).
      function waitForScrollToStop(ms) {
        clearTimeout(jumpTimer);
        jumpTimer = setTimeout(() => {
          jumpTargetId = "";
        }, ms);
      }
      function pickActiveSection() {
        const sections = planSections();
        if (jumpTargetId || !sections.length) return;
        const editing = sectionBeingEdited();
        if (editing) return highlightSection(editing.id);
        if (pageEndVisible && scrollY > 0) return highlightSection(sections[sections.length - 1].id);
        const onLine = sections.find((s) => sectionsOnReadingLine.has(s.id));
        if (onLine) highlightSection(onLine.id);
      }
      // The section of the focused box, choice or button when it is on screen. A heading focused by a jump
      // (tabIndex -1) does not count: it only shows where the keyboard is.
      function sectionBeingEdited() {
        const focused = document.activeElement;
        if (!focused || !form.contains(focused) || focused.tabIndex < 0) return null;
        const box = focused.getBoundingClientRect();
        if (box.bottom <= navHeight || box.top >= innerHeight) return null;
        return focused.closest("[data-section]");
      }
      // A quarter of the way down the part of the window under the bar.
      const readingLineNow = () => Math.round(navHeight + (innerHeight - navHeight) / 4);
      // Watches the sections against the reading line: the observer looks at a 1 pixel high strip of the
      // window at that line. root: document measures against this page's own window, which is also right
      // when the page is inside the portal's frame.
      function watchSections() {
        readingLineWatcher?.disconnect();
        sectionsOnReadingLine.clear();
        readingLine = readingLineNow();
        readingLineWatcher = new IntersectionObserver(readingLineChanged, {
          root: document,
          rootMargin: `-${readingLine}px 0px -${Math.max(0, innerHeight - readingLine - 1)}px 0px`,
        });
        for (const section of planSections()) readingLineWatcher.observe(section);
      }
      function readingLineChanged(entries) {
        for (const entry of entries) {
          if (entry.isIntersecting) sectionsOnReadingLine.add(entry.target.id);
          else sectionsOnReadingLine.delete(entry.target.id);
        }
        pickActiveSection();
      }
      // Two markers: one just above the bar (out of sight above: the bar is pinned, so it gets a shadow)
      // and one after the last section (in sight: the end of the plan is on screen).
      function watchPageEdges() {
        const watcher = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (entry.target.id === "sectionNavMarker") {
                const scrolledPast = !entry.isIntersecting && entry.boundingClientRect.top < 0;
                $("sectionNav").classList.toggle("stuck", scrolledPast);
              }
              if (entry.target.id === "planEnd") {
                pageEndVisible = entry.isIntersecting;
                pickActiveSection();
              }
            }
          },
          { root: document },
        );
        watcher.observe($("sectionNavMarker"));
        watcher.observe($("planEnd"));
      }
      // The heights of the bar at the top and the save bar at the bottom, for the page's scroll room (the
      // CSS variables) and the reading line. Measured again whenever a bar or the window changes size.
      function measureBars() {
        const height = $("sectionNav").offsetHeight,
          actions = $("actions");
        document.documentElement.style.setProperty("--section-nav-height", height + "px");
        document.documentElement.style.setProperty(
          "--actions-height",
          actions.hidden ? "0px" : Math.max(0, innerHeight - actions.getBoundingClientRect().top) + "px",
        );
        navHeight = height;
        if (readingLineNow() !== readingLine) watchSections();
      }
      $("sectionNav").addEventListener("click", (event) => {
        const button = event.target.closest("[data-target]");
        if (button) jumpToSection(button.dataset.target);
      });
      addEventListener(
        "scroll",
        () => {
          if (jumpTargetId) waitForScrollToStop(150); // a jump is still moving the page
        },
        { passive: true },
      );
      form.addEventListener("focusin", pickActiveSection);
      form.addEventListener("focusout", () => setTimeout(pickActiveSection));
      const barSizeWatcher = new ResizeObserver(measureBars);
      barSizeWatcher.observe($("sectionNav"));
      barSizeWatcher.observe($("actions"));
      addEventListener("resize", measureBars);
      watchPageEdges();

      // =============================================================================================================
      // 9. WHAT IS STILL TO ANSWER: hidden questions, the progress bar and the checks before submitting
      // =============================================================================================================
      // Hides the questions whose show/hide rules are not met (and their error marks).
      function updateConditionalQuestions() {
        const hidden = applyConditions(formAnswerValues()),
          byKey = questionMap();
        for (const wrap of form.querySelectorAll("[data-question]")) {
          const key = wrap.dataset.question,
            q = byKey.get(key);
          if (!q || !(q.rules || []).length) continue;
          wrap.classList.toggle("conditional-hidden", hidden.has(key));
          if (hidden.has(key)) {
            wrap.classList.remove("invalid");
            wrap.querySelector(".field-error")?.remove();
          } else if (hasHiddenAnswer(q)) numberHint(answerInput(key));
        }
      }
      // Removes every error mark on the page (questions and person cards).
      function clearFieldErrors() {
        form.querySelectorAll(".field-error").forEach((error) => error.remove());
        form.querySelectorAll(".invalid").forEach((wrap) => wrap.classList.remove("invalid"));
      }
      // Removes the error mark of the question this input belongs to.
      function clearFieldError(input) {
        const wrap = input?.closest?.(".question.invalid");
        if (!wrap) return;
        wrap.classList.remove("invalid");
        wrap.querySelector(".field-error")?.remove();
      }
      // Marks the questions still to answer, by key. messages: the server's text per key, if any.
      function showFieldErrors(missing, messages = {}) {
        clearFieldErrors();
        const values = formAnswerValues();
        for (const key of missing) {
          const wrap = questionWrap(key);
          if (!wrap) continue;
          wrap.classList.add("invalid");
          if (wrap.dataset.type === "GRID")
            for (const row of wrap.querySelectorAll("tr[data-row]")) row.classList.toggle("unanswered", !values[key]?.[row.dataset.row]);
          const error = document.createElement("div");
          error.className = "field-error";
          error.id = "error-" + key;
          error.textContent = messages[key] || "Please answer this question.";
          const control = wrap.querySelector(".answer-grid,.choice-pills,input,select,textarea");
          if (control) {
            control.setAttribute("aria-describedby", error.id);
            control.after(error);
          } else wrap.append(error);
        }
      }
      // The server's required check at submit names questions by key. A key this page does not show is a
      // question added in DA Management after the page's last save: a save brings the new questions and the
      // form is rebuilt (as nothing is being typed), so it can be marked too.
      async function showServerFieldErrors(fields) {
        if (Object.keys(fields).some((key) => !questionWrap(key))) {
          await save(true).catch(() => {}); // save() shows its own error
          renderWhenIdle();
        }
        showFieldErrors(Object.keys(fields).filter((key) => questionWrap(key)), fields);
      }
      // Keys of the required questions not answered yet, in form order (the server checks the same
      // at submit: planning._missing_question_answers). Questions hidden by their show/hide rules are
      // not required; a yes/no question needs Yes or No; a grid needs an answer in every row. A choice
      // question without choices (or a grid without rows) cannot be answered and never blocks.
      function requiredMissing() {
        const values = formAnswerValues(),
          hidden = applyConditions({ ...values }),
          missing = [];
        for (const q of data.questions.filter((q) => q.required)) {
          const key = q.question_key;
          if (hidden.has(key) || !questionWrap(key) || cannotBeAnswered(q)) continue;
          if (!isAnswered(q, values[key])) missing.push(key);
        }
        return missing;
      }
      function cannotBeAnswered(q) {
        const choice = ["SELECT", "RADIO", "CHECKBOX", "GRID"].includes(q.question_type);
        return choice && (!(q.options || []).length || (q.question_type === "GRID" && !(q.rows || []).length));
      }
      function isAnswered(q, value) {
        if (q.question_type === "BOOLEAN") return typeof value === "boolean";
        if (q.question_type === "GRID") return (q.rows || []).every((row) => !blank(value?.[row.key]));
        return !blank(typeof value === "string" ? value.trim() : value);
      }
      // The bar in the week card, and the tick on a section's button once its required questions are answered.
      function updateProgress() {
        if (!data) return;
        const required = data.questions.filter((q) => q.required),
          missing = requiredMissing();
        $("progressBar").style.width = (required.length ? ((required.length - missing.length) / required.length) * 100 : 100) + "%";
        for (const section of form.querySelectorAll("[data-section]")) {
          const keys = [...section.querySelectorAll('[data-required="true"]')].map((x) => x.dataset.question),
            button = $("sectionNav").querySelector(`[data-target="${section.id}"]`);
          button?.classList.toggle("complete", keys.length > 0 && keys.every((k) => !missing.includes(k)));
        }
      }
      // ---- People still to finish ----------------------------------------------------------------------------
      const blankAnswer = (value) => value == null || (typeof value === "string" && !value.trim());
      // What to say under an unanswered person question.
      function missingText(card, key) {
        const input = card.querySelector(`[data-field="${key}"]`);
        if (key === "name") return "Enter the friend's name.";
        if (input?.dataset.pills) return input.dataset.pills === "yesno" ? "Choose Yes or No." : "Choose Yes, No or Not applicable.";
        if (input?.tagName === "SELECT") return "Choose the next ordinance.";
        if (input?.type === "date") return "Enter the date.";
        if (input?.type === "number") return "Enter a number (0 if none).";
        return "Please fill this in.";
      }
      function markPersonField(card, key, text) {
        const wrap = card.querySelector(`[data-wrap="${key}"]`);
        if (!wrap) return;
        wrap.classList.add("invalid");
        if (!wrap.querySelector(".field-error.person-error")) {
          const error = document.createElement("span");
          error.className = "field-error person-error";
          error.textContent = text;
          wrap.append(error);
        }
      }
      function clearPersonError(target) {
        const wrap = target.closest?.("[data-wrap].invalid");
        if (!wrap) return;
        wrap.classList.remove("invalid");
        wrap.querySelector(".person-error")?.remove();
        updateTabBadge(wrap.closest("[data-person-group]"));
      }
      // The number of unanswered questions, on the person's tab (after a submit attempt).
      function updateTabBadge(card) {
        const tab = tabOf(card?.closest('[role="tabpanel"]'));
        if (!tab) return;
        const count = card.querySelectorAll("[data-wrap].invalid").length;
        let badge = tab.querySelector(".tab-badge");
        if (!count) return badge?.remove();
        if (!badge) {
          badge = document.createElement("span");
          badge.className = "tab-badge";
          tab.append(badge);
        }
        badge.textContent = count;
        badge.title = `${count} question${count === 1 ? "" : "s"} to answer`;
      }
      // The page side of the submit check for people (the server repeats it: planning._missing_person_fields).
      // Marks every unanswered question, puts the count on each person's tab and opens the first one.
      function peopleIncomplete() {
        const incomplete = [];
        for (const card of form.querySelectorAll("[data-person-group]")) {
          if (card.dataset.current === "false") continue;
          const keys = [...PEOPLE_REQUIRED[card.dataset.personGroup]];
          if (card.dataset.personGroup === "new_members" && personValue(card, "discussed_in_gemiko") === true) keys.push("gemiko_support_plan");
          incomplete.push({ card, missing: keys.filter((key) => blankAnswer(personValue(card, key))) });
        }
        return showIncompletePeople(incomplete);
      }
      // Shows a list of { card, missing: [question keys] } (earlier marks are cleared first): marks each question,
      // puts the count on each person's tab, opens the first person's tab and says who is not finished.
      // Returns false when nobody has anything missing.
      function showIncompletePeople(list) {
        clearPersonMarks();
        const incomplete = list.filter((item) => item.card && item.missing.length).map((item) => item.card);
        for (const { card, missing } of list.filter((item) => item.card)) {
          for (const key of missing) markPersonField(card, key, missingText(card, key));
          if (missing.length) updateTabBadge(card);
        }
        if (!incomplete.length) return false;
        openTabOf(incomplete[0]);
        const names = incomplete.map((card) => card.querySelector("h3")?.textContent || personValue(card, "name") || "a new friend");
        message.textContent =
          (incomplete.length === 1
            ? `Almost there. A few questions about ${names[0]} are not answered yet.`
            : `Almost there. Some questions about ${incomplete.length} people are not answered yet: ${names.join(", ")}.`) +
          " Each one is marked, with a count on the person's tab.";
        message.className = "status error";
        incomplete[0].querySelector("[data-wrap].invalid")?.scrollIntoView({ behavior: "smooth", block: "center" });
        return true;
      }
      function clearPersonMarks() {
        for (const badge of form.querySelectorAll(".tab-badge")) badge.remove();
        for (const wrap of form.querySelectorAll("[data-wrap].invalid")) {
          wrap.classList.remove("invalid");
          wrap.querySelector(".person-error")?.remove();
        }
      }
      // The server's list when it refuses a submit (400 with fields.people: [{ group, id, name, fields }]), for
      // example when the companion added a friend or cleared an answer while this page was submitting: the same
      // marks, counts and jump as the page's own check. When the list does not match the page (a person it does
      // not show, or an answer it shows), the plan is loaded again first; then only what is still unanswered is
      // marked. If nothing can be marked, the server's message is shown.
      async function showServerIncomplete(people, text) {
        const cardOf = (person) =>
            form.querySelector(`[data-person-group="${CSS.escape(String(person.group))}"][data-id="${CSS.escape(String(person.id))}"]`),
          listed = (person) => (Array.isArray(person.fields) ? person.fields : []),
          check = () =>
            people.map((person) => {
              const card = cardOf(person);
              return { card, missing: card ? listed(person).filter((key) => blankAnswer(personValue(card, key))) : [], listed: listed(person) };
            });
        try {
          if (check().some((item) => !item.card || item.missing.length < item.listed.length)) {
            await flush();
            await load(data.report.unit_id);
          }
          if (showIncompletePeople(check())) return;
        } catch {
          // The server's message below says who is not finished.
        }
        message.textContent = text;
        message.className = "status error";
      }
      // ---- What Submit says when something is not ready ------------------------------------------------------
      // A number box that cannot be saved: the plan would be submitted with the saved number, not this one.
      function showUnsavedNumber(box) {
        openTabOf(box);
        message.textContent = "A number on this plan is not saved yet. Fix the marked box, then submit.";
        message.className = "status error";
        box.scrollIntoView({ behavior: "smooth", block: "center" });
      }
      function showMissingQuestions(missing) {
        showFieldErrors(missing);
        message.textContent = `${missing.length} required question${missing.length === 1 ? " is" : "s are"} not answered yet. Each one is marked.`;
        message.className = "status error";
        questionWrap(missing[0])?.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      // =============================================================================================================
      // 10. SAVING: only what changed, a moment after the last change
      // =============================================================================================================
      // Notes that an answer or a person's field changed, and saves soon.
      function markDirty(target) {
        if (!data?.can_edit) return;
        const card = target.closest?.("[data-person-group]");
        if (target.dataset.key) changed.answers.add(target.dataset.key);
        else if (card && target.dataset.field) {
          const row = card.dataset.personGroup + ":" + card.dataset.id;
          if (!changed.people.has(row)) changed.people.set(row, new Set());
          changed.people.get(row).add(target.dataset.field);
        }
        scheduleSave();
      }
      // Saves 0.65 seconds after the last change, so typing a word is one save and not one per letter.
      function scheduleSave() {
        if (!data?.can_edit) return;
        saveState.textContent = "Saving…";
        updateProgress();
        clearTimeout(timer);
        timer = setTimeout(() => save().catch(() => {}), 650); // save() shows its own error
      }
      // The answers to save: the ones changed here, plus the follow-ups those changes hide or show.
      // Hidden by a changed answer: the follow-up's value when hidden (0) when that answer is given, ""
      // when it was cleared. Shown again by a changed answer: the saved follow-up is still that value
      // or "", so the number typed here before it was hidden (mergeAnswers keeps it in the box) is
      // saved again. Anything else is left out, because this page's copy of the answers it did not
      // change may be out of date and must never overwrite or delete the companion's follow-up.
      function changedAnswers(keys) {
        const raw = formAnswerValues(),
          values = { ...raw },
          byKey = questionMap(),
          hidden = applyConditions(values),
          out = {};
        for (const key of keys) {
          if (!(key in values) || badNumber(answerInput(key))) continue; // a number the server would refuse waits
          if (byKey.get(key)?.question_type !== "GRID") out[key] = values[key];
          else if (Object.keys(gridChanges(key, values[key])).length) out[key] = gridChanges(key, values[key]);
        }
        addFollowUpChanges(out, raw, values, hidden, byKey);
        return out;
      }
      // Adds to "out" the follow-ups whose parent question is in "out" (see changedAnswers).
      function addFollowUpChanges(out, raw, values, hidden, byKey) {
        const hiddenBefore = applyConditions({ ...data.answers });
        for (const key of ruleOrder(byKey)) {
          const q = byKey.get(key);
          if (!hasHiddenAnswer(q) || !(key in values)) continue;
          const changedRules = rulesOf(q, byKey).filter((rule) => rule.parent in out);
          if (!changedRules.length) continue;
          const failing = changedRules.filter((rule) => hidden.has(rule.parent) || !rulePasses(rule, values[rule.parent]));
          if (failing.some((rule) => !blank(values[rule.parent]))) out[key] = hiddenAnswer(q);
          else if (failing.length) out[key] = "";
          else if (!hidden.has(key) && hiddenBefore.has(key) && raw[key] !== "" && !badNumber(answerInput(key)))
            out[key] = raw[key];
        }
      }
      const personCard = (group, id) => form.querySelector(`[data-person-group="${group}"][data-id="${id}"]`);
      // The person fields to save, per group: [{ id, field: value, ... }], and the friends to remove.
      function changedPeople(rows, removals) {
        const out = { new_members: [], baptismal_friends: [], high_potential: [] };
        for (const [row, fields] of rows) {
          const [group, id] = row.split(":"),
            card = personCard(group, id),
            values = { id: Number(id) };
          if (!card) continue;
          for (const field of fields) {
            const input = card.querySelector(`[data-field="${field}"]`);
            if (input && !badNumber(input)) values[field] = inputValue(input);
          }
          // A friend needs a name: a blank one is not sent, so the saved name stays.
          if (group === "high_potential" && "name" in values && !String(values.name).trim()) delete values.name;
          if (Object.keys(values).length > 1) out[group].push(values);
        }
        for (const id of removals) out.high_potential.push({ id, removed: true });
        return out;
      }
      let saveError = null; // the last failed save's message, so the next good save can take it away
      // Saves what changed. force: save even without changes here (the reply brings the companion's newest
      // answers). Only one save runs at a time; changes made meanwhile go with the next one.
      async function save(force = false) {
        if (!data?.can_edit || (!force && !hasChanges())) return saving;
        clearTimeout(timer);
        if (saving) {
          await saving;
          return hasChanges() ? save() : undefined;
        }
        const reportId = data.report.report_id,
          sent = takeChanges(),
          answers = changedAnswers(sent.answers),
          people = changedPeople(sent.people, sent.removals),
          wrote = Object.keys(answers).length > 0 || Object.values(people).some((rows) => rows.length > 0);
        saving = sendChanges(reportId, answers, people)
          .then((replies) => useSaveReplies(replies, reportId, sent, answers, wrote))
          .catch(showSaveError)
          .finally(() => (saving = null));
        await saving;
        if (hasChanges()) return save();
        renderWhenIdle();
      }
      // Hands over the list of changes to a save and starts a new, empty one.
      function takeChanges() {
        const sent = { answers: changed.answers, people: changed.people, removals: changed.removals };
        changed.answers = new Set();
        changed.people = new Map();
        changed.removals = new Set();

      }
      // Sends the answers and the people at the same time; each reply is kept, whether it went through or not.
      // changes_only: an older planning service refuses it instead of deleting what is left out.
      function sendChanges(reportId, answers, people) {
        const put = (part, body) => portalAPI(`planning/reports/${reportId}/${part}`, { method: "PUT", body });
        return Promise.allSettled([
          put("answers", { answers: { changes_only: true, catalog_version: data.catalog_version ?? undefined, ...answers } }),
          put("people", { people: { changes_only: true, ...people } }),
        ]);
      }
      // What the server answered to a save. Nothing is shown for a plan that is no longer on the page (another
      // ward or branch was chosen meanwhile). Throws the error of a part that did not go through.
      function useSaveReplies([answersReply, peopleReply], reportId, sent, answers, wrote) {
        const current = reportId === data.report.report_id;
        if (current) keepFailedChanges(answersReply, peopleReply, sent);
        if (current) mergeSaveReplies(answersReply, peopleReply, sent, answers);
        const failed = [answersReply, peopleReply].find((result) => result.status === "rejected");
        if (failed) throw failed.reason;
        // The error is cleared only while it is still what the message shows; i18n.js may already show it
        // in the reader's language, so the translated text counts too.
        if (saveError && [saveError, window.MissionI18n?.translate(saveError)].includes(message.textContent))
          message.textContent = "";
        showRetry(false);
        saveState.textContent = hasChanges()
          ? "Saving…"
          : badNumbers().length
            ? "Fix the marked number to save it"
            : wrote
              ? "Saved just now"
              : "All changes saved";
      }
      // A part that failed stays changed, so the next save sends it again.
      function keepFailedChanges(answersReply, peopleReply, sent) {
        if (answersReply.status === "rejected") for (const key of sent.answers) changed.answers.add(key);
        if (peopleReply.status === "rejected") {
          for (const [row, fields] of sent.people) changed.people.set(row, new Set([...fields, ...(changed.people.get(row) || [])]));
          for (const id of sent.removals) changed.removals.add(id);
        }
      }
      // A part that went through shows the saved plan (a companion may have changed it meanwhile). Only a reply
      // that carries the saved plan is merged (an older service sends just "ok").
      function mergeSaveReplies(answersReply, peopleReply, sent, answers) {
        if (answersReply.status === "fulfilled" && answersReply.value?.answers)
          mergeAnswers(answersReply.value.answers, new Set([...sent.answers, ...Object.keys(answers)]), answers);

      }

      // =============================================================================================================
      // 11. SHOWING WHAT THE SERVER SAVED (a companion may be working on the same plan)
      // =============================================================================================================
      // After each save the server sends the whole plan back. Fields then show the saved values

      const typing = (input) => input === document.activeElement && input.type !== "checkbox";
      function setInput(input, value) {
        if (input.dataset.pills) setPill(input, value);

      }
      // Follow-ups: questions that a show/hide rule can hide and that then save their value when hidden.

      function mergeAnswers(fresh, sent, payload = {}) {
        const before = data.answers || {};
        data.answers = fresh;
        const later = followUps(),
          keep = (wrap) =>
            [...wrap.querySelectorAll("[data-key]")].some((input) => typing(input) && input.type !== "radio") ||
            [...wrap.querySelectorAll('input[type="number"]')].some(badNumber) ||
            changed.answers.has(wrap.dataset.question) ||
            sent.has(wrap.dataset.question);
        for (const wrap of form.querySelectorAll("[data-question]")) {
          const key = wrap.dataset.question;
          if (wrap.dataset.type === "GRID") mergeGrid(wrap, before[key], fresh[key], sent.has(key) ? payload[key] : undefined);
          else if (!later.has(key) && !keep(wrap)) setAnswer(wrap, fresh[key]);

        // A follow-up takes the saved value only while the answers above show it. While hidden it
        // keeps the number typed here, which changedAnswers saves again if a change here shows it.
        for (const key of later) {
          const wrap = questionWrap(key);

        }
        updateConditionalQuestions();
        updateProgress();
      }
      // The questions were changed in DA Management since this page loaded them. The save that noticed
      // it kept every answer whose question is still asked; the new questions are shown as soon as
      // nothing is being typed or saved (renderWhenIdle), with the answers saved so far.
      function catalogUpdate(reply) {
        const lost = lostAnswerNames(reply);
        if (reply.catalog_version != null) data.catalog_version = reply.catalog_version;
        if (reply.catalog_changed && Array.isArray(reply.questions)) {
          data.questions = reply.questions;
          needsRender = true;
        }
        if (lost.length) {
          message.textContent = `The planning questions were just updated. ${lost.join(", ")} ${lost.length === 1 ? "is" : "are"} no longer asked like this, so what you entered there was not saved.`;
          message.className = "status";

      }

      function lostAnswerNames(reply) {

          // A grid row or tick-box choice no longer offered: only that part of the answer was left out.
          part = (key, item) => {

            return `“${name}” in “${labels.get(key) || key}”`;

      function showSavedPerson(card, row, key, sent) {

          const field = input.dataset.field;

          setInput(input, field === "name" && row[field] === HIGH_POTENTIAL_PLACEHOLDER ? "" : row[field]);

      // lost: people whose last change here could not be saved; gone: other people removed elsewhere.

        if (!lost.length && !gone.length) return;

          ? `${lost.join(", ")} ${lost.length === 1 ? "was" : "were"} removed from this plan by someone else, so your last change there was not saved.`

          adding ||

      // =============================================================================================================
      // 12. LOADING THE PLAN
      // =============================================================================================================
      // Loads this week's plan of a ward or branch (none: the one the server picks) and draws it.
      async function load(unit) {
        message.textContent = "Loading your shared plan…";
        message.className = "status";
        try {
          const fresh = await portalAPI("planning/form" + (unit ? "?unit_id=" + unit : ""));
          clearTimeout(timer);
          const kept = data?.report.report_id === fresh.report.report_id ? hiddenFollowUps() : {};
          data = fresh;
          changed.answers.clear();
          changed.people.clear();
          changed.removals.clear();
          needsRender = false;
          render();
          restoreFollowUps(kept);
          message.textContent = "";
          saveState.textContent = "All changes saved";
          showRetry(false);
        } catch (e) {
          // Keep the plan (and unit) already on screen, if there is one.

          message.className = "status error";
          return;

      }

        createMode = "create", // "create", "edit" (Edit details) or "convert" (Baptized)
        createRow = null; // the plan's row of the person being edited or baptized

        const unit = data.units.find((u) => u.unit_id === data.report.unit_id)?.unit || "not chosen yet";

          else if (input.validity && input.validity.badInput) errors[key] = type === "date" ? "Enter a valid date." : "Enter a whole number from 0 to 30.";
          else if (type === "date" && values[key] && values[key] > today) errors[key] = `${CREATE_DATE_LABELS[key]} cannot be in the future.`;

          status.className = "status error";

        await createPerson(kind, values, status);
      }
      // A new person: created by the server, added to this week's plan, then shown on their own tab.
      async function createPerson(kind, values, status) {
        let created;
        lockDialog($("createForm"), true);
        try {
          status.textContent = "Adding…";
          status.className = "status";
          await flush();
          created = await portalAPI(`planning/reports/${data.report.report_id}/people/${CREATE_FORMS[kind].endpoint}`, { method: "POST", body: values });
        } catch (e) {
          lockDialog($("createForm"), false);
          if (e.fields) showCreateErrors(e.fields);
          status.textContent = e.message;
          status.className = "status error";
          if (!$("createDialog").open) {
            message.textContent = e.message;
            message.className = "status error";
          }
          return;
        }
        lockDialog($("createForm"), false);
        $("createDialog").close();
        selectAfterLoad = { kind, personId: created.id };
        await load(data.report.unit_id);
        message.textContent = `${[values.first_name, values.last_name].filter(Boolean).join(" ")} was added to this week's plan.`;
        message.className = "status";
      }
      // ---- 13b. "+ Add from list" (#personDialog) -------------------------------------------------------------
      let addKind = null; // the group the person is added to
      function openPersonPicker(kind) {
        if (stillAdding()) return;
        addKind = kind;
        const items = data.available_people?.[kind] || [],
          // An empty list means either everyone is already on this plan or no one is listed for the area yet.
          onPlan = (data.people?.[kind] || []).some((p) => p.is_current !== false);
        $("personTitle").textContent =
          kind === "new_members" ? "Add a new member from your list" : "Add a friend with a baptismal date from your list";
        $("personHint").textContent = items.length
          ? "Choose someone assigned to your area."
          : onPlan
            ? "Everyone on your area's list is already on this week's plan."
            : kind === "new_members"
              ? 'No new members are listed for your area in this ward or branch yet. Use "+ New member" to add one.'
              : 'No friends with a baptismal date are listed for your area yet. Use "+ Add person on date" to add one.';
        $("personSelect").innerHTML = items.length
          ? '<option value="">Choose a person…</option>' + items.map((p) => `<option value="${p.id}">${esc(p.display_name)}</option>`).join("")
          : `<option value="">${onPlan ? "No one else to add" : "No one to add yet"}</option>`;
        $("personSave").disabled = !items.length;
        $("personStatus").textContent = "";
        $("personDialog").showModal();
      }
      async function addPersonFromList(event) {
        event.preventDefault();
        const personId = Number($("personSelect").value),
          kind = addKind;
        if (!personId || adding) return;
        lockDialog($("personForm"), true);
        try {
          $("personStatus").textContent = "Adding…";
          await flush();
          await portalAPI(`planning/reports/${data.report.report_id}/people/${kind === "new_members" ? "existing_new_member" : "existing_baptismal"}`, {
            method: "POST",
            body: { person_id: personId },
          });
        } catch (e) {
          lockDialog($("personForm"), false);
          $("personStatus").textContent = e.message;
          if (!$("personDialog").open) {
            message.textContent = e.message;
            message.className = "status error";
          }
          return;
        }
        lockDialog($("personForm"), false);
        $("personDialog").close();
        selectAfterLoad = { kind, personId };
        await load(data.report.unit_id);
      }
      // ---- 13c. The buttons on a person card -----------------------------------------------------------------
      // A new high-potential friend: added at once (without a name yet) and shown on a new tab.
      async function addHighPotential(button) {
        if (adding) return; // a double tap must not add two friends
        adding = true;
        button.disabled = true;
        try {
          await flush();
          saveState.textContent = "Adding a friend…";
          const created = await portalAPI(`planning/reports/${data.report.report_id}/people/high_potential`, { method: "POST", body: {} });
          await flush();
          selectAfterLoad = { kind: "high_potential", rowId: created.id };
          await load(data.report.unit_id);
          form.querySelector(`[data-person-group="high_potential"][data-id="${created.id}"] [data-field="name"]`)?.focus();
        } catch (e) {
          message.textContent = e.message;
          message.className = "status error";
        } finally {
          adding = false;
          button.disabled = false;
        }
      }
      const personRow = (card) => data.people[card.dataset.personGroup].find((p) => String(p.id) === card.dataset.id);
      // Edit details, Baptized, Transfer, End follow-up, No longer on date or Delete, for the person on this card.
      function openPersonAction(action, card) {
        if (stillAdding() || !card) return;
        if (badNumbers().length) {
          message.textContent = "A number on this plan is not saved yet. Fix the marked box first.";
          message.className = "status error";
          return;
        }
        const group = card.dataset.personGroup,
          row = personRow(card);
        if (!row) return;
        if (action === "edit") return openCreatePerson(group, "edit", row);
        if (action === "baptized") return openCreatePerson("new_members", "convert", row, card);
        openManage(action, group, row);
      }
      // Saves what is still open, runs the action, then shows the plan the server sends back.
      async function runPersonAction(group, row, action, body, dialogForm, status, onFields) {
        let result;
        lockDialog(dialogForm, true);
        try {
          status.textContent = "Saving…";
          status.className = "status";
          await flush();
          result = await portalAPI(`planning/reports/${data.report.report_id}/people/${group}/${row[PERSON_COLUMN[group]]}/${action}`, { method: "POST", body });
        } catch (e) {
          lockDialog(dialogForm, false);
          if (e.fields) onFields?.(e.fields);
          status.textContent = e.message;
          status.className = "status error";
          return { error: e };
        }
        lockDialog(dialogForm, false);
        dialogForm.closest("dialog").close();
        applyPeople(
          result.people,
          tabAfterAction(result),
          result.available_people,
        );
        message.textContent = result.message;
        message.className = "status";
        return result;
      }
      // After Baptized or Transfer the tab of the person the server names is opened (if they are on this plan).
      function tabAfterAction(result) {
        if (result.new_member_id) return { kind: "new_members", personId: result.new_member_id };
        if (result.baptismal_date_person_id) return { kind: "baptismal_friends", personId: result.baptismal_date_person_id };
        return null;
      }
      // The plan after an action on a person: shown at once, without loading the page again.
      // available: the "Add from list" lists the server sends back, so their counts are right at once.
      function applyPeople(people, select = null, available = null) {
        data.people = people;
        if (available) data.available_people = available;
        selectAfterLoad = select;
        const kept = hiddenFollowUps();
        render();
        restoreFollowUps(kept);
      }
      // ---- 13d. Transfer, End follow-up, No longer on date ("drop") and Delete (#manageDialog) ---------------
      let manage = null, // { action, group, row } of the open pop-up
        transferTargets = null; // the areas a person can move to (loaded once, when first needed)
      function loadTransferTargets() {
        if (!transferTargets)
          transferTargets = portalAPI("planning/transfer-targets").catch((e) => {
            transferTargets = null; // try again next time
            throw e;
          });
        return transferTargets;
      }
      const selectField = (key, label, options, placeholder) =>
        `<div class="question" data-manage-field="${key}"><label for="manage-${key}">${esc(label)}${REQUIRED_MARK}</label><select id="manage-${key}" name="${key}" aria-required="true"><option value="">${esc(placeholder)}</option>${options}</select></div>`;
      function openManage(action, group, row) {
        const name = row.display_name,
          instead = group === "new_members" ? ["end", "End follow-up"] : ["drop", "No longer on date"];
        manage = { action, group, row };
        resetManageDialog(action, name);
        $("manageAlt").onclick = () => openManage(instead[0], group, row);
        if (action === "transfer") showTransferForm(name);
        else if (action === "end" || action === "drop") showReasonForm(action, name);
        else showDeleteQuestion(row, name, instead[1]);
        if (!$("manageDialog").open) $("manageDialog").showModal();
        $("manageFields").querySelector("select:not(:disabled)")?.focus();
      }
      function resetManageDialog(action, name) {
        const save = $("manageSave");
        $("manageStatus").textContent = "";
        $("manageStatus").className = "status";
        for (const control of $("manageForm").elements) control.disabled = false;
        save.hidden = false;
        save.classList.toggle("danger", action === "delete");
        $("manageCancel").textContent = action === "delete" ? `Keep ${name}` : "Cancel";
        $("manageAlt").hidden = true;
      }
      function showTransferForm(name) {
        $("manageTitle").textContent = `Transfer ${name} to another area`;
        $("manageHint").textContent = `Choose the area and ward or branch ${name} is moving to. ${name} leaves this week's plan now and appears on the new area's plan, so the missionaries there can keep helping.`;
        $("manageFields").innerHTML =
          selectField("area_id", "New area", "", "Loading the areas…") + selectField("unit_id", "Ward or branch", "", "Choose the area first");
        $("manage-unit_id").disabled = true;
        $("manageSave").textContent = "Transfer";
        fillTransferAreas();
      }
      // End follow-up (a New Member) and No longer on date (a friend): both ask for a reason.
      function showReasonForm(action, name) {
        const ending = action === "end",
          reasons = ending ? END_REASONS : DROP_REASONS;
        $("manageTitle").textContent = ending ? `End follow-up for ${name}` : `${name} is no longer on date`;
        $("manageHint").textContent = ending
          ? "New members stay in follow-up for their first year. End it early only for one of these reasons. Their ward keeps caring for them."
          : `This takes ${name} off the baptismal date list. You can keep teaching ${name}, and add them again when a new date is set.`;
        $("manageFields").innerHTML = selectField("reason", "Reason", reasons.map(([value, text]) => `<option value="${value}">${esc(text)}</option>`).join(""), "Choose a reason…");
        $("manageSave").textContent = ending ? "End follow-up" : "Take off date list";
      }
      // Delete is only for someone added by mistake; insteadLabel names the other way to take them off the list.
      function showDeleteQuestion(row, name, insteadLabel) {
        $("manageTitle").textContent = `Delete ${name}?`;
        $("manageFields").innerHTML = "";
        if (row.on_submitted_plan)
          return showKeptInstead(`${name} is already on an earlier or submitted weekly plan, so the record is kept for the mission's reports. To take ${name} off your list, use "${insteadLabel}" instead.`);
        $("manageHint").textContent = `Use this only if ${name} was added by mistake, for example twice or with the wrong name. The record is deleted for good and cannot be brought back. Not a mistake? Use "${insteadLabel}" instead.`;
        $("manageSave").textContent = "Delete for good";
        $("manageAlt").textContent = `${insteadLabel} instead`;
        $("manageAlt").hidden = false;
      }
      // Delete is refused for someone on an earlier or submitted plan: explain and offer End follow-up / No longer on date.
      function showKeptInstead(text) {
        $("manageHint").textContent = text;
        $("manageStatus").textContent = "";
        $("manageSave").hidden = true;
        $("manageAlt").textContent = manage.group === "new_members" ? "End follow-up instead" : "No longer on date instead";
        $("manageAlt").hidden = false;
        $("manageAlt").focus();
      }
      async function fillTransferAreas() {
        const areaSelect = $("manage-area_id");
        let targets;
        try {
          targets = await loadTransferTargets();
        } catch (e) {
          $("manageStatus").textContent = e.message;
          $("manageStatus").className = "status error";
          return;
        }
        if (!areaSelect.isConnected) return; // the pop-up changed meanwhile
        areaSelect.innerHTML = '<option value="">Choose the new area…</option>' + areaOptions(targets);
        areaSelect.onchange = () =>
          showUnitsOf(targets.areas.find((item) => String(item.area_id) === areaSelect.value), areaSelect);
      }
      // The areas grouped by "zone · district", with this companionship's own area marked.
      function areaOptions(targets) {
        const groups = new Map();
        for (const area of targets.areas) {
          const label = `${area.zone} · ${area.district}`;
          if (!groups.has(label)) groups.set(label, []);
          groups.get(label).push(area);
        }
        return [...groups]
          .map(([label, areas]) => `<optgroup label="${esc(label)}">${areas.map((area) => `<option value="${area.area_id}">${esc(area.area)}${area.area_id === targets.current_area_id ? " (your area)" : ""}</option>`).join("")}</optgroup>`)
          .join("");
      }
      // The wards and branches of the chosen area (chosen already when there is only one).
      function showUnitsOf(area, areaSelect) {
        const wardSelect = $("manage-unit_id");
        clearManageError(areaSelect);
        clearManageError(wardSelect);
        wardSelect.disabled = !area;
        wardSelect.innerHTML = area
          ? (area.units.length > 1 ? '<option value="">Choose the ward or branch…</option>' : "") + area.units.map((unit) => `<option value="${unit.unit_id}">${esc(unit.unit)}</option>`).join("")
          : '<option value="">Choose the area first</option>';
      }
      function clearManageError(input) {
        const wrap = input?.closest?.("[data-manage-field].invalid");
        if (!wrap) return;
        wrap.classList.remove("invalid");
        wrap.querySelector(".field-error")?.remove();
      }
      function showManageErrors(errors) {
        for (const [key, text] of Object.entries(errors)) {
          const wrap = $("manageFields").querySelector(`[data-manage-field="${CSS.escape(key)}"]`),
            input = wrap?.querySelector("[name]");
          if (!input) continue;
          clearManageError(input);
          wrap.classList.add("invalid");
          const error = document.createElement("div");
          error.className = "field-error";
          error.textContent = text;
          input.after(error);
        }
        $("manageFields").querySelector(".invalid [name]")?.focus();
      }
      // What is missing in the manage pop-up: { field key: what to choose }.
      function manageErrors(action, body) {
        const errors = {};
        if (action === "transfer" && !body.area_id) errors.area_id = "Choose the new area.";
        else if (action === "transfer" && !body.unit_id) errors.unit_id = "Choose the ward or branch.";
        if ((action === "end" || action === "drop") && !body.reason) errors.reason = "Choose a reason.";
        return errors;
      }
      async function submitManageForm(event) {
        event.preventDefault();
        if (adding || !manage || $("manageSave").hidden) return;
        const { action, group, row } = manage,
          body = {};
        for (const input of $("manageFields").querySelectorAll("[name]")) body[input.name] = input.value;
        const errors = manageErrors(action, body);
        if (Object.keys(errors).length) {
          showManageErrors(errors);
          $("manageStatus").textContent = "Please choose what is marked.";
          $("manageStatus").className = "status error";
          return;
        }
        if (action === "transfer") Object.assign(body, { area_id: Number(body.area_id), unit_id: Number(body.unit_id) });
        const result = await runPersonAction(group, row, action, body, $("manageForm"), $("manageStatus"), showManageErrors);
        if (result?.error?.status === 409) showKeptInstead(result.error.message);
      }

      // =============================================================================================================
      // 14. TYPING AND CLICKING IN THE FORM
      // =============================================================================================================
      // "How will GEMIKO support them?" is shown only while "Discussed in GEMIKO?" is Yes.
      function toggleGemiko(card) {
        card?.querySelector(".gemiko-details")?.classList.toggle("hidden", personValue(card, "discussed_in_gemiko") !== true);
      }
      // A friend needs a name: a blank one is not saved, and leaving the box shows the saved name again
      // (a new friend has none yet). The tab shows the name as it is typed.
      function friendNameHint(input) {
        const card = input.closest("[data-person-group]"),
          row = data.people.high_potential.find((p) => String(p.id) === card?.dataset.id),
          tab = tabOf(card?.closest('[role="tabpanel"]'));
        if (tab) tab.querySelector(".tab-name").textContent = input.value.trim() || tabLabel("high_potential", row || {});
        let hint = input.closest("label").querySelector(".field-error.name-hint");
        if (input.value.trim() || !row || row.name === HIGH_POTENTIAL_PLACEHOLDER) return hint?.remove();
        if (hint) return;
        hint = document.createElement("span");
        hint.className = "field-error name-hint";
        hint.textContent = "A friend needs a name. The last saved name is kept until you type a new one.";
        input.after(hint);
      }
      // Leaving a friend's name box empty puts the saved name back.
      function restoreFriendName(input) {
        const id = input.closest("[data-id]")?.dataset.id,
          row = data.people.high_potential.find((p) => String(p.id) === id),
          fields = changed.people.get("high_potential:" + id);
        if (!row) return;
        input.value = row.name === HIGH_POTENTIAL_PLACEHOLDER ? "" : row.name;
        friendNameHint(input);
        // The saved name is back, so there is nothing to send for it.
        fields?.delete("name");
        if (fields && !fields.size) changed.people.delete("high_potential:" + id);
        if (!hasChanges() && !saving) {
          clearTimeout(timer);
          saveState.textContent = "All changes saved";
          showRetry(false);
        }
      }
      // A Yes / No choice is a change of the whole question (data-field is on the pill group), so the shared
      // input/change handlers below never see the radio button itself.
      function pillChosen(event, type) {
        const group = event.target.closest?.("[data-pills]");
        if (!group) return;
        event.stopPropagation();
        if (type === "input") return;
        clearPersonError(group);
        if (group.dataset.field === "discussed_in_gemiko") toggleGemiko(group.closest("[data-person-group]"));
        markDirty(group);
      }
      for (const type of ["input", "change"]) form.addEventListener(type, (event) => pillChosen(event, type), true);
      form.addEventListener("input", (event) => {
        clearPersonError(event.target);
        clearFieldError(event.target);
        if (event.target.dataset.key) updateConditionalQuestions();
        if (event.target.dataset.field === "name") friendNameHint(event.target);
        if (event.target.type === "number") numberHint(event.target);
        markDirty(event.target);
      });
      form.addEventListener("change", (event) => {
        clearPersonError(event.target);
        clearFieldError(event.target);
        if (event.target.dataset.key) updateConditionalQuestions();
        // Typed text was noted by "input" already. Its "change" when leaving the box is not a new
        // edit, and re-sending it could overwrite what the companion saved in the meantime.
        if (!event.target.matches("textarea, input[type=text], input[type=number]")) markDirty(event.target);
      });
      form.addEventListener("focusout", (event) => {
        const input = event.target;
        if (input.dataset?.field === "name" && !input.value.trim()) restoreFriendName(input);
        setTimeout(renderWhenIdle);
      });

      // =============================================================================================================
      // 15. THE BUTTONS AND POP-UP FORMS, AND THE START
      // =============================================================================================================
      unitSelect.onchange = changeUnit;
      // Save is only shown after a save failed (showRetry): it tries again. save() shows its own error.
      $("saveBtn").onclick = () => save(true).catch(() => {});
      $("submitBtn").onclick = async () => {
        // Save first even without changes here: the reply brings the companion's saved answers
        // into this page, so the check below sees the plan that will actually be submitted.
        try {
          await save(true);
        } catch {
          return; // save() shows why
        }
        const bad = badNumbers()[0];
        if (bad) return showUnsavedNumber(bad);
        const missing = requiredMissing();
        if (missing.length) return showMissingQuestions(missing);
        if (peopleIncomplete()) return;
        if (!confirm("Submit your weekly plan? Your district leader will see it before your call-in. A leader must unlock it before it can be changed again."))
          return;
        try {
          await flush();
          await portalAPI(`planning/reports/${data.report.report_id}/submit`, { method: "POST" });
          await load(data.report.unit_id);
          message.textContent = "Your plan is submitted. Your district leader will see it before your call-in. Thank you for planning together.";
        } catch (e) {
          if (e.fields?.people) return showServerIncomplete(e.fields.people, e.message);
          message.textContent = e.message;
          message.className = "status error";
          if (e.fields) await showServerFieldErrors(e.fields);
        }
      };
      $("personCancel").onclick = () => $("personDialog").close();
      $("createCancel").onclick = () => $("createDialog").close();
      $("manageCancel").onclick = () => $("manageDialog").close();
      // Esc does not close a pop-up while it is adding or changing a person (see lockDialog).
      for (const dialog of [$("manageDialog"), $("createDialog"), $("personDialog")])
        dialog.addEventListener("cancel", (event) => {
          if (adding) event.preventDefault();
        });
      $("createFields").addEventListener("input", (event) => clearCreateError(event.target));
      $("createFields").addEventListener("change", (event) => {
        clearCreateError(event.target);
      });
      $("manageFields").addEventListener("change", (event) => clearManageError(event.target));
      $("createForm").onsubmit = submitCreateForm;
      $("personForm").onsubmit = addPersonFromList;
      $("manageForm").onsubmit = submitManageForm;
      load();
    </script>
  </body>
</html>
