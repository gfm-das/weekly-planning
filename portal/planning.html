<!doctype html>
<!--
  WEEKLY PLANNING (planning.html)

  What it is:  the page where a companionship plans its week together. It has the planning questions (numbers,
               goals and plans for the key indicators, ward coordination, ...) and three lists of people the
               companionship is helping: friends with a baptismal date, New Members and high-potential friends.
               The plan is submitted by Sunday 18:00 (the push reminder comes then if it is not finished).
  Who uses it: every missionary, for their own area. A district leader reads the submitted plans in Call-ins
               (callins.html) before the call-in.
  How it fits: the portal (index.html) shows this page inside its frame. The page talks only to portal-api
               (/api/planning/..., portal-api/planning.py) through portalAPI() from portal-client.js. The questions
               themselves come from the database: the Data Analysts edit them in DA Management > Planning questions.
               i18n.js swaps every English text on the page for the reader's language (portal/i18n/*.json).

  A plain-words guide to this page, how the data flows and how to test it: README-planning-callins.md.
-->
<html lang="en" data-theme="mission">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Weekly Planning</title>
    <link rel="stylesheet" href="workspace.css" />
    <script src="site-config.js"></script><script src="i18n.js?v=6"></script>
    <style>
      /* ---------------------------------------------------------------------------------------------------------
         The page and the week card at the top
         --------------------------------------------------------------------------------------------------------- */
      body {
        padding-bottom: calc(95px + env(safe-area-inset-bottom));
      }
      .planning-shell {
        max-width: 1080px;
      }
      .week-card {
        background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
        color: #fff;
        border: 0;
        box-shadow: 0 18px 42px #12384720;
      }
      .week-card label,
      .week-card .muted {
        color: #d8eef0;
      }
      .week-card .purpose {
        margin: 0 0 4px;
        max-width: 60ch;
      }
      .week-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }
      .week-card h1 {
        font-size: 30px;
        margin: 8px 0;
      }
      /* The one ward or branch of an area, as text in place of the list */
      .week-card .unit-name {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }
      .pill {
        display: inline-flex;
        padding: 6px 10px;
        border-radius: 999px;
        background: #ffffff1f;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .progress-track {
        height: 6px;
        background: #ffffff25;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 15px;
      }
      .progress-track span {
        display: block;
        height: 100%;
        background: #91ddd5;
        transition: width 0.25s;
      }
      /* ---------------------------------------------------------------------------------------------------------
         Section colours. Each section of the plan gets one, in page order (eight colours, then they start again;
         buildSectionNav sets data-accent). The same colour marks the section's top edge and its button in the
         bar, so one look at the bar shows where you are. White text stays easy to read on every light-theme
         colour, dark text on every dark-theme colour.
         --------------------------------------------------------------------------------------------------------- */
      :root {
        --accent-0: #0b7a8a; /* teal */
        --accent-1: #2f64b0; /* blue */
        --accent-2: #7048b0; /* purple */
        --accent-3: #a8386a; /* berry */
        --accent-4: #a3540f; /* orange */
        --accent-5: #3b7a34; /* green */
        --accent-6: #806a12; /* gold */
        --accent-7: #55697a; /* slate */
        --accent-ink: #fff; /* text on a button filled with its colour */
        --bar-shadow: #0f2c3a40;
      }
      [data-theme="dark"] {
        --accent-0: #5ccbd3;
        --accent-1: #8db4f0;
        --accent-2: #bca0f0;
        --accent-3: #f29ac0;
        --accent-4: #f2b074;
        --accent-5: #9fd494;
        --accent-6: #d9c56a;
        --accent-7: #b3c3cf;
        --accent-ink: #0d1a20;
        --bar-shadow: #000000a0;
      }
      [data-accent="0"] { --accent: var(--accent-0); }
      [data-accent="1"] { --accent: var(--accent-1); }
      [data-accent="2"] { --accent: var(--accent-2); }
      [data-accent="3"] { --accent: var(--accent-3); }
      [data-accent="4"] { --accent: var(--accent-4); }
      [data-accent="5"] { --accent: var(--accent-5); }
      [data-accent="6"] { --accent: var(--accent-6); }
      [data-accent="7"] { --accent: var(--accent-7); }
      /* ---------------------------------------------------------------------------------------------------------
         The section bar: one button per section, pinned to the top while the page scrolls
         --------------------------------------------------------------------------------------------------------- */
      /* The page keeps room for the pinned bar at the top and the save bar at the bottom (their heights
         come from measureBars), so a section or a box that gets the focus never hides under them. */
      html {
        scroll-padding-top: calc(var(--section-nav-height, 0px) + 8px);
        scroll-padding-bottom: calc(var(--actions-height, 0px) + 8px);
      }
      /* It stays pinned to the top on computers and on phones, with the page colour behind it so nothing
         shows through. */
      .section-nav {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 1px 12px;
        background: var(--page);
        transition: box-shadow 0.2s;
      }
      /* Pinned (watchPageEdges sets "stuck"): a soft shadow shows the bar floats above the page. */
      .section-nav.stuck {
        box-shadow: 0 12px 12px -12px var(--bar-shadow);
      }
      #sectionNavMarker {
        height: 1px;
        margin-bottom: -1px;
      }
      .section-nav button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        padding: 8px 12px;
      }
      /* A dot in the section's colour, and a tick once the section's required questions are answered. */
      .section-nav button::before {
        content: "";
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent, var(--teal));
      }
      .section-nav button.complete::before {
        content: "✓";
        content: "✓" / ""; /* only a picture: screen readers skip it */
        width: 16px;
        height: 16px;
        font-size: 11px;
        line-height: 16px;
        text-align: center;
        color: var(--accent-ink);
      }
      .section-nav button:hover {
        border-color: var(--accent, var(--teal));
      }
      .section-nav button:focus-visible {
        outline: 2px solid var(--accent, var(--teal));
        outline-offset: 2px;
      }
      /* The section being read or edited (highlightSection sets aria-current): filled with its colour. */
      .section-nav button[aria-current] {
        background: var(--accent, var(--teal));
        border-color: var(--accent, var(--teal));
        color: var(--accent-ink);
      }
      .section-nav button[aria-current]::before {
        background: var(--accent-ink);
      }
      .section-nav button[aria-current].complete::before {
        color: var(--accent, var(--teal));
      }
      /* ---------------------------------------------------------------------------------------------------------
         Question sections and their questions (the questions come from DA Management > Planning questions)
         --------------------------------------------------------------------------------------------------------- */
      .section {
        scroll-margin-top: 12px;
        border-top: 4px solid var(--accent, var(--line));
      }
      /* A jump from the bar puts the keyboard on the section's heading (jumpToSection). */
      .section h2:focus {
        outline: none;
      }
      .section h2:focus-visible {
        outline: 2px solid var(--accent, var(--teal));
        outline-offset: 4px;
        border-radius: 4px;
      }
      .section-head {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 18px;
      }
      .section-head p {
        margin: 5px 0 0;
      }
      .section-count {
        color: var(--accent, var(--teal));
        font-size: 11px;
        font-weight: 800;
      }
      .question-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 18px;
      }
      .question.long,
      .question.grid-question {
        grid-column: 1/-1;
      }
      .question label {
        font-size: 13px;
        color: var(--text);
        margin-bottom: 7px;
      }
      .question input:not([type="checkbox"]),
      .question textarea {
        width: 100%;
      }
      .question textarea {
        min-height: 100px;
      }
      .question .help {
        font-size: 11px;
        color: var(--muted);
        margin-top: 5px;
      }
      .required-mark {
        color: #b74c42;
      }
      .question .q-title {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 7px;
      }
      /* "Last week: ..." under a question */
      .question .previous {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        overflow-wrap: anywhere;
      }
      .question select {
        width: 100%;
      }
      /* Choices shown as pills (Yes / No, one of a list, several of a list) and the grid of choices */
      .choice-pills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .choice-pills label,
      .answer-grid label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        min-width: 44px;
        padding: 0 16px;
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--soft);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .question .choice-pills input,
      .question .answer-grid input {
        width: 18px;
        height: 18px;
        flex: none;
        margin: 0;
        accent-color: var(--teal);
      }
      .choice-pills label:has(input:checked),
      .answer-grid label:has(input:checked) {
        border-color: var(--teal);
        box-shadow: inset 0 0 0 1px var(--teal);
      }
      .choice-pills label:has(input:focus-visible),
      .answer-grid label:has(input:focus-visible) {
        outline: 2px solid #97d5d0;
        outline-offset: 1px;
      }
      .answer-grid {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .answer-grid th,
      .answer-grid td {
        padding: 6px;
        border-bottom: 1px solid var(--line);
        text-align: center;
      }
      .answer-grid th[scope="row"] {
        text-align: left;
        font-weight: 600;
      }
      .answer-grid thead th {
        font-size: 12px;
        color: var(--muted);
      }
      .answer-grid label {
        justify-content: center;
        padding: 0 12px;
      }
      .answer-grid .grid-choice {
        display: none;
      }
      .question.invalid .choice-pills label,
      .question.invalid .answer-grid tr.unanswered th {
        border-color: #c4453b;
        color: #9f352d;
      }
      [data-theme="dark"] .question.invalid .answer-grid tr.unanswered th {
        color: #ff8f85;
      }
      .toggle-label {
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--soft);
        padding: 11px;
        border-radius: 9px;
        font-size: 12px;
        margin: 0;
      }
      .toggle-label input {
        width: 18px;
        height: 18px;
        accent-color: var(--teal);
      }
      /* ---------------------------------------------------------------------------------------------------------
         People sections: one tab per person (New Members, friends with a baptismal date, high-potential friends)
         --------------------------------------------------------------------------------------------------------- */
      .person-tabs {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        margin-top: 16px;
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        scrollbar-width: thin;
      }
      .person-tablist {
        display: flex;
        gap: 4px;
      }
      .person-tab {
        background: transparent;
        color: var(--muted);
        border: 1px solid transparent;
        border-bottom: 0;
        border-radius: 10px 10px 0 0;
        padding: 9px 14px;
        white-space: nowrap;
        margin-bottom: -1px;
      }
      .person-tab:hover {
        color: var(--text);
        background: var(--soft);
      }
      .person-tab[aria-selected="true"] {
        background: var(--soft);
        color: var(--text);
        border-color: var(--line);
        box-shadow: inset 0 3px 0 var(--teal);
      }
      .person-tab:focus-visible {
        outline: 2px solid #97d5d0;
        outline-offset: -2px;
      }
      .person-tab.add-tab {
        color: var(--teal);
        margin-left: auto;
      }
      [data-theme="dark"] .person-tab.add-tab {
        color: #7fd3cb;
      }
      .person-panels .person-card {
        border-top: 0;
        border-radius: 0 0 13px 13px;
      }
      .person-panels .empty {
        margin-top: 12px;
      }
      /* The pop-ups share their colours */
      #createDialog,
      #personDialog {
        background: var(--panel);
        color: var(--text);
      }
      #createDialog label,
      #personDialog label {
        color: var(--text);
      }
      #createDialog form {
        display: flex;
        flex-direction: column;
        max-height: calc(92dvh - 54px);
      }
      #createDialog h2 {
        margin-bottom: 6px;
      }
      .create-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 14px;
        overflow-y: auto;
        padding: 2px;
      }
      .create-grid .question input,
      .create-grid .question select,
      .create-grid .question textarea {
        width: 100%;
      }
      .create-grid .question.long {
        grid-column: 1/-1;
      }
      .create-grid .question textarea {
        min-height: 90px;
      }
      .create-grid input:disabled {
        background: var(--soft);
        color: var(--muted);
      }
      [data-theme="dark"] .person-card label {
        color: var(--muted);
      }
      [data-theme="dark"] button.secondary {
        background: var(--soft);
        color: var(--text);
      }
      /* "How will GEMIKO support them?" shows only after "Discussed in GEMIKO?" is Yes; a question hidden by its
         show/hide rules is not shown either. */
      .gemiko-details {
        grid-column: 1/-1;
        border-left: 3px solid var(--teal);
        padding: 13px;
        background: var(--panel);
        border-radius: 10px;
      }
      .gemiko-details.hidden,
      .question.conditional-hidden {
        display: none;
      }
      .person-card {
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 16px;
        background: var(--soft);
      }
      .person-card h3 {
        font-size: 15px;
        margin: 0 0 13px;
      }
      .person-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .person-grid .wide {
        grid-column: 1/-1;
      }
      .person-grid input:not([type="checkbox"]),
      .person-grid select,
      .person-grid textarea {
        width: 100%;
      }
      .person-grid textarea {
        min-height: 80px;
      }
      .remove-person {
        background: transparent;
        color: #a23a34;
        padding: 7px 0;
        margin-top: 9px;
      }
      [data-theme="dark"] .remove-person {
        color: #ff9b91;
      }
      /* Person cards: details, actions, Yes / No pills, required marks and unanswered counts */
      .person-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 10px 16px;
        margin-bottom: 12px;
      }
      .person-head h3 {
        margin: 0 0 4px;
      }
      .person-details,
      .person-note {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--muted);
      }
      .person-note {
        color: #9d4921;
        font-weight: 600;
      }
      .person-help {
        margin: -4px 0 10px;
      }
      [data-theme="dark"] .person-note {
        color: #ffb38a;
      }
      .person-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .person-actions button {
        padding: 9px 12px;
        min-height: 40px;
      }
      .person-actions button.secondary {
        border: 1px solid var(--line);
      }
      .person-actions button.danger,
      #manageSave.danger {
        background: #fff0ed;
        color: #a33329;
        border: 1px solid #f0c8c2;
      }
      [data-theme="dark"] .person-actions button.danger,
      [data-theme="dark"] #manageSave.danger {
        background: #3a2224;
        color: #ff9b91;
        border-color: #6b3a38;
      }
      .person-subhead {
        margin: 18px 0 10px;
        font-size: 11px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--teal);
      }
      [data-theme="dark"] .person-subhead {
        color: #7fd3cb;
      }
      .pill-question {
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      .pill-question legend {
        padding: 0;
        margin-bottom: 7px;
        font-size: 12px;
        font-weight: 600;
        color: #496673;
      }
      [data-theme="dark"] .pill-question legend {
        color: var(--muted);
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pill-option {
        position: relative;
        display: inline-flex;
        margin: 0;
      }
      .pill-option input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        margin: 0;
      }
      .pill-option span {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        min-width: 64px;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .pill-option input:checked + span {
        background: var(--teal);
        border-color: var(--teal);
        color: #fff;
      }
      .pill-option input:focus-visible + span {
        outline: 2px solid #97d5d0;
        outline-offset: 2px;
      }
      .pill-option input:disabled + span {
        cursor: default;
        opacity: 0.65;
      }
      .person-field.invalid input,
      .person-field.invalid select,
      .person-field.invalid textarea,
      .pill-question.invalid .pill-option span {
        border-color: #c4453b;
        box-shadow: 0 0 0 1px #c4453b;
      }
      [data-theme="dark"] .person-field.invalid input,
      [data-theme="dark"] .person-field.invalid select,
      [data-theme="dark"] .person-field.invalid textarea,
      [data-theme="dark"] .pill-question.invalid .pill-option span {
        border-color: #ff8f85;
        box-shadow: 0 0 0 1px #ff8f85;
      }
      /* The number of unanswered questions on a person's tab (after a submit attempt) */
      .tab-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 19px;
        height: 19px;
        margin-left: 7px;
        padding: 0 5px;
        border-radius: 999px;
        background: #c4453b;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      /* ---------------------------------------------------------------------------------------------------------
         Pop-ups: create / edit / Baptized, and Transfer / End follow-up / No longer on date / Delete
         --------------------------------------------------------------------------------------------------------- */
      .readonly-value {
        padding: 11px 0;
        font-weight: 600;
      }
      #manageDialog {
        background: var(--panel);
        color: var(--text);
        width: min(560px, 95vw);
      }
      #manageDialog label {
        color: var(--text);
      }
      .manage-fields {
        display: grid;
        gap: 14px;
      }
      .manage-fields select {
        width: 100%;
      }
      .dialog-actions button[hidden] {
        display: none;
      }
      /* ---------------------------------------------------------------------------------------------------------
         A submitted plan's note, the save bar at the bottom, wrong answers and the loading placeholder
         --------------------------------------------------------------------------------------------------------- */
      .locked {
        background: var(--soft);
        border-radius: 12px;
        padding: 14px;
        color: var(--muted);
        margin-bottom: 15px;
      }
      .sticky-actions {
        position: fixed;
        z-index: 25;
        left: max(12px, calc((100vw - 1080px) / 2));
        right: max(12px, calc((100vw - 1080px) / 2));
        bottom: max(10px, env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 11px 14px;
        box-shadow: 0 12px 40px #102d3b35;
      }
      /* The bar and its buttons have their own display, so hidden ones (the bar on a submitted plan, Save before a
         save failed) need saying */
      .sticky-actions[hidden],
      .sticky-actions button[hidden] {
        display: none;
      }
      .save-state {
        font-size: 11px;
        color: var(--muted);
      }
      .question.invalid input:not([type="checkbox"]),
      .question.invalid select,
      .question.invalid textarea {
        border-color: #c4453b;
        box-shadow: 0 0 0 1px #c4453b;
        border-radius: 8px;
      }
      [data-theme="dark"] .question.invalid input:not([type="checkbox"]),
      [data-theme="dark"] .question.invalid select,
      [data-theme="dark"] .question.invalid textarea {
        border-color: #ff8f85;
        box-shadow: 0 0 0 1px #ff8f85;
      }
      .skeleton {
        height: 160px;
        background: var(--soft);
        border-radius: 15px;
        animation: pulse 1.2s infinite alternate;
      }
      @keyframes pulse {
        to {
          opacity: 0.5;
        }
      }
      /* ---------------------------------------------------------------------------------------------------------
         Phones (720 px wide or less): one column, the bars adapted, 16 px text in the boxes (no zoom on focus),
         44 px touch targets and pop-ups that fill the screen
         --------------------------------------------------------------------------------------------------------- */
      @media (max-width: 720px) {
        body {
          padding: 10px 10px calc(145px + env(safe-area-inset-bottom));
        }
        .panel {
          padding: 16px;
        }
        .week-card {
          border-radius: 16px;
        }
        .week-row {
          align-items: stretch;
          flex-direction: column;
        }
        .week-card h1 {
          font-size: 25px;
        }
        .question-grid,
        .person-grid,
        .create-grid {
          grid-template-columns: 1fr;
        }
        .create-grid .question.long {
          grid-column: auto;
        }
        .question.long,
        .question.grid-question,
        .person-grid .wide {
          grid-column: auto;
        }
        .section-head {
          gap: 8px;
        }
        .section-count {
          display: none;
        }
        .sticky-actions {
          left: 8px;
          right: 8px;
          bottom: max(6px, env(safe-area-inset-bottom));
          align-items: stretch;
          flex-direction: column;
          padding: 10px;
        }
        .sticky-actions > div:first-child {
          display: flex;
          justify-content: space-between;
          gap: 8px;
        }
        /* Submit fills the row; after a failed save, Save (try again) sits next to it */
        .sticky-actions .actions {
          flex-wrap: nowrap;
        }
        .sticky-actions button {
          flex: 1 1 0;
          min-height: 45px;
        }
        .sticky-actions #submitBtn {
          flex-grow: 1.3;
        }
        /* A grid becomes one card per row, with its choices as pills. */
        .answer-grid,
        .answer-grid tbody,
        .answer-grid tr,
        .answer-grid th,
        .answer-grid td {
          display: block;
        }
        .answer-grid thead {
          display: none;
        }
        .answer-grid tr {
          border: 1px solid var(--line);
          border-radius: 12px;
          padding: 10px 10px 4px;
          margin-bottom: 10px;
          background: var(--panel);
        }
        .answer-grid th,
        .answer-grid td {
          border: 0;
          padding: 0;
        }
        .answer-grid th[scope="row"] {
          margin-bottom: 8px;
          font-size: 14px;
        }
        .answer-grid td {
          display: inline-block;
          margin: 0 6px 6px 0;
        }
        .answer-grid .grid-choice {
          display: inline;
        }
        /* On a phone the bar is one row that scrolls sideways (highlightSection slides the filled
           button into view). It is pinned like on a computer, see .section-nav above. */
        .section-nav {
          flex-wrap: nowrap;
          overflow-x: auto;
          scrollbar-width: none;
          padding-top: 7px;
        }
        .person-card {
          padding: 13px;
        }
        .person-card input,
        .person-card select,
        .person-card textarea,
        dialog input,
        dialog select,
        dialog textarea {
          font-size: 16px;
        }
        .pill-option span,
        .person-actions button,
        .person-tab,
        .add-existing,
        .remove-person,
        .section-nav button,
        .dialog-actions button {
          min-height: 44px;
        }
        #createDialog,
        #manageDialog,
        #personDialog {
          width: 100vw;
          max-width: 100vw;
          height: 100dvh;
          max-height: 100dvh;
          margin: 0;
          border-radius: 0;
          padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        }
        #createDialog form {
          max-height: none;
          height: 100%;
        }
        .dialog-actions {
          flex-wrap: wrap;
        }
        .dialog-actions button {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="planning-shell">
      <!-- The week card: which week, how far the plan is, and the ward or branch it is for -->
      <section class="panel week-card">
        <div class="week-row">
          <div>
            <span class="pill">SHARED COMPANIONSHIP PLAN</span>
            <h1>Weekly Planning</h1>
            <p class="muted purpose">Plan together for the people you are helping, then submit by Sunday at 18:00.</p>
            <p class="muted" id="weekText">Loading this week…</p>
            <div class="progress-track"><span id="progressBar"></span></div>
          </div>
          <!-- A list to choose from when the area has more than one ward or branch, otherwise just its name -->
          <div>
            <label for="unitSelect">Ward or branch</label
            ><select id="unitSelect"></select
            ><p class="unit-name" id="unitName" data-i18n-ignore hidden></p>
          </div>
        </div>
      </section>
      <div id="message" class="status" role="status"></div>
      <!-- The section bar (one button per section) and the form itself, both drawn by the script -->
      <div id="sectionNavMarker" aria-hidden="true"></div>
      <nav
        id="sectionNav"
        class="section-nav"
        aria-label="Planning sections"
      ></nav>
      <div id="form"><div class="skeleton"></div></div>
      <div id="planEnd" aria-hidden="true"></div>
      <!-- The save bar at the bottom (only while the plan can be changed). Saving is automatic; the Save button is
           only there after a save failed, to try again (showRetry). -->
      <div class="sticky-actions" id="actions" hidden>
        <div>
          <span class="save-state" id="saveState">Ready</span>
        </div>
        <div class="actions">
          <button class="secondary" id="saveBtn" hidden>Save</button
          ><button id="submitBtn">Submit weekly plan</button>
        </div>
      </div>
      <!-- Pop-up: "+ Add from list" (a person already listed for the area) -->
      <dialog id="personDialog">
        <form id="personForm">
          <h2 id="personTitle">Add from your list</h2>
          <p class="muted" id="personHint"></p>
          <label>Person<select id="personSelect" required></select></label>
          <div id="personStatus" class="status"></div>
          <div class="dialog-actions">
            <button type="button" class="secondary" id="personCancel">
              Cancel</button
            ><button id="personSave">Add to this week</button>
          </div>
        </form>
      </dialog>
      <!-- Pop-up: create a person, "Edit details" and "Baptized" -->
      <dialog id="createDialog" aria-labelledby="createTitle">
        <form id="createForm" novalidate>
          <h2 id="createTitle">Create New Member</h2>
          <p class="muted" id="createHint"></p>
          <div class="create-grid" id="createFields"></div>
          <div id="createStatus" class="status" role="alert"></div>
          <div class="dialog-actions">
            <button type="button" class="secondary" id="createCancel">
              Cancel</button
            ><button id="createSave">Create and add</button>
          </div>
        </form>
      </dialog>
      <!-- Pop-up: Transfer, End follow-up, No longer on date and Delete -->
      <dialog id="manageDialog" aria-labelledby="manageTitle">
        <form id="manageForm" novalidate>
          <h2 id="manageTitle">Manage</h2>
          <p class="muted" id="manageHint"></p>
          <div class="manage-fields" id="manageFields"></div>
          <div id="manageStatus" class="status" role="alert"></div>
          <div class="dialog-actions">
            <button type="button" class="secondary" id="manageCancel">
              Cancel</button
            ><button type="button" class="secondary" id="manageAlt" hidden></button
            ><button id="manageSave">Save</button>
          </div>
        </form>
      </dialog>
    </main>
    <script src="portal-client.js"></script>
    <script>
      /* =============================================================================================================
         HOW THIS SCRIPT WORKS (read this first)

         1. load() asks portal-api for this week's plan. The answer, "data", holds the questions, the saved answers,
            the people on the plan and whether this person may change the plan (data.can_edit).
         2. render() draws the whole form from "data": first the question sections, then the three people sections.
         3. When someone types or clicks, markDirty() writes down WHAT changed (in "changed") and scheduleSave()
            saves a moment later. save() sends only what changed, so two companions working on the same plan at the
            same time never overwrite each other. The server answers with the whole saved plan; mergeAnswers() and
            mergePeople() then show the companion's newest answers, without touching the box someone is typing in.
            There is no Save button to press: it only shows up after a save failed, to try again (showRetry).
         4. Submit checks that everything needed is answered (the server checks again), then submits the plan.
         5. The pop-ups add, change, move or remove people. The server does the work and sends the new plan back.

         The script is split into 15 numbered parts; each starts with a title line in capitals. The page never decides
         by itself who may do what: portal-api and the database check every request. Every text people see is
         written here in English and i18n.js swaps it for the reader's language (portal/i18n/*.json), so a text may
         only change together with the catalogs (all 14 languages).
         ============================================================================================================= */

      // =============================================================================================================
      // 1. THE PAGE'S PARTS AND WHAT THE SCRIPT REMEMBERS
      // =============================================================================================================
      const $ = (id) => document.getElementById(id),
        form = $("form"),
        message = $("message"),
        unitSelect = $("unitSelect"),
        saveState = $("saveState");
      const esc = window.escapeHTML; // makes a text safe to put inside HTML (portal-client.js)
      let data = null, // this week's plan, as the server sent it last (load, save)
        timer = null, // the automatic save that is waiting to start (scheduleSave)
        saving = null, // the save on its way, while there is one (a Promise)
        adding = false, // true while a pop-up adds or changes a person: nothing else may start meanwhile
        needsRender = false; // the form should be drawn again as soon as nobody is using it (renderWhenIdle)
      // What this page changed since its last save. Only these are sent, so two companions
      // editing the same plan never overwrite or delete each other's answers and people.
      //   answers:  the keys of the changed questions
      //   people:   "group:rowId" -> the names of the changed fields on that person's card
      //   removals: the row ids of the high-potential friends to take off the plan
      const changed = { answers: new Set(), people: new Map(), removals: new Set() };
      const hasChanges = () => !!(changed.answers.size || changed.people.size || changed.removals.size);

      // =============================================================================================================
      // 2. SHOW/HIDE RULES: some questions are only asked after a certain answer to another question
      // =============================================================================================================
      // Show/hide rules come with each question (DA Management → Planning questions) and work exactly
      // like the server (planning._visibility): a question is hidden when one of its rules
      // fails or a question it depends on is hidden. A hidden question is not required. A hidden
      // follow-up with a "value when hidden" counts as that value (e.g. 0, "none") while the questions
      // it depends on are answered, and as "" (no answer) when one of them is blank; see
      // changedAnswers for when it is saved. Hidden questions without one keep their answer.
      // portal/tests/planning-rules-check.cjs runs this whole part on the server's own test cases.

      // True when there is no answer: nothing, "", an empty list or an empty grid.
      const blank = (value) =>
        value == null ||
        value === "" ||
        (Array.isArray(value) && !value.length) ||
        (typeof value === "object" && !Array.isArray(value) && !Object.keys(value).length);
      // An answer as a rule compares it: "true" / "false" for Yes / No, "" for no answer.
      const ruleText = (value) => (value === true ? "true" : value === false ? "false" : String(value ?? ""));
      // The number comparisons a rule can make.
      const NUMBER_RULES = {
        greater_than: (a, b) => a > b,
        greater_than_or_equal: (a, b) => a >= b,
        less_than: (a, b) => a < b,
        less_than_or_equal: (a, b) => a <= b,
      };
      // Does this answer pass this one rule? (the server's planning._rule_passes)
      function rulePasses(rule, value) {
        const operator = String(rule.operator || "").trim(),
          expected = rule.value;
        if (operator === "equals") {
          const wanted = String(expected).toLowerCase();
          if (wanted === "true" || wanted === "false") return ruleText(value).toLowerCase() === wanted;
          return ruleText(value) === String(expected);
        }
        if (operator === "not_equals") return ruleText(value) !== String(expected);
        if (!NUMBER_RULES[operator]) return true; // an unknown rule shows the question, as on the server
        const actual = Number(value),
          limit = Number(expected);
        if (blank(value) || typeof value === "boolean" || Number.isNaN(actual) || Number.isNaN(limit)) return false;
        return NUMBER_RULES[operator](actual, limit);
      }
      // Every question of the plan, by its key.
      const questionMap = () => new Map(data.questions.map((q) => [q.question_key, q]));
      // A question's rules, without rules on a question that is no longer on the form (they are ignored).
      const rulesOf = (q, byKey) => (q.rules || []).filter((rule) => byKey.has(rule.parent));
      // Question keys with every rule's parent before its child.
      function ruleOrder(byKey) {
        const order = [],
          seen = new Set();
        const visit = (key, path) => {
          if (seen.has(key) || path.has(key)) return;
          for (const rule of rulesOf(byKey.get(key), byKey)) visit(rule.parent, new Set([...path, key]));
          seen.add(key);
          order.push(key);
        };
        for (const key of byKey.keys()) visit(key, new Set());
        return order;
      }
      // What a hidden follow-up counts as: its value when hidden, typed like the question's answers.
      function hiddenAnswer(q) {
        const value = q.value_when_hidden;
        if (q.question_type === "NUMBER") return Number(value);
        if (q.question_type === "BOOLEAN") return String(value).toLowerCase() === "true";
        return value;
      }
      // A "follow-up": a question with rules and a value to count as while they hide it.
      const hasHiddenAnswer = (q) =>
        q.value_when_hidden != null && q.value_when_hidden !== "" && (q.rules || []).length > 0;
      // The keys of the questions the rules hide for these answers. Hidden follow-ups get their value in
      // "values" (changed in place).
      function applyConditions(values) {
        const byKey = questionMap(),
          hidden = new Set();
        for (const key of ruleOrder(byKey)) {
          const q = byKey.get(key),
            failing = rulesOf(q, byKey).filter((rule) => hidden.has(rule.parent) || !rulePasses(rule, values[rule.parent]));
          if (!failing.length) continue;
          hidden.add(key);
          if (hasHiddenAnswer(q) && key in values)
            values[key] = failing.some((rule) => !blank(values[rule.parent])) ? hiddenAnswer(q) : "";
        }
        return hidden;
      }

      // =============================================================================================================
      // 3. READING AND WRITING THE ANSWERS SHOWN ON THE PAGE
      // =============================================================================================================
      // The box around one question (it has data-question and data-type).
      const questionWrap = (key) => form.querySelector(`[data-question="${CSS.escape(key)}"]`);
      // The input of a question that has one (a number, a text, a date or a list).
      const answerInput = (key) => form.querySelector(`[data-key="${CSS.escape(key)}"]`);
      // The value of one input, or of a Yes / No pill group on a person card.
      function inputValue(input) {
        if (input.dataset.pills) return pillValue(input);
        if (input.type === "checkbox") return input.checked;
        if (input.type === "number") return input.value === "" ? "" : Number(input.value);
        return input.value;
      }
      // The chosen pill of a person question: true / false (Yes / No), "yes" / "no" / "not_applicable", or null.
      function pillValue(group) {
        const checked = group.querySelector("input:checked");
        if (!checked) return null;
        return group.dataset.pills === "yesno" ? checked.value === "true" : checked.value;
      }
      function setPill(group, value) {
        for (const input of group.querySelectorAll("input")) input.checked = input.value === String(value ?? "");
      }
      // The value of one field on a person card (null when the card has no such field).
      const personValue = (card, key) => {
        const input = card?.querySelector(`[data-field="${key}"]`);
        return input ? inputValue(input) : null;
      };
      // The answer shown in a question, in the shape the server stores it.
      function questionValue(wrap) {
        const kind = wrap.dataset.type;
        if (kind === "GRID") {
          const out = {};
          for (const input of wrap.querySelectorAll("input[data-row]:checked")) out[input.dataset.row] = input.value;
          return out;
        }
        if (kind === "CHECKBOX") return [...wrap.querySelectorAll("input[data-key]:checked")].map((input) => input.value);
        if (kind === "BOOLEAN" || kind === "RADIO") {
          const chosen = wrap.querySelector("input[data-key]:checked");
          return !chosen ? "" : kind === "BOOLEAN" ? chosen.value === "true" : chosen.value;
        }
        const input = wrap.querySelector("[data-key]");
        return input ? inputValue(input) : "";
      }
      // Shows an answer in a question.
      function setAnswer(wrap, value) {
        const kind = wrap.dataset.type;
        if (kind === "GRID") {
          for (const input of wrap.querySelectorAll("input[data-row]"))
            input.checked = !!value && typeof value === "object" && value[input.dataset.row] === input.value;
        } else if (kind === "CHECKBOX") {
          for (const input of wrap.querySelectorAll("input[data-key]"))
            input.checked = Array.isArray(value) && value.includes(input.value);
        } else if (kind === "BOOLEAN" || kind === "RADIO") {
          const shown = kind === "BOOLEAN" ? String(value === true) : String(value);
          for (const input of wrap.querySelectorAll("input[data-key]"))
            input.checked = value != null && value !== "" && input.value === shown;
        } else {
          const input = wrap.querySelector("[data-key]");
          if (input) input.value = value ?? "";
        }
      }
      // Every answer shown on the page, by question key.
      function formAnswerValues() {
        const result = {};
        for (const wrap of form.querySelectorAll("[data-question]")) result[wrap.dataset.question] = questionValue(wrap);
        return result;
      }
      // A grid sends only the rows that differ from the last saved answer this page knows (the server
      // merges them), so a companion's rows are never overwritten by this page's older copy.
      function gridChanges(key, value) {
        const saved = data.answers[key] && typeof data.answers[key] === "object" ? data.answers[key] : {},
          out = {};
        for (const [row, choice] of Object.entries(value || {})) if (saved[row] !== choice) out[row] = choice;
        return out;
      }
      // After a save a grid is merged row by row, so each row shows what is saved (a companion may have
      // answered it) unless it was changed here and not saved yet: changed after this save was sent (it
      // differs from what was sent), or changed since the answers came back last time and not part of
      // this save (it differs from before). The rows shown then match data.answers except this page's own
      // unsaved changes, which are all that gridChanges sends.
      function mergeGrid(wrap, before, fresh, sentRows) {
        const inputs = [...wrap.querySelectorAll("input[data-row]")],
          object = (value) => (value && typeof value === "object" && !Array.isArray(value) ? value : {}),
          old = object(before),
          saved = object(fresh),
          shown = {};
        for (const input of inputs) if (input.checked) shown[input.dataset.row] = input.value;
        const unsaved = (row) =>
          sentRows && row in sentRows
            ? (shown[row] ?? null) !== (sentRows[row] ?? null)
            : (shown[row] ?? null) !== (old[row] ?? null);
        for (const input of inputs) if (!unsaved(input.dataset.row)) input.checked = saved[input.dataset.row] === input.value;
      }
      // A number box holding something the browser cannot read as a number, or a number below its
      // min or above its max, or (in a question for whole numbers) a decimal, is not saved (the server
      // would refuse the whole save). The box says so (numberHint), keeps what was typed, and is saved
      // once it is fixed.
      const badNumber = (input) =>
        input?.type === "number" &&
        (input.validity.badInput ||
          input.validity.rangeUnderflow ||
          input.validity.rangeOverflow ||
          (!!input.dataset.key && input.validity.stepMismatch));
      // Every number box on the page (not a hidden question's) that cannot be saved right now.
      const badNumbers = () =>
        [...form.querySelectorAll('input[type="number"]')].filter((input) => badNumber(input) && !input.closest(".conditional-hidden"));
      // The line under a number box that says what to type instead (removed once the number is fine).
      function numberHint(input) {
        if (!input) return;
        let hint = input.parentElement.querySelector(".number-error");
        if (!badNumber(input)) return hint?.remove();
        if (!hint) {
          hint = document.createElement("span");
          hint.className = "field-error number-error";
          input.after(hint);
        }
        const low = input.min || 0,
          onlyNotWhole =
            !input.validity.badInput && input.validity.stepMismatch && !input.validity.rangeUnderflow && !input.validity.rangeOverflow,
          wanted = onlyNotWhole
            ? "Enter a whole number."
            : input.max
              ? `Enter a number from ${low} to ${input.max}.`
              : `Enter ${low} or a higher number.`;
        hint.textContent = wanted + " Until then this box is not saved.";
      }

      // =============================================================================================================
      // 4. PEOPLE: THE QUESTIONS AND CHOICES THE SERVER KNOWS TOO
      // =============================================================================================================
      // These lists are copies of the ones in portal-api planning.py, kept in step word for word
      // (portal-api/tests/test_planning_people.py compares them).
      // Highest value of the person-card numbers (the server refuses more; see planning.PEOPLE_NUMBERS).
      const NUMBER_MAX = { lessons_actual: 1000, lessons_goal: 1000, pmg_lessons_percentage: 100 };
      // Next ordinance: the code is saved, the name is shown.
      const NEXT_ORDINANCES = [
        ["SA", "Sacrament"],
        ["AP", "Aaronic Priesthood"],
        ["TB", "Temple baptisms"],
        ["MP", "Melchizedek Priesthood"],
        ["PB", "Patriarchal blessing"],
        ["TE", "Temple endowment"]
      ];
      const PEOPLE_LABELS = {
        "lessons_actual": "Lessons taught",
        "lessons_goal": "Goal next week",
        "pmg_lessons_percentage": "Preach My Gospel lessons taught (%)",
        "how_are_they_doing": "How are they doing?",
        "at_church_this_sunday": "At church on Sunday?",
        "reading": "Reading?",
        "praying": "Praying?",
        "member_involvement": "Member involvement?",
        "discussed_in_gemiko": "Discussed in GEMIKO?",
        "gemiko_support_plan": "How will GEMIKO support them?",
        "next_ordinance": "Next ordinance",
        "has_calling": "Do they have a calling?",
        "has_aaronic_priesthood": "Do they hold the Aaronic Priesthood?",
        "has_melchizedek_priesthood": "Do they hold the Melchizedek Priesthood?",
        "ministers_to_someone": "Do they have a ministering assignment?",
        "ministered_to_by_someone": "Do they have ministering brothers or sisters?",
        "has_active_temple_recommend": "Do they have an active temple recommend?",
        "visited_temple_for_baptisms": "Have they been to the temple for baptisms?",
        "baptismal_date_set_on": "Date first set",
        "current_baptismal_date": "Current baptismal date",
        "keeping_commandments": "Keeping commandments?",
        "name": "Name",
        "notes": "Notes"
      };
      // Required at submit ("How will GEMIKO support them?" only when "Discussed in GEMIKO?" is Yes).
      const PEOPLE_REQUIRED = {
        "new_members": [
          "lessons_actual", "lessons_goal", "pmg_lessons_percentage", "how_are_they_doing", "at_church_this_sunday",
          "reading", "praying", "member_involvement", "discussed_in_gemiko", "next_ordinance", "has_calling",
          "has_aaronic_priesthood", "has_melchizedek_priesthood", "ministers_to_someone", "ministered_to_by_someone",
          "has_active_temple_recommend", "visited_temple_for_baptisms"
        ],
        "baptismal_friends": [
          "baptismal_date_set_on", "current_baptismal_date", "reading", "praying", "at_church_this_sunday",
          "keeping_commandments", "member_involvement"
        ],
        "high_potential": ["name", "at_church_this_sunday"]
      };
      // A new high-potential friend is saved with this name (the column needs one); it counts as no name yet.
      const HIGH_POTENTIAL_PLACEHOLDER = "New High Potential";
      // Why a New Member's follow-up ends early, and why a friend is no longer on date: [saved code, words shown].
      const END_REASONS = [
        ["moved_out_of_mission", "Moved out of the mission"],
        ["record_removed", "Membership record removed"],
        ["deceased", "Passed away"],
        ["duplicate", "Listed twice"],
        ["other", "Other reason"]
      ];
      const DROP_REASONS = [
        ["no_longer_on_date", "Not preparing for this date now"],
        ["moved_out_of_mission", "Moved out of the mission"],
        ["duplicate", "Listed twice"],
        ["other", "Other reason"]
      ];
      // In a plan's row, the column with the person's own id (high-potential friends are only on the plan).
      const PERSON_COLUMN = { new_members: "new_member_id", baptismal_friends: "baptismal_date_person_id" };

      // =============================================================================================================
      // 5. DRAWING THE QUESTION SECTIONS
      // =============================================================================================================
      // The red star after a question that must be answered before submitting.
      const REQUIRED_MARK = ' <span class="required-mark" aria-hidden="true">*</span>';
      // Question types with one input, which gets a real <label>; the others get a title.
      const ONE_INPUT_TYPES = ["NUMBER", "TEXT", "LONG_TEXT", "DATE", "SELECT"];
      // One control per question type (the types DA Management offers). Choices, grid rows, limits and
      // placeholders come from the question list; a yes/no question stays unanswered until Yes or No is chosen.
      function questionControl(q, value) {
        const kind = String(q.question_type || "TEXT").toUpperCase(),
          key = esc(q.question_key),
          disabled = !data.can_edit ? "disabled" : "",
          placeholder = q.placeholder ? `placeholder="${esc(q.placeholder)}"` : "",
          options = q.options || [],
          pill = (type, optionValue, label, checked) => choicePill(type, key, optionValue, label, checked, disabled);
        if (kind === "GRID") return gridControl(q, value, key, disabled);
        if (kind === "BOOLEAN")
          return `<div class="choice-pills" role="radiogroup" aria-labelledby="label-${key}">${pill("radio", "true", "Yes", value === true)}${pill("radio", "false", "No", value === false)}</div>`;
        if (kind === "RADIO")
          return `<div class="choice-pills" role="radiogroup" aria-labelledby="label-${key}">${options.map((o) => pill("radio", o.value, o.label, value === o.value)).join("")}</div>`;
        if (kind === "CHECKBOX") {
          const chosen = new Set(Array.isArray(value) ? value : []);
          return `<div class="choice-pills" role="group" aria-labelledby="label-${key}">${options.map((o) => pill("checkbox", o.value, o.label, chosen.has(o.value))).join("")}</div>`;
        }
        if (kind === "SELECT")
          return `<select id="q-${key}" data-key="${key}" ${disabled}><option value="">Choose…</option>${options.map((o) => `<option value="${esc(o.value)}" ${value === o.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`;
        if (kind === "LONG_TEXT")
          return `<textarea id="q-${key}" data-key="${key}" maxlength="10000" ${placeholder} ${disabled}>${esc(value || "")}</textarea>`;
        if (kind === "TEXT")
          return `<input id="q-${key}" data-key="${key}" type="text" maxlength="1000" autocomplete="off" ${placeholder} value="${esc(value ?? "")}" ${disabled}>`;
        if (kind === "DATE")
          return `<input id="q-${key}" data-key="${key}" type="date" value="${esc(value ?? "")}" ${disabled}>`;
        return numberControl(q, value, key, placeholder, disabled);
      }
      // One choice of a Yes / No, one-of-a-list or several-of-a-list question: a radio button or a tick box.
      function choicePill(type, key, optionValue, label, checked, disabled) {
        return `<label><input type="${type}" name="q-${key}" data-key="${key}" value="${esc(optionValue)}" ${checked ? "checked" : ""} ${disabled}> ${esc(label)}</label>`;
      }
      // A grid: one row per item (for example a ward leader) and one column per choice (for example Yes / No).
      function gridControl(q, value, key, disabled) {
        const options = q.options || [],
          saved = value && typeof value === "object" && !Array.isArray(value) ? value : {},
          head = options.map((o) => `<th scope="col">${esc(o.label)}</th>`).join("");
        const rows = (q.rows || [])
          .map((row, index) => {
            const name = `q-${key}-${index}`,
              cells = options
                .map((o) => `<td><label><input type="radio" name="${name}" data-key="${key}" data-row="${esc(row.key)}" value="${esc(o.value)}" aria-label="${esc(row.label)}: ${esc(o.label)}" ${saved[row.key] === o.value ? "checked" : ""} ${disabled}><span class="grid-choice">${esc(o.label)}</span></label></td>`)
                .join("");
            return `<tr data-row="${esc(row.key)}"><th scope="row">${esc(row.label)}</th>${cells}</tr>`;
          })
          .join("");
        return `<table class="answer-grid" aria-labelledby="label-${key}"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table>`;
      }
      // A number box. A whole-number box counts its steps from min, so its limits are whole too (a min of 0.5
      // would make every whole number wrong). DA Management and the database now refuse such limits anyway.
      function numberControl(q, value, key, placeholder, disabled) {
        const whole = q.integer_only !== false,
          min = whole ? Math.ceil(Number(q.min_value ?? 0)) : q.min_value ?? 0,
          max = q.max_value != null ? `max="${esc(whole ? Math.floor(Number(q.max_value)) : q.max_value)}"` : "",
          keyboard = whole && Number(min) >= 0 ? "numeric" : "decimal";
        return `<input id="q-${key}" data-key="${key}" type="number" inputmode="${keyboard}" min="${esc(min)}" ${max} step="${whole ? 1 : "any"}" ${placeholder} value="${esc(value ?? "")}" ${disabled}>`;
      }
      // "Last week: …" under a question, from last week's plan of this unit.
      function previousText(q) {
        const value = q.previous,
          label = (choice) => (q.options || []).find((o) => o.value === choice)?.label ?? choice,
          short = (text) => (text.length > 140 ? text.slice(0, 139) + "…" : text);
        if (blank(value)) return "";
        switch (q.question_type) {
          case "BOOLEAN":
            return value === true ? "Yes" : value === false ? "No" : "";
          case "SELECT":
          case "RADIO":
            return label(value);
          case "CHECKBOX":
            return Array.isArray(value) ? value.map(label).join(", ") : "";
          case "GRID":
            if (typeof value !== "object" || Array.isArray(value)) return "";
            return short((q.rows || []).filter((row) => value[row.key] != null).map((row) => `${row.label}: ${label(value[row.key])}`).join(" · "));
          case "DATE":
            return new Date(value + "T12:00:00").toLocaleDateString();
          default:
            return short(String(value));
        }
      }
      // All question sections, in the order the server sends the questions.
      function renderQuestions() {
        return questionSections().map(questionSectionHTML).join("");
      }
      // The questions grouped by their section: [{ key, title, description, items: [questions] }].
      function questionSections() {
        const sections = new Map();
        for (const q of data.questions) {
          if (!sections.has(q.section_key))
            sections.set(q.section_key, {
              key: q.section_key,
              title: q.section_title,
              description: q.section_description,
              items: [],
            });
          sections.get(q.section_key).items.push(q);
        }
        return [...sections.values()];
      }
      function questionSectionHTML(section) {
        return (
          `<section class="panel section" id="section-${section.key}" data-section><div class="section-head"><div><h2>${esc(section.title)}</h2><p class="muted">${esc(section.description || "")}</p></div><span class="section-count">${section.items.length} ITEMS</span></div><div class="question-grid">` +
          section.items.map(questionHTML).join("") +
          "</div></section>"
        );
      }
      // One question: its title (with a star when it must be answered), its control, its help text and last
      // week's answer.
      function questionHTML(q) {
        const kind = String(q.question_type),
          key = esc(q.question_key),
          title = `${esc(q.question_label)}${q.required ? REQUIRED_MARK : ""}`,
          heading = ONE_INPUT_TYPES.includes(kind)
            ? `<label id="label-${key}" for="q-${key}">${title}</label>`
            : `<span class="q-title" id="label-${key}">${title}</span>`,
          help = q.help_text ? `<div class="help">${esc(q.help_text)}</div>` : "",
          previous = previousText(q),
          lastWeek = previous ? `<div class="previous">Last week: ${esc(previous)}</div>` : "";
        return `<div class="question ${questionWidth(kind)}" data-question="${key}" data-type="${esc(kind)}" data-required="${!!q.required}">${heading}${questionControl(q, data.answers[q.question_key])}${help}${lastWeek}</div>`;
      }
      // Long texts and lists of choices use the whole width of the section, grids too.
      function questionWidth(kind) {
        if (kind === "LONG_TEXT" || kind === "CHECKBOX" || kind === "RADIO") return "long";
        if (kind === "GRID") return "grid-question";
        return "";
      }

      // =============================================================================================================
      // 6. DRAWING THE PEOPLE SECTIONS (one tab per person)
      // =============================================================================================================
      // One question on a person card; a star marks what must be answered before submitting. Yes / No questions
      // are pills (radio buttons) that stay unset until answered; data-field sits on the pill group.
      function field(key, type = "text", value = "", { label = PEOPLE_LABELS[key], options = null, optional = false, placeholder = "" } = {}) {
        const disabled = data.can_edit ? "" : "disabled",
          mark = optional ? "" : REQUIRED_MARK;
        if (type === "yesno" || type === "yesnona") return pillField(key, type, value, label, mark, disabled);
        if (type === "select")
          return `<label class="person-field" data-wrap="${key}">${esc(label)}${mark}<select data-field="${key}" ${disabled}><option value="">Choose…</option>${options.map(([choice, text]) => `<option value="${esc(choice)}" ${value === choice ? "selected" : ""}>${esc(text)}</option>`).join("")}</select></label>`;
        if (type === "textarea")
          return `<label class="person-field wide" data-wrap="${key}">${esc(label)}${mark}<textarea data-field="${key}" ${disabled}>${esc(value || "")}</textarea></label>`;
        const max = NUMBER_MAX[key] ? `max="${NUMBER_MAX[key]}"` : "",
          limits = type === "number" ? `inputmode="decimal" min="0" ${max} step="1"` : "";
        return `<label class="person-field" data-wrap="${key}">${esc(label)}${mark}<input data-field="${key}" type="${type}" ${limits} ${placeholder ? `placeholder="${esc(placeholder)}"` : ""} value="${esc(value ?? "")}" ${disabled}></label>`;
      }
      // "yesno": Yes / No (saved as true / false); "yesnona": Yes / No / Not applicable (saved as words).
      function pillField(key, type, value, label, mark, disabled) {
        const name = "pf-" + Math.random().toString(36).slice(2), // the radio group's name, only needs to be unique
          choices = type === "yesno" ? [["true", "Yes"], ["false", "No"]] : [["yes", "Yes"], ["no", "No"], ["not_applicable", "Not applicable"]],
          current = String(value ?? "");
        return `<fieldset class="person-field pill-question" data-wrap="${key}"><legend>${esc(label)}${mark}</legend><div class="pills" data-field="${key}" data-pills="${type}">${choices.map(([choice, text]) => `<label class="pill-option"><input type="radio" name="${name}" value="${choice}" ${current === choice ? "checked" : ""} ${disabled}><span>${text}</span></label>`).join("")}</div></fieldset>`;
      }
      // The start of a person card; its data-* attributes tell the script which person and plan row it is.
      const personCardStart = (group, p) =>
        `<article class="person-card" data-person-group="${group}" data-id="${p.id}" data-person-id="${p[PERSON_COLUMN[group]] ?? ""}" data-current="${p.is_current === false ? "false" : "true"}">`;
      const shortDate = (value) =>
        value ? new Date(value + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "";
      // The name, read-only details and (on a draft this companionship may edit) the actions of a person card.
      function personHead(p, group) {
        const note = p.is_current === false ? '<p class="person-note">No longer assigned to your area, so this tab is not checked when you submit.</p>' : "";
        return `<div class="person-head"><div><h3>${esc(p.display_name)}</h3><p class="person-details">${personDetails(p, group).map(esc).join(" · ")}</p>${note}</div>${personActions(p, group)}</div>`;
      }
      // The line of details under a person's name.
      function personDetails(p, group) {
        const person = p.person || {};
        if (group !== "new_members")
          return [person.finding_source ? "Found through " + person.finding_source : "Finding source not entered yet (use Edit details)"];
        return [
          person.baptism_date && "Baptized " + shortDate(person.baptism_date),
          person.baptism_date && (person.confirmation_date ? "Confirmed " + shortDate(person.confirmation_date) : "Not confirmed yet"),
          person.finding_source && "Found through " + person.finding_source,
        ].filter(Boolean);
      }
      function personActions(p, group) {
        if (!data.can_edit || !p[PERSON_COLUMN[group]] || p.is_current === false) return "";
        const actions =
          group === "new_members"
            ? [["edit", "Edit details"], ["transfer", "Transfer"], ["end", "End follow-up"]]
            : [["baptized", "Baptized"], ["transfer", "Transfer"], ["drop", "No longer on date"], ["edit", "Edit details"], ["delete", "Delete"]];
        return `<div class="person-actions" role="group" aria-label="${esc("Manage " + p.display_name)}">${actions.map(([action, text]) => `<button type="button" class="${action === "baptized" ? "" : "secondary"} ${action === "delete" ? "danger" : ""}" data-person-action="${action}">${text}</button>`).join("")}</div>`;
      }
      function renderBaptismal() {
        return personSection(
          "baptismal-friends",
          "Friends with a Baptismal Date",
          "Friends preparing for baptism and confirmation.",
          data.people.baptismal_friends.map(baptismalCard),
          "No friends with a baptismal date on this week's plan yet.",
          "baptismal_friends",
        );
      }
      // A friend's card: the baptismal date, and how they progressed this week.
      function baptismalCard(p) {
        const dates = personGrid([
          field("baptismal_date_set_on", "date", p.baptismal_date_set_on),
          field("current_baptismal_date", "date", p.current_baptismal_date),
        ]);
        const thisWeek = personGrid([
          field("reading", "yesno", p.reading),
          field("praying", "yesno", p.praying),
          field("at_church_this_sunday", "yesno", p.at_church_this_sunday),
          field("keeping_commandments", "yesno", p.keeping_commandments),
          field("member_involvement", "yesno", p.member_involvement),
        ]);
        return personCardStart("baptismal_friends", p) + personHead(p, "baptismal_friends") + dates +
          '<h4 class="person-subhead">This week</h4>' + thisWeek + "</article>";
      }
      // The questions of a card, side by side (three on a computer, one below the other on a phone).
      function personGrid(fields) {
        return `<div class="person-grid">${fields.join("")}</div>`;
      }
      function renderNewMembers() {
        return personSection(
          "new-members",
          "New Member Follow-up",
          "New members in their first year. Plan with the ward how to help each one take their next step. Everything is required unless it says (optional).",
          data.people.new_members.map(newMemberCard),
          "No new members on this week's plan yet.",
          "new_members",
        );
      }
      // A New Member's card: lessons, this week, the covenant path and GEMIKO (ward coordination).
      function newMemberCard(p) {
        const lessons = personGrid([
          field("lessons_actual", "number", p.lessons_actual),
          field("lessons_goal", "number", p.lessons_goal),
          field("pmg_lessons_percentage", "number", p.pmg_lessons_percentage),
          field("how_are_they_doing", "textarea", p.how_are_they_doing),
        ]);
        const thisWeek = personGrid([
          field("at_church_this_sunday", "yesno", p.at_church_this_sunday),
          field("reading", "yesno", p.reading),
          field("praying", "yesno", p.praying),
          field("member_involvement", "yesno", p.member_involvement),
        ]);
        const covenantPath = personGrid([
          field("next_ordinance", "select", p.next_ordinance, { options: NEXT_ORDINANCES }),
          field("has_calling", "yesnona", p.has_calling),
          field("has_aaronic_priesthood", "yesnona", p.has_aaronic_priesthood),
          field("has_melchizedek_priesthood", "yesnona", p.has_melchizedek_priesthood),
          field("ministers_to_someone", "yesnona", p.ministers_to_someone),
          field("ministered_to_by_someone", "yesno", p.ministered_to_by_someone),
          field("has_active_temple_recommend", "yesnona", p.has_active_temple_recommend),
          field("visited_temple_for_baptisms", "yesnona", p.visited_temple_for_baptisms),
        ]);
        // The support plan is only shown while "Discussed in GEMIKO?" is Yes (toggleGemiko).
        const gemiko = personGrid([
          field("discussed_in_gemiko", "yesno", p.discussed_in_gemiko),
          `<div class="gemiko-details ${p.discussed_in_gemiko === true ? "" : "hidden"}">${field("gemiko_support_plan", "textarea", p.gemiko_support_plan)}</div>`,
        ]);
        return [
          personCardStart("new_members", p),
          personHead(p, "new_members"),
          lessons,
          '<h4 class="person-subhead">This week</h4>',
          thisWeek,
          '<h4 class="person-subhead">Covenant path</h4>',
          '<p class="person-details person-help">Choose Not applicable when a question does not apply, for example priesthood for sisters or children.</p>',
          covenantPath,
          '<h4 class="person-subhead">GEMIKO</h4>',
          gemiko,
          "</article>",
        ].join("");
      }
      function renderHighPotential() {
        return personSection(
          "high-potential",
          "High-Potential Friends",
          "Friends who could soon be taught. Each tab is saved right away.",
          data.people.high_potential.map(highCard),
          "No high-potential friends yet.",
          "high_potential",
        );
      }
      // A high-potential friend's card: a name, church this Sunday and notes. A new friend has no name yet.
      function highCard(p = {}) {
        const questions = personGrid([
          field("name", "text", p.name === HIGH_POTENTIAL_PLACEHOLDER ? "" : p.name, { placeholder: "Friend's name" }),
          field("at_church_this_sunday", "yesno", p.at_church_this_sunday),
          field("notes", "textarea", p.notes, { label: "Notes (optional)", optional: true }),
        ]);
        const remove = data.can_edit ? '<button type="button" class="remove-person">Remove from this week</button>' : "";
        return `<article class="person-card" data-person-group="high_potential" data-id="${p.id || ""}" data-current="true">${questions}${remove}</article>`;
      }
      // The words on a person's tab.
      const tabLabel = (kind, p) =>
        kind === "high_potential" ? (p.name && p.name !== HIGH_POTENTIAL_PLACEHOLDER ? p.name : "New friend") : p.display_name;
      // The button at the end of each tab row that creates a person.
      const ADD_TAB_LABELS = { new_members: "+ New member", baptismal_friends: "+ Add person on date", high_potential: "+ Add friend" };
      // One tab per person. Every card stays in the page (hidden when its tab is not
      // selected) so changes on any of them are saved.
      const activeTab = {}; // the row id of the selected tab, per group
      let selectAfterLoad = null; // the tab to select when the plan is drawn next: { kind, rowId } or { kind, personId }
      function personSection(id, title, description, cards, empty, kind) {
        const people = data.people[kind] || [];
        chooseActiveTab(kind, people);
        const tabs = people.map((p) => personTabHTML(kind, p)).join(""),
          panels = people
            .map((p, index) => `<div role="tabpanel" id="panel-${kind}-${p.id}" aria-labelledby="tab-${kind}-${p.id}" ${String(p.id) === activeTab[kind] ? "" : "hidden"}>${cards[index]}</div>`)
            .join(""),
          addTab = data.can_edit ? `<button type="button" class="person-tab add-tab" data-create="${kind}">${ADD_TAB_LABELS[kind]}</button>` : "";
        return [
          `<section class="panel section" id="section-${id}" data-section data-people-kind="${kind}">`,
          `<div class="section-head"><div><h2>${title}</h2><p class="muted">${description}</p></div>${addFromListButton(kind)}</div>`,
          `<div class="person-tabs"><div class="person-tablist" role="tablist" aria-label="${esc(title)}">${tabs}</div>${addTab}</div>`,
          `<div class="person-panels">${panels || `<div class="empty">${empty}</div>`}</div>`,
          "</section>",
        ].join("");
      }
      // Keeps the selected tab, or selects the person just added (selectAfterLoad), or else the first person.
      function chooseActiveTab(kind, people) {
        if (selectAfterLoad?.kind === kind) {
          const wanted = selectAfterLoad,
            row = people.find((p) =>
              wanted.rowId ? String(p.id) === String(wanted.rowId) : String(p[PERSON_COLUMN[kind]]) === String(wanted.personId),
            );
          if (row) activeTab[kind] = String(row.id);
          selectAfterLoad = null;
        }
        if (!people.some((p) => String(p.id) === activeTab[kind])) activeTab[kind] = people.length ? String(people[0].id) : null;
      }
      function personTabHTML(kind, p) {
        const selected = String(p.id) === activeTab[kind];
        return `<button type="button" role="tab" class="person-tab" id="tab-${kind}-${p.id}" aria-controls="panel-${kind}-${p.id}" aria-selected="${selected}" tabindex="${selected ? 0 : -1}" data-tab-id="${p.id}"><span class="tab-name">${esc(tabLabel(kind, p))}</span></button>`;
      }
      // "+ Add from list (2)": people listed for the area and not on this plan yet (not for high-potential friends).
      function addFromListButton(kind) {
        if (!data.can_edit || kind === "high_potential") return "";
        const available = data.available_people?.[kind] || [];
        return `<button class="secondary add-existing" data-kind="${kind}" type="button">+ Add from list${available.length ? " (" + available.length + ")" : ""}</button>`;
      }
      // The tab button of the panel a person card is in.
      const tabOf = (panel) => panel && $(panel.getAttribute("aria-labelledby"));
      // Shows one person's card in a people section. quiet: without scrolling the tab row.
      function selectPersonTab(section, tab, focus = false, quiet = false) {
        const kind = section.dataset.peopleKind;
        activeTab[kind] = tab.dataset.tabId;
        for (const other of section.querySelectorAll('[role="tab"]')) {
          const on = other === tab;
          other.setAttribute("aria-selected", on);
          other.tabIndex = on ? 0 : -1;
          $(other.getAttribute("aria-controls")).hidden = !on;
        }
        if (focus) tab.focus();
        if (!quiet) tab.scrollIntoView({ block: "nearest", inline: "nearest" });
      }
      // Opens the person tab that holds this element, when it is hidden.
      function openTabOf(element) {
        const panel = element.closest('[role="tabpanel"]');
        if (panel?.hidden) selectPersonTab(panel.closest("[data-people-kind]"), tabOf(panel), false, true);
      }
      // The tabs work with a click, and with the arrow keys, Home and End like other tab rows.
      function setupPersonTabs() {
        for (const section of form.querySelectorAll("[data-people-kind]")) {
          const list = section.querySelector('[role="tablist"]');
          list.addEventListener("click", (event) => {
            const tab = event.target.closest('[role="tab"]');
            if (tab) selectPersonTab(section, tab);
          });
          list.addEventListener("keydown", (event) => moveBetweenTabs(event, section, list));
          section.querySelector("[data-create]")?.addEventListener("click", (event) =>
            section.dataset.peopleKind === "high_potential" ? addHighPotential(event.currentTarget) : openCreatePerson(section.dataset.peopleKind),
          );
          section.addEventListener("click", (event) => {
            const button = event.target.closest("[data-person-action]");
            if (button) openPersonAction(button.dataset.personAction, button.closest("[data-person-group]"));
          });
        }
      }
      function moveBetweenTabs(event, section, list) {
        const tabs = [...list.querySelectorAll('[role="tab"]')],
          index = tabs.indexOf(document.activeElement);
        if (index < 0) return;
        const next = { ArrowRight: index + 1, ArrowLeft: index - 1, Home: 0, End: tabs.length - 1 }[event.key];
        if (next === undefined) return;
        event.preventDefault();
        selectPersonTab(section, tabs[(next + tabs.length) % tabs.length], true);
      }

      // =============================================================================================================
      // 7. DRAWING THE WHOLE PLAN
      // =============================================================================================================
      // Draws everything from "data": the ward or branch list, the week line, the form and the save bar.
      function render() {
        fillUnitSelect();
        showWeekLine();
        form.innerHTML = lockedNote() + renderQuestions() + renderBaptismal() + renderNewMembers() + renderHighPotential();
        buildSectionNav();
        wirePeopleButtons();
        setupPersonTabs();
        updateConditionalQuestions();
        $("actions").hidden = !data.can_edit; // a submitted plan has nothing to save or submit
        updateProgress();
      }
      // The ward or branch of the plan. Most areas have only one: then its name is shown as text, because a list with
      // one choice does nothing.
      function fillUnitSelect() {
        const onlyOne = data.units.length === 1;
        unitSelect.hidden = onlyOne;
        $("unitName").hidden = !onlyOne;
        $("unitName").textContent = onlyOne ? data.units[0].unit : "";
        unitSelect.innerHTML = data.units
          .map((u) => `<option value="${u.unit_id}" ${u.unit_id === data.report.unit_id ? "selected" : ""}>${esc(u.unit)}</option>`)
          .join("");
      }
      const STATUS_WORDS = { DRAFT: "Not submitted yet", SUBMITTED: "Submitted", LOCKED: "Locked" };
      function showWeekLine() {
        const sunday = new Date(data.report.sunday + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
        $("weekText").textContent = `Week ending ${sunday} · ${STATUS_WORDS[data.report.status] || data.report.status}`;
      }
      function lockedNote() {
        return !data.can_edit
          ? '<div class="locked">This plan is submitted and read only. A leader must unlock it before changes can be made.</div>'
          : "";
      }
      // "+ Add from list" and "Remove from this week" (their buttons are new after each drawing).
      function wirePeopleButtons() {
        for (const button of form.querySelectorAll(".add-existing")) button.onclick = () => openPersonPicker(button.dataset.kind);
        for (const button of form.querySelectorAll(".remove-person")) button.onclick = () => removeFriend(button.closest(".person-card"));
      }
