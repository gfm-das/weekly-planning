# The Supabase stack (database, sign-in, REST, Kong gateway, Studio, storage, edge functions...) exported from the first
# Coolify install and trimmed. Do not edit it for local settings: use beta-override.yml and supabase/.env. Start it with the
# command at the top of beta-override.yml.

services:
  supabase-kong:
    image: 'kong/kong:3.9.1'
    entrypoint: /home/kong/kong-entrypoint.sh
    depends_on:
      supabase-analytics:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - kong
        - health
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      SERVICE_URL_SUPABASEKONG_8000: 'http://localhost:8000'
      KONG_PORT_MAPS: '443:8000'
      JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: 'LAST,A,CNAME'
      KONG_DNS_NOT_FOUND_TTL: '1'
      KONG_PLUGINS: 'request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function'
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: '64 160k'
      KONG_PROXY_ACCESS_LOG: '/dev/stdout combined'
      SUPABASE_ANON_KEY: '${SERVICE_SUPABASEANON_KEY}'
      SUPABASE_SERVICE_KEY: '${SERVICE_SUPABASESERVICE_KEY}'
      SUPABASE_PUBLISHABLE_KEY: ''
      SUPABASE_SECRET_KEY: ''
      ANON_KEY_ASYMMETRIC: ''
      SERVICE_ROLE_KEY_ASYMMETRIC: '${SERVICE_ROLE_KEY_ASYMMETRIC:-}'
      DASHBOARD_USERNAME: '${SERVICE_USER_ADMIN}'
      DASHBOARD_PASSWORD: '${SERVICE_PASSWORD_ADMIN}'
      KONG_STORAGE_CONNECT_TIMEOUT: '60'
      KONG_STORAGE_WRITE_TIMEOUT: '3600'
      KONG_STORAGE_READ_TIMEOUT: '3600'
      KONG_STORAGE_REQUEST_BUFFERING: 'false'
      KONG_STORAGE_RESPONSE_BUFFERING: 'false'
      SUPERSET_URL: '${SUPERSET_URL}'
      SUPERSET_USERNAME: '${SUPERSET_USERNAME}'
      SUPERSET_PASSWORD: '${SUPERSET_PASSWORD}'
      SUPERSET_DASHBOARD_ID: '${SUPERSET_DASHBOARD_ID}'
    volumes:
      - './config/kong/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh'
      - './config/kong/kong.yml:/home/kong/temp.yml'
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-studio:
    image: 'supabase/studio:2026.03.16-sha-5528817'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      supabase-analytics:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: 'http://supabase-meta:8080'
      POSTGRES_PASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
      POSTGRES_HOST: supabase-db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: postgres
      PGRST_DB_SCHEMAS: 'public,storage,graphql_public'
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: '${STUDIO_DEFAULT_ORGANIZATION:-Default Organization}'
      DEFAULT_PROJECT_NAME: '${STUDIO_DEFAULT_PROJECT:-Default Project}'
      SUPABASE_URL: 'http://supabase-kong:8000'
      SUPABASE_PUBLIC_URL: '${SERVICE_URL_SUPABASEKONG}'
      SUPABASE_ANON_KEY: '${SERVICE_SUPABASEANON_KEY}'
      SUPABASE_SERVICE_KEY: '${SERVICE_SUPABASESERVICE_KEY}'
      AUTH_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      PG_META_CRYPTO_KEY: '${SERVICE_PASSWORD_PGMETACRYPTO}'
      LOGFLARE_API_KEY: '${SERVICE_PASSWORD_LOGFLARE}'
      LOGFLARE_PUBLIC_ACCESS_TOKEN: '${SERVICE_PASSWORD_LOGFLARE}'
      LOGFLARE_PRIVATE_ACCESS_TOKEN: '${SERVICE_PASSWORD_LOGFLAREPRIVATE}'
      LOGFLARE_URL: 'http://supabase-analytics:4000'
      NEXT_PUBLIC_SUPABASE_URL: '${SERVICE_URL_SUPABASEKONG}'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: '${SERVICE_SUPABASEANON_KEY}'
      NEXT_PUBLIC_ENABLE_LOGS: 'true'
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
      STUDIO_DEFAULT_ORGANIZATION: 'Default Organization'
      STUDIO_DEFAULT_PROJECT: 'Default Project'
    volumes:
      - 'gfm-supabase-snippets:/app/snippets'
      - './functions:/app/edge-functions'
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-db:
    image: 'supabase/postgres:15.8.1.085'
    healthcheck:
      test: 'pg_isready -U postgres -h 127.0.0.1'
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      supabase-vector:
        condition: service_healthy
    command:
      - postgres
      - '-c'
      - config_file=/etc/postgresql/postgresql.conf
      - '-c'
      - log_min_messages=fatal
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: '${POSTGRES_PORT:-5432}'
      POSTGRES_PORT: '5432'
      PGPASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
      POSTGRES_PASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
      PGDATABASE: '${POSTGRES_DB:-postgres}'
      POSTGRES_DB: postgres
      JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      JWT_EXP: '${JWT_EXPIRY:-3600}'
      JWT_EXPIRY: '3600'
    volumes:
      - 'gfm-supabase-db-data:/var/lib/postgresql/data'
      - './config/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql'
      - './config/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql'
      - './config/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql'
      - './config/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql'
      - './config/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql'
      - './config/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql'
      - './config/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql'
      - 'gfm-supabase-db-config:/etc/postgresql-custom'
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-analytics:
    image: 'supabase/logflare:1.31.2'
    healthcheck:
      test:
        - CMD
        - curl
        - 'http://127.0.0.1:4000/health'
      timeout: 5s
      interval: 5s
      retries: 10
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      LOGFLARE_NODE_HOST: 127.0.0.1
      DB_USERNAME: supabase_admin
      DB_DATABASE: _supabase
      DB_HOSTNAME: '${POSTGRES_HOSTNAME:-supabase-db}'
      DB_PORT: '${POSTGRES_PORT:-5432}'
      DB_PASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
      DB_SCHEMA: _analytics
      LOGFLARE_PUBLIC_ACCESS_TOKEN: '${SERVICE_PASSWORD_LOGFLARE}'
      LOGFLARE_PRIVATE_ACCESS_TOKEN: '${SERVICE_PASSWORD_LOGFLAREPRIVATE}'
      LOGFLARE_SINGLE_TENANT: 'true'
      LOGFLARE_SUPABASE_MODE: 'true'
      POSTGRES_BACKEND_URL: 'postgresql://supabase_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/_supabase'
      POSTGRES_BACKEND_SCHEMA: _analytics
      LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true
      POSTGRES_HOSTNAME: supabase-db
      POSTGRES_PORT: '5432'
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-vector:
    image: 'timberio/vector:0.53.0-alpine'
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - 'http://supabase-vector:9001/health'
      timeout: 5s
      interval: 5s
      retries: 3
    volumes:
      - './config/vector/vector.yml:/etc/vector/vector.yml'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    environment:
      LOGFLARE_PUBLIC_ACCESS_TOKEN: '${SERVICE_PASSWORD_LOGFLARE}'
    command:
      - '--config'
      - /etc/vector/vector.yml
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-rest:
    image: 'postgrest/postgrest:v14.6'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    environment:
      PGRST_DB_URI: 'postgres://authenticator:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}'
      PGRST_DB_SCHEMAS: 'public,storage,graphql_public'
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      PGRST_APP_SETTINGS_JWT_EXP: '${JWT_EXPIRY:-3600}'
      JWT_EXPIRY: '3600'
    command: postgrest
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-auth:
    image: 'supabase/gotrue:v2.186.0'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - 'http://127.0.0.1:9999/health'
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: 'http://localhost:8000/auth/v1'
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: 'postgres://supabase_auth_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}'
      GOTRUE_SITE_URL: 'http://localhost/'
      GOTRUE_URI_ALLOW_LIST: '${ADDITIONAL_REDIRECT_URLS:-http://localhost:8090}'
      GOTRUE_DISABLE_SIGNUP: '${DISABLE_SIGNUP:-false}'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: '${JWT_EXPIRY:-3600}'
      GOTRUE_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: '${ENABLE_EMAIL_SIGNUP:-true}'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: '${ENABLE_ANONYMOUS_USERS:-false}'
      GOTRUE_MAILER_AUTOCONFIRM: '${ENABLE_EMAIL_AUTOCONFIRM:-false}'
      GOTRUE_SMTP_ADMIN_EMAIL: '${SMTP_ADMIN_EMAIL}'
      GOTRUE_SMTP_HOST: '${SMTP_HOST}'
      GOTRUE_SMTP_PORT: '${SMTP_PORT:-587}'
      GOTRUE_SMTP_USER: '${SMTP_USER}'
      GOTRUE_SMTP_PASS: '${SMTP_PASS}'
      GOTRUE_SMTP_SENDER_NAME: '${SMTP_SENDER_NAME}'
      GOTRUE_MAILER_URLPATHS_INVITE: '${MAILER_URLPATHS_INVITE:-/auth/v1/verify}'
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: '${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}'
      GOTRUE_MAILER_URLPATHS_RECOVERY: '${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}'
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: '${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}'
      GOTRUE_MAILER_TEMPLATES_INVITE: '${MAILER_TEMPLATES_INVITE}'
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: '${MAILER_TEMPLATES_CONFIRMATION}'
      GOTRUE_MAILER_TEMPLATES_RECOVERY: '${MAILER_TEMPLATES_RECOVERY}'
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: '${MAILER_TEMPLATES_MAGIC_LINK}'
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: '${MAILER_TEMPLATES_EMAIL_CHANGE}'
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: '${MAILER_SUBJECTS_CONFIRMATION}'
      GOTRUE_MAILER_SUBJECTS_RECOVERY: '${MAILER_SUBJECTS_RECOVERY}'
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: '${MAILER_SUBJECTS_MAGIC_LINK}'
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: '${MAILER_SUBJECTS_EMAIL_CHANGE}'
      GOTRUE_MAILER_SUBJECTS_INVITE: '${MAILER_SUBJECTS_INVITE}'
      GOTRUE_EXTERNAL_PHONE_ENABLED: '${ENABLE_PHONE_SIGNUP:-false}'
      GOTRUE_SMS_AUTOCONFIRM: '${ENABLE_PHONE_AUTOCONFIRM:-false}'
      ADDITIONAL_REDIRECT_URLS: 'http://localhost/*'
      DISABLE_SIGNUP: 'false'
      JWT_EXPIRY: '3600'
      ENABLE_EMAIL_SIGNUP: 'true'
      ENABLE_ANONYMOUS_USERS: 'false'
      ENABLE_EMAIL_AUTOCONFIRM: 'false'
      SMTP_ADMIN_EMAIL: '${SMTP_ADMIN_EMAIL}'
      SMTP_HOST: '${SMTP_HOST}'
      SMTP_PORT: '${SMTP_PORT:-587}'
      SMTP_USER: '${SMTP_USER}'
      SMTP_PASS: '${SMTP_PASS}'
      SMTP_SENDER_NAME: '${SMTP_SENDER_NAME}'
      MAILER_URLPATHS_INVITE: /auth/v1/verify
      MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      MAILER_TEMPLATES_INVITE: null
      MAILER_TEMPLATES_CONFIRMATION: null
      MAILER_TEMPLATES_RECOVERY: null
      MAILER_TEMPLATES_MAGIC_LINK: null
      MAILER_TEMPLATES_EMAIL_CHANGE: null
      MAILER_SUBJECTS_CONFIRMATION: null
      MAILER_SUBJECTS_RECOVERY: null
      MAILER_SUBJECTS_MAGIC_LINK: null
      MAILER_SUBJECTS_EMAIL_CHANGE: null
      MAILER_SUBJECTS_INVITE: null
      ENABLE_PHONE_SIGNUP: 'true'
      ENABLE_PHONE_AUTOCONFIRM: 'true'
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  realtime-dev:
    image: 'supabase/realtime:v2.76.5'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - '-sSfL'
        - '--head'
        - '-o'
        - /dev/null
        - '-H'
        - 'Authorization: Bearer ${SERVICE_SUPABASEANON_KEY}'
        - 'http://127.0.0.1:4000/api/tenants/realtime-dev/health'
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      PORT: '4000'
      DB_HOST: '${POSTGRES_HOSTNAME:-supabase-db}'
      DB_PORT: '${POSTGRES_PORT:-5432}'
      DB_USER: supabase_admin
      DB_PASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
      DB_NAME: '${POSTGRES_DB:-postgres}'
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      SECRET_KEY_BASE: '${SECRET_PASSWORD_REALTIME}'
      METRICS_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      ERL_AFLAGS: '-proto_dist inet_tcp'
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      LOG_LEVEL: error
      RUN_JANITOR: 'true'
      JANITOR_INTERVAL: '60000'
      DISABLE_HEALTHCHECK_LOGGING: 'true'
      POSTGRES_HOSTNAME: supabase-db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: postgres
      SECRET_PASSWORD_REALTIME: null
    command: "sh -c \"/app/bin/migrate && /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)' && /app/bin/server\"\n"
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-minio:
    image: 'ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z'
    environment:
      MINIO_ROOT_USER: '${SERVICE_USER_MINIO}'
      MINIO_ROOT_PASSWORD: '${SERVICE_PASSWORD_MINIO}'
    command: 'server --console-address ":9001" /data'
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 20s
      retries: 10
    volumes:
      - 'gfm-supabase-storage:/data'
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  minio-createbucket:
    image: 'quay.io/minio/mc:latest'
    restart: 'no'
    environment:
      MINIO_ROOT_USER: '${SERVICE_USER_MINIO}'
      MINIO_ROOT_PASSWORD: '${SERVICE_PASSWORD_MINIO}'
    depends_on:
      supabase-minio:
        condition: service_healthy
    entrypoint:
      - /entrypoint.sh
    volumes:
      - './config/minio/entrypoint.sh:/entrypoint.sh'
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-storage:
    image: 'supabase/storage-api:v1.44.2'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
      imgproxy:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--tries=1'
        - '--spider'
        - 'http://127.0.0.1:5000/status'
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      SERVER_PORT: '5000'
      SERVER_REGION: local
      MULTI_TENANT: 'false'
      AUTH_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      DATABASE_URL: 'postgres://supabase_storage_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}'
      DB_INSTALL_ROLES: 'false'
      STORAGE_BACKEND: s3
      STORAGE_S3_BUCKET: stub
      STORAGE_S3_ENDPOINT: 'http://supabase-minio:9000'
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      STORAGE_S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: '${SERVICE_USER_MINIO}'
      AWS_SECRET_ACCESS_KEY: '${SERVICE_PASSWORD_MINIO}'
      UPLOAD_FILE_SIZE_LIMIT: '524288000'
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: '524288000'
      UPLOAD_SIGNED_URL_EXPIRATION_TIME: '120'
      TUS_URL_PATH: /upload/resumable
      TUS_MAX_SIZE: '3600000'
      ENABLE_IMAGE_TRANSFORMATION: 'true'
      IMGPROXY_URL: 'http://imgproxy:8080'
      IMGPROXY_REQUEST_TIMEOUT: '15'
      DATABASE_SEARCH_PATH: storage
      NODE_ENV: production
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      ANON_KEY: '${SERVICE_SUPABASEANON_KEY}'
      SERVICE_KEY: '${SERVICE_SUPABASESERVICE_KEY}'
      POSTGREST_URL: 'http://supabase-rest:3000'
      PGRST_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      STORAGE_PUBLIC_URL: '${SERVICE_URL_SUPABASEKONG}'
      TENANT_ID: '${STORAGE_TENANT_ID:-storage-single-tenant}'
      STORAGE_TENANT_ID: storage-single-tenant
    volumes:
      - 'gfm-supabase-storage:/var/lib/storage'
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  imgproxy:
    image: 'darthsim/imgproxy:v3.30.1'
    healthcheck:
      test:
        - CMD
        - imgproxy
        - health
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ':8080'
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: 'true'
      IMGPROXY_AUTO_WEBP: 'true'
      IMGPROXY_MAX_SRC_RESOLUTION: '16.8'
    volumes:
      - 'gfm-supabase-storage:/var/lib/storage'
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-meta:
    image: 'supabase/postgres-meta:v0.95.2'
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    environment:
      PG_META_PORT: '8080'
      PG_META_DB_HOST: '${POSTGRES_HOSTNAME:-supabase-db}'
      PG_META_DB_PORT: '${POSTGRES_PORT:-5432}'
      PG_META_DB_NAME: '${POSTGRES_DB:-postgres}'
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
      CRYPTO_KEY: '${SERVICE_PASSWORD_PGMETACRYPTO}'
      POSTGRES_HOSTNAME: supabase-db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: postgres
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-edge-functions:
    image: 'supabase/edge-runtime:v1.71.2'
    depends_on:
      supabase-analytics:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - echo
        - 'Edge Functions is healthy'
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      SUPABASE_URL: 'http://supabase-kong:8000'
      SUPABASE_PUBLIC_URL: '${SERVICE_URL_SUPABASEKONG}'
      SUPABASE_ANON_KEY: '${SERVICE_SUPABASEANON_KEY}'
      SUPABASE_SERVICE_ROLE_KEY: '${SERVICE_SUPABASESERVICE_KEY}'
      SUPABASE_DB_URL: 'postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}'
      VERIFY_JWT: '${FUNCTIONS_VERIFY_JWT:-false}'
      FUNCTIONS_VERIFY_JWT: 'false'
    volumes:
      - './functions:/home/deno/functions'
      - 'gfm-supabase-deno-cache:/root/.cache/deno'
      - './functions/main/index.ts:/home/deno/functions/main/index.ts'
      - './functions/hello/index.ts:/home/deno/functions/hello/index.ts'
    command:
      - start
      - '--main-service'
      - /home/deno/functions/main
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
  supabase-supavisor:
    image: 'supabase/supavisor:2.7.4'
    healthcheck:
      test:
        - CMD
        - curl
        - '-sSfL'
        - '-o'
        - /dev/null
        - 'http://127.0.0.1:4000/api/health'
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 30s
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-analytics:
        condition: service_healthy
    environment:
      POOLER_TENANT_ID: dev_tenant
      POOLER_POOL_MODE: transaction
      POOLER_DEFAULT_POOL_SIZE: '20'
      POOLER_MAX_CLIENT_CONN: '100'
      PORT: '4000'
      POSTGRES_PORT: '5432'
      POSTGRES_HOSTNAME: supabase-db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: '${SERVICE_PASSWORD_POSTGRES}'
      DATABASE_URL: 'ecto://supabase_admin:${SERVICE_PASSWORD_POSTGRES}@${POSTGRES_HOSTNAME:-supabase-db}:${POSTGRES_PORT:-5432}/_supabase'
      CLUSTER_POSTGRES: 'true'
      SECRET_KEY_BASE: '${SERVICE_PASSWORD_SUPAVISORSECRET}'
      VAULT_ENC_KEY: '${SERVICE_PASSWORD_VAULTENC}'
      API_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      METRICS_JWT_SECRET: '${SERVICE_PASSWORD_JWT}'
      REGION: local
      ERL_AFLAGS: '-proto_dist inet_tcp'
      DB_POOL_SIZE: '${POOLER_DB_POOL_SIZE:-5}'
      GLOBAL_DOWNSTREAM_CERT_PATH: /etc/ssl/server.crt
      GLOBAL_DOWNSTREAM_KEY_PATH: /etc/ssl/server.key
      POOLER_DB_POOL_SIZE: '5'
    command:
      - /bin/sh
      - '-c'
      - "if [ ! -f /etc/ssl/server.crt ]; then\n  openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \\\n    -keyout /etc/ssl/server.key -out /etc/ssl/server.crt \\\n    -subj \"/CN=supabase-pooler\"\nfi\n/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server\n"
    volumes:
      - './config/pooler/pooler.exs:/etc/pooler/pooler.exs'
    restart: unless-stopped
    networks:
      gfm-network: null
    env_file:
      - .env
volumes:
  gfm-supabase-db-data:
    name: gfm-supabase-db-data
  gfm-supabase-db-config:
    name: gfm-supabase-db-config
  gfm-supabase-deno-cache:
    name: gfm-supabase-deno-cache
  gfm-supabase-storage:
    name: gfm-supabase-storage
  gfm-supabase-snippets:
    name: gfm-supabase-snippets
networks:
  gfm-network:
    name: gfm-network
    external: true









